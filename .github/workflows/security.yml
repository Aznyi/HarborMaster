name: Security

# The scanning that is not CodeQL: known vulnerabilities in dependencies, in the
# container image, and in the source tree; plus the linters that catch the
# security-relevant mistakes a compiler does not.
#
# Every job here is a release gate. See docs/engineering/definition-of-done.md.
#
# A NOTE ON THE TRIVY PIN, because the obvious "revert to the older, known-good
# SHA" is the wrong move here.
#
# aquasecurity/trivy-action carries a DEFAULT Trivy version inside it, and
# v0.33.1's default was Trivy v0.65.0. Upstream subsequently withdrew that
# release: the tag returns 404 and it no longer appears in the release list at
# all. The action's install script resolves the version, downloads the tarball,
# gets a 404, and exits 1 having printed nothing about why -- so the job fails
# with a bare "Process completed with exit code 1" and no clue.
#
# Pinning an action by SHA pins the action, not the artifact the action fetches
# at runtime. That distinction is the whole failure. Anything here that
# downloads a release at runtime can break without a commit on our side, so
# when one of these jobs fails at its INSTALL step, check whether the artifact
# still exists before assuming the workflow is at fault.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily. A dependency advisory published today should not wait for the next
    # commit to be noticed.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------- Go deps --
  govulncheck:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # govulncheck is reachability-aware: it reports only advisories whose
      # vulnerable symbols this code actually calls, so a finding here is a real
      # exposure rather than a version-range match.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan
        run: govulncheck ./...

  # --------------------------------------------------------------- Go lint --
  golangci-lint:
    name: Go lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # THE LINTER'S OWN Go VERSION MATTERS, and it is not obvious.
      #
      # golangci-lint type-checks with the go/types package compiled INTO its
      # binary, so a release built with Go 1.25 cannot parse the Go 1.26
      # standard library. It does not report that as a lint finding -- it
      # panics:
      #
      #   panic: file requires newer Go version go1.26
      #         (application built with go1.25)
      #
      # v2.6.2's released binary is built with go1.25.3; v2.12.2's with
      # go1.26.2. So this pin has a floor set by GO_VERSION above, and the two
      # must move together: raising GO_VERSION without raising this produces a
      # panic and a stack trace rather than a comprehensible failure.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          # The config lives in .golangci.yml so the same rules run locally.
          args: --timeout=6m

  # ------------------------------------------------------- filesystem scan --
  trivy-fs:
    name: Filesystem and config scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Covers dependency manifests AND infrastructure config: the Dockerfile
      # and the Compose files are scanned for misconfiguration here, which is
      # the check that would notice a dropped `no-new-privileges` or a
      # reintroduced root user.
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Assessed-and-accepted findings, each with a reason and an expiry.
          trivyignores: .trivyignore.yaml
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0" # Reporting job; the gate below fails the build.

      # Guarded on the file rather than `always()`. When the scan step itself
      # fails, `always()` runs this too and it reports "Path does not exist:
      # trivy-fs.sarif" -- a second, louder error that describes a symptom and
      # buries the actual failure above it.
      - name: Upload results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.32.2
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Separate from the SARIF upload so the Security tab keeps the full
      # picture (including MEDIUM) while the build only fails on what the
      # Definition of Done actually blocks on.
      - name: Fail on High or Critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Assessed-and-accepted findings, each with a reason and an expiry.
          trivyignores: .trivyignore.yaml
          scan-type: fs
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ------------------------------------------------------------ image scan --
  trivy-image:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t harbormaster:scan .

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Assessed-and-accepted findings, each with a reason and an expiry.
          trivyignores: .trivyignore.yaml
          image-ref: harbormaster:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.32.2
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # ignore-unfixed: a distroless base with an unfixed advisory is not
      # something this repository can act on, and failing on it would train
      # everyone to ignore the job.
      - name: Fail on fixable High or Critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Assessed-and-accepted findings, each with a reason and an expiry.
          trivyignores: .trivyignore.yaml
          image-ref: harbormaster:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ----------------------------------------------------------- npm audit ----
  npm-audit:
    name: Frontend dependencies (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Production dependencies are what ships in the bundle, so they are the
      # gate. Dev dependencies are reported but do not fail the build: a build
      # tool advisory matters, but it does not reach an operator's browser.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (report only)
        run: npm audit || true

  # ------------------------------------------------- secret scan of history --
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed and later removed is still a secret
          # that leaked, and shallow clones would miss it.
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
