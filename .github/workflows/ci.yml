name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The exact patch, not the line. "1.26" resolved to go1.26.5 on a runner while
  # the release image was built with go1.26.6, so the gates and the artefact
  # disagreed about which standard library was compiled in. Moves together with
  # security.yml, codeql.yml, and the Dockerfile's GO_IMAGE.
  GO_VERSION: "1.26.6"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (format, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo, so it is enabled for this step only. The
      # shipped binary is still built with CGO_ENABLED=0.
      #
      # -race is not optional here: the event engine owns several long-lived
      # goroutines and a bounded queue, and the detector is what stops a data
      # race reaching a release.
      #
      # The timeout is stated rather than left at `go test`'s ten-minute
      # default. The store package runs several hundred tests against real
      # SQLite databases, and under -race the pure-Go driver is instrumented
      # statement by statement -- close enough to the default that CI once
      # failed on the timeout rather than on a test. An explicit bound makes the
      # limit a decision, and keeps a genuine deadlock a loud failure rather
      # than an unbounded run.
      - name: Test
        run: go test -race -timeout 20m -coverprofile=coverage.out ./...
        env:
          CGO_ENABLED: "1"

      # Build-tagged out of the default run, so a syntax error there would
      # otherwise go unnoticed until someone ran the integration suite.
      - name: Vet the integration suite
        run: go vet -tags integration ./...

  integration:
    name: Live Docker integration (API ${{ matrix.api-version || 'negotiated' }})
    runs-on: ubuntu-latest
    # The runner's own Docker daemon is enough; no privileged Docker-in-Docker
    # is needed, and asking for one would make this job harder to run anywhere
    # else.
    #
    # THE COMPATIBILITY MATRIX.
    #
    # The runner has one daemon, so the axis that can actually be varied is the
    # API VERSION the client pins -- which is the axis that matters. A call this
    # build makes that Engine 25 does not have is invisible against a modern
    # daemon and fatal on somebody's LTS host.
    #
    # `negotiated` is the empty pin: the configuration every real deployment
    # runs, and the one that must never be broken by adding a version to the
    # list. It is first so a failure there is the first thing read.
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-version: ""      # negotiated, as every deployment runs
          - api-version: "1.44"  # Docker Engine 25
          - api-version: "1.45"  # Docker Engine 26
          - api-version: "1.47"  # Docker Engine 27
          - api-version: "1.48"  # Docker Engine 28
    env:
      HARBORMASTER_DOCKER_API_VERSION: ${{ matrix.api-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Confirm a Docker daemon is reachable
        run: docker version

      # Every resource these tests create is prefixed harbormaster-it-, and the
      # suite sweeps strays at the end. The timeout is generous because pulling
      # the test image on a cold runner dominates the run.
      - name: Report the daemon and the pinned API version
        run: |
          docker version --format 'server {{.Server.Version}} api {{.Server.APIVersion}} min {{.Server.MinAPIVersion}}'
          echo "HarborMaster will pin: ${HARBORMASTER_DOCKER_API_VERSION:-<negotiated>}"

      - name: Integration tests against the runner's Docker daemon
        run: go test -tags integration -v -timeout 15m ./internal/integration/...

      - name: Confirm no test resources were left behind
        if: always()
        run: |
          strays="$(docker ps -aq --filter 'name=harbormaster-it-')"
          if [ -n "$strays" ]; then
            echo "leftover containers:"; docker ps -a --filter 'name=harbormaster-it-'
            docker rm -f $strays
            exit 1
          fi
          echo "no leftover test resources"

  frontend:
    name: Frontend (test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build binary with embedded frontend
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download frontend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/Aznyi/HarborMaster/internal/version.version=${GITHUB_REF_NAME} \
              -X github.com/Aznyi/HarborMaster/internal/version.commit=${GITHUB_SHA::7} \
              -X github.com/Aznyi/HarborMaster/internal/version.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/harbormaster ./cmd/harbormaster

      - name: Smoke-test the binary
        run: |
          ./bin/harbormaster &
          server_pid=$!
          # Poll rather than sleep a fixed amount, so a slow runner is not a flake.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "Health:"
          curl -fsS http://127.0.0.1:8080/api/v1/health
          echo
          echo "Version:"
          curl -fsS http://127.0.0.1:8080/api/v1/version
          echo
          # The SPA shell must be served from the embedded bundle.
          curl -fsS http://127.0.0.1:8080/ | grep -q "HarborMaster"

          # The native health check must succeed against a running server that
          # has no Docker access, i.e. the degraded state.
          echo "Healthcheck:"
          ./bin/harbormaster healthcheck

          # Subcommand routing.
          ./bin/harbormaster version >/dev/null
          if ./bin/harbormaster not-a-command >/dev/null 2>&1; then
            echo "an unknown subcommand must exit nonzero" >&2
            exit 1
          fi

          kill "$server_pid"

          # With the server stopped the probe must fail, not hang or pass.
          if ./bin/harbormaster healthcheck; then
            echo "healthcheck must exit nonzero when the server is down" >&2
            exit 1
          fi
        env:
          HARBORMASTER_DB_PATH: ./ci-data/harbormaster.db

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        # Build only; nothing is pushed from CI.
        run: docker build -t harbormaster:ci .
