name: Dependency review

# Blocks a pull request that introduces a vulnerable or badly-licensed
# dependency, before it is merged rather than after it ships.
#
# This is the control that answers dependency confusion and typosquatting: a
# newly added package shows up here as a diff a human reads, not as a line in a
# lockfile nobody opens.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the action leave the summary as a PR comment.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Matches the Definition of Done: High and Critical block the merge.
          fail-on-severity: high

          # HarborMaster is MIT. A copyleft dependency would change the
          # licensing of anything distributing the binary, so it is refused
          # here rather than discovered at release time.
          deny-licenses: >-
            GPL-1.0-or-later,
            GPL-2.0-or-later,
            GPL-3.0-or-later,
            AGPL-1.0-or-later,
            AGPL-3.0-or-later,
            LGPL-2.0-or-later,
            LGPL-3.0-or-later,
            SSPL-1.0

          comment-summary-in-pr: on-failure
