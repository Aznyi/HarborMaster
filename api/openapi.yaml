openapi: 3.1.0

info:
  title: HarborMaster API
  version: 0.2.5
  summary: Safety-first container lifecycle manager.
  description: |
    HarborMaster's REST API.

    **This API is read-only with respect to Docker.** It inventories containers,
    images, networks, and volumes, and reports build metadata and health. It
    cannot pull images, create, update, restart, or remove containers, and it
    exposes no command-execution endpoint. Those capabilities are not
    implemented yet, and will be added to this document at the same time they
    are added to the server.

    **One exception, added in Phase 8.** `POST /api/v1/acquisitions` downloads
    an approved, digest-pinned image into the daemon's local image store. That
    is the entire write capability, and it is worth stating what it still
    cannot do: it changes no container. A container keeps running the image it
    was created from, and there is no endpoint anywhere in this API that stops,
    starts, recreates, or reconfigures one, nor one that removes or prunes an
    image. Acquisition is off by default and must be enabled deliberately.

    Every other endpoint that accepts a write method mutates HarborMaster's own
    records only -- `POST /api/v1/inventory/refresh` re-reads the host and
    replaces what HarborMaster has stored, and changes nothing on the Docker
    host.

    ### Operating the API safely

    HarborMaster talks to the Docker socket, which is a privileged interface:
    anything able to reach it can control every container on the host. The
    server therefore binds to `127.0.0.1` by default. Expose it beyond loopback
    only behind an authenticating reverse proxy.

    ### Authentication and authorization

    **Every endpoint requires a session except four.** The exceptions are
    `GET /health` (a container runtime's probe cannot hold a session, and the
    body is reduced to one field for an anonymous caller), `GET /version`,
    `POST /auth/login`, and `GET /auth/bootstrap`. Everything else answers
    `401` without a session and `403` when the account's role does not hold the
    endpoint's permission.

    There is no setting that disables authentication.

    #### Sessions

    `POST /auth/login` sets an opaque session token in an HttpOnly, SameSite
    cookie -- `__Host-harbormaster_session` over HTTPS, `harbormaster_session`
    otherwise. **The token never appears in a response body, a URL, or a log.**
    The server stores only a keyed digest of it, so a stolen database yields no
    usable session.

    Sessions expire on idle and again at a hard ceiling regardless of use, and
    are revoked by sign-out, a password change, a role change, disablement, and
    the per-account concurrent-session cap.

    #### CSRF

    Every state-changing request needs the `X-HarborMaster-CSRF` header. Its
    value is returned by `/auth/login`, `/auth/session`, and `/auth/password`,
    and it is DERIVED from the session token rather than stored -- so it rotates
    with the session and there is nothing at rest to steal. A cross-site page
    can make a browser send the cookie but cannot read this value and cannot set
    a custom header without a preflight that fails.

    `POST /auth/login` and `POST /auth/bootstrap` are exempt because they have
    no session to derive a token from. Both are still covered by SameSite, the
    Origin and Fetch Metadata checks, the JSON content-type requirement, and the
    rate limiter.

    #### Roles

    Three, and a role holds a fixed set of permissions:

    - `viewer` reads. It can change nothing.
    - `operator` reads, and performs operational actions: refresh, snapshot,
      annotate, evaluate, generate a plan, acquire an image, recreate a
      container.
    - `administrator` additionally manages policies, accounts, and reads the
      security audit log. Policy administration is at this level deliberately:
      a policy is what BLOCKS an acquisition or a recreation, so an operator
      able to edit one could remove the gate standing in their way.

    `GET /roles` returns the catalogue, so a client builds its role picker from
    the same source of truth the authorization middleware uses.

    #### Claiming an installation

    A fresh installation has no accounts. It prints a one-time bootstrap token
    at startup; `POST /auth/bootstrap` exchanges that token for the first
    administrator. Once claimed, that endpoint answers `404` -- for that
    installation it genuinely no longer exists. Restarting re-mints the token
    and invalidates the previous one.

    `harbormaster admin bootstrap` does the same from the host filesystem
    without a token, because filesystem access to the database is a stronger
    proof than any token. That path is a command, never an endpoint.

    #### Audit

    Every authentication attempt, every authorization denial, and every
    state-changing request is recorded with the account, session, request id,
    and source address that caused it. `GET /audit` serves that log to an
    administrator. **No audit record contains a password, a token, a request
    body, an environment value, or a registry credential.**

    ### Sensitive values

    Environment variables and log-driver options whose NAME matches a
    configured pattern (`PASSWORD`, `SECRET`, `TOKEN`, `API_KEY`, ...) are
    returned masked as `********`. There is deliberately no query parameter,
    header, or endpoint that reveals the real values: with no authentication in
    place, such a switch would be an unauthenticated secret-disclosure API.

    The same masking applies to Docker event actor attributes, which are a
    resource's labels and can carry arbitrary operator-supplied values.
    Redaction happens in the Docker adapter, BEFORE an event is logged,
    persisted, returned by `/events`, or written to the SSE stream. No
    unredacted value is ever stored.

    ### Docker events

    `/events`, `/event-engine`, and `/events/stream` report what the Docker
    daemon told HarborMaster.

    **Events are hints, not authoritative state.** The daemon makes no
    durability promise about its event stream: events emitted while nothing is
    listening are gone, nothing is replayed across a daemon restart, ordering
    holds only within one connection, and duplicates are permitted. So event
    history answers "what did HarborMaster observe, and when" -- never "what
    happened on the host".

    HarborMaster never writes container state from an event. An event triggers
    a re-inspection through the same pipeline a full refresh uses, so
    `/containers` and `/images` remain the authoritative current-state views. A
    periodic full reconciliation restores accuracy after events are missed.

    Every event carries `sequence`, HarborMaster's own monotonic local ordering.
    It is the SSE event ID and the deterministic tiebreak for every list query.
    Because Docker guarantees no global ordering, `sequence` records the order
    events were OBSERVED in -- the only order this API can honestly claim.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://127.0.0.1:8080
    description: Local development server (default bind address)
  - url: http://localhost:8080
    description: Container deployment published to the host

tags:
  - name: System
    description: Liveness, readiness, and build metadata.
  - name: Identity
    description: |
      Signing in, signing out, sessions, and claiming a fresh installation.

      The session token lives in an HttpOnly cookie and appears in no response
      body, URL, or log. The server stores only a keyed digest of it, so a
      stolen database yields no usable session. The CSRF token is DERIVED from
      the session token and stored nowhere at all.
  - name: Accounts
    description: |
      Account administration. Requires `user:manage`, which only an
      administrator holds.

      There is no delete: disabling preserves the history an audit record
      depends on. Two refusals are built in and not configurable -- an
      administrator cannot modify their own account, and the last active
      administrator cannot be demoted or disabled.
  - name: Security audit
    description: |
      Who did what, to what, from where, and whether it worked.

      Append-only: no endpoint edits or deletes a record. It is not a request
      log -- no body, header, environment value, or credential appears in any
      record, and no column exists that could hold one. Security records are
      retained far longer than operational ones.
  - name: Inventory
    description: Inventory status and refresh control.
  - name: Containers
    description: Read-only container inventory.
  - name: Images
    description: Read-only image metadata.
  - name: Networks and volumes
    description: Read-only network and volume metadata.
  - name: Events
    description: |
      Observational Docker event history and the event engine that collects it.
      Read-only: there is no endpoint that creates, edits, or deletes an event.
  - name: Image intelligence
    description: |
      What registries report about the images the inventory references: resolved
      digests, whether a newer version is published, and per-registry health.

      **This is HarborMaster's only outbound network egress.** Everything else
      talks to a local Docker socket and a local SQLite file; this feature makes
      anonymous HTTPS GETs to registry manifest and tag-listing endpoints.

      It reads. It does not pull, push, delete, prune, tag, or recreate
      anything, and it holds no registry credentials -- a private repository is
      reported as `unauthorized` rather than becoming a reason to handle
      secrets. An update is REPORTED; applying one is an operator's job with
      their own tooling.

      **No parameter in this API becomes a network destination.** Registry hosts
      are derived only from image references the inventory already holds, and
      `POST /images/refresh` takes no target of any kind. See
      docs/security/threat-model.md for the layered SSRF defences.

  - name: Policy
    description: |
      Administrator-defined rules that every container's configuration is
      CHECKED AGAINST, and the violations they produce.

      A policy is never applied, enforced, or pushed to the daemon. The engine
      reads the inventory HarborMaster has already persisted, applies rules in
      memory, and writes the failures to its own tables. **There is no enforce,
      apply, or remediate endpoint**, and nothing here can reach Docker.

      Policy is not drift. Drift measures change from a baseline; a policy
      measures compliance with a rule. A container can drift into a
      still-compliant configuration, and one that has never moved can be
      non-compliant from the day it was created because the rule arrived later.

      `DELETE /policies/{id}` ARCHIVES. A violation references its policy and
      the history must survive the rule being withdrawn, so the definition is
      retained and its open violations resolve. There is no endpoint that
      permanently removes a policy.

      Environment-variable rules match NAMES. HarborMaster never reads, stores,
      or serves a variable's value in this feature.

  - name: Snapshots
    description: |
      Immutable configuration snapshots, restore-readiness validation, and
      configuration comparison.

      A snapshot records what a container's configuration WAS. Capture reads
      HarborMaster's own inventory and writes to HarborMaster's own database; it
      never changes a container.

      **There is no restore endpoint.** Readiness validation answers "could this
      be restored" so a future phase has an honest baseline — it does not
      restore, and HarborMaster has no capability to.

      Snapshots are append-only. Nothing edits a captured configuration; the
      only fields that change after capture are the denormalised readiness
      summary, and the only thing that removes a snapshot is the configured
      retention policy.
  - name: Drift
    description: |
      Configuration drift: the differences between a container's baseline
      snapshot and its configuration now.

      Drift is an OBSERVATION. HarborMaster reports that something moved and
      has no capability to move it back — there is no remediation, rollback,
      or apply endpoint here, and no route that reaches the Docker socket.

      The baseline is the container's most recent snapshot, which is also the
      one retention never prunes. Detection reuses the same comparison engine
      as `/snapshots/{id}/diff`, so drift and a manual comparison can never
      disagree.

      **Secret-backed fields report that they changed, never what to.** A
      sensitive environment variable or log option carries `sensitive: true`
      with both values empty.

      The only write is a STATUS transition on HarborMaster's own record, and
      it is limited to `acknowledged`, `ignored`, and `expected`. `active` and
      `resolved` are engine-owned: an operator cannot declare a difference
      resolved, because resolution is something the world does rather than
      something a person asserts.

  - name: Image acquisition
    description: |
      Downloading an approved image to this host.

      The change is one thing: layers arrive in the daemon's local image store.

      **It is not an update.** No container is touched by anything in this
      section. A container keeps running the image it was created from; an
      acquired image is another entry in the store beside it. Applying one is a
      separate capability with a separate interface and a separate section --
      see Container recreation -- and an acquisition service handed the pull
      capability cannot reach it.

      **There is no target parameter.** The request body carries a PLAN ID and
      an optional idempotency key. No registry, repository, digest, tag,
      platform, or pull option can be supplied; the target is derived from the
      change plan and revalidated immediately before the download.

      **Every acquisition is digest-pinned.** A tag can move between the moment a
      change was approved and the moment it is fetched, so a plan with no
      resolved digest cannot be acquired at all.

      **The transfer is not the proof.** After a successful pull the image is
      re-inspected through the read-only path and its digest and platform are
      compared against what was approved. A mismatch is a failure, recorded with
      the evidence -- and never retried automatically.

      **Nothing happens on a schedule.** Every acquisition is requested by an
      operator. HarborMaster never downloads an image on its own.

      Off by default. A deployment gains the ability to write to its Docker host
      only by asking for it.

  - name: Container recreation
    description: |
      Replacing ONE container with a new one built from its own configuration
      and an image that is already on this host.

      **This is HarborMaster's largest privilege.** Image acquisition writes to
      the image store, which affects nothing that is serving. This stops a
      running container and replaces it.

      **The request names an ACQUISITION and nothing else.** No container, no
      image, no digest, no tag, no command, no mount, no capability, no
      privilege flag, no timeout, no force. Unknown fields are rejected rather
      than ignored, so nothing can be smuggled in. Everything about what will
      happen is derived from the acquisition, which was derived from a plan.

      **An acquisition is single use.** One recreation per acquisition, ever,
      with no override parameter. A second recreation of the same container
      needs a fresh plan -- assessed against the world as it is now -- and a
      fresh acquisition to prove the image is still present.

      **The original is parked, not removed.** It is stopped and renamed aside,
      and it is removed only after the replacement has passed all four proofs
      (health or stability, image digest, configuration preservation, network
      attachment) AND the success has been recorded durably. Any failure before
      that leaves both containers on the host.

      **There is no AUTOMATIC rollback.** A failure after the first mutation
      quarantines the replacement, preserves both containers, and records a
      manual recovery plan of fixed-vocabulary steps. HarborMaster never
      executes that plan: there is no endpoint that runs one and no capability
      behind one. An automatic undo would be another unattended mutation,
      performed at exactly the moment HarborMaster has demonstrated that its
      model of the host is wrong.

      A recreation that SUCCEEDED, or that failed leaving the original parked,
      can be undone by an operator asking for it -- see the Manual rollback
      tag. That is a separate endpoint, a separate permission, a separate
      record, and it happens only when a person requests it.

      **Configuration is reproduced, secrets are not re-derived.** The
      container's live configuration is read into a value the execution service
      cannot inspect, log, or serialise, and handed straight back to the daemon.
      What the service and this API can see is a VALUE-FREE projection:
      environment NAMES, mount destinations, network names, capability lists.
      A sensitive value contributes a keyed digest and never a value.

      **Nothing happens on a schedule, and nothing is retried.** Every
      recreation is requested by an operator, acts on one container, and stops
      at its first failure.

      Off by default, and refused at startup unless image acquisition is on too:
      an execution names an acquisition, and with acquisition off there can
      never be one to name.

  - name: Manual rollback
    description: |
      Returning ONE container to the state a recreation replaced.

      **HarborMaster's second-largest privilege, and the one an operator reaches
      for when the first went wrong.** It stops the replacement a recreation
      created and starts the original that recreation preserved.

      **The request names an EXECUTION and nothing else.** No container, no
      name, no image, no snapshot, no Docker parameter. Unknown fields are
      rejected rather than ignored. Both container identities, the production
      name, and the image identity are read from HarborMaster's own record of
      that recreation and re-verified against the live host before anything
      moves.

      **It causes downtime.** The replacement is stopped before the original is
      started, and the original has to start and pass its checks before service
      resumes. This is stated in the confirmation the UI shows and in every
      description below, because it is the fact an operator most needs before
      approving.

      **It removes nothing.** The replacement is stopped and renamed to
      `<name>.hm-rolledback-<rollbackId>` and stays on this host as the evidence
      of why the recreation was backed out. The rollback capability has four
      methods -- stop, rename aside, rename back, start -- and no remove.

      **One successful rollback per recreation, ever.** Enforced by a unique
      index rather than by a check the service performs and hopes to win. A
      refused rollback does not consume that chance: the point of a refusal is
      that nothing happened.

      **Nothing happens on a schedule, on a fleet, or automatically.** Every
      rollback is requested by a person, acts on one execution's two containers,
      and stops at its first failure with both containers preserved and a manual
      recovery plan recorded.

      Off by default, and refused at startup unless container recreation is on
      too: a rollback names an execution, and with recreation off there can
      never be one to name.

  - name: Change plans
    description: |
      Deterministic assessments of a PROPOSED image change: how risky it looks,
      what the reasoning was, and what an operator should do about it.

      A plan is analysis, not an instruction. **Nothing applies one.**
      HarborMaster cannot pull an image, recreate a container, or roll one back,
      and generating a plan does not bring it closer to being able to: the
      planner reads six tables HarborMaster already populated -- inventory,
      image intelligence, snapshots, restore readiness, drift, and policy
      compliance -- and writes one row. There is no apply, execute, approve, or
      schedule endpoint.

      **Plans are immutable.** There is no PATCH and no DELETE. A plan records
      what was known at one moment; a changed world produces a NEW plan and the
      old one remains as the record of what was believed when a decision was
      made. That is what makes a plan usable as evidence afterwards, and it is
      enforced by the schema rather than by convention.

      **The risk model is deterministic.** A fixed, compile-time set of rules
      over integer scores, with no clock, randomness, I/O, or map iteration
      inside it. The same inputs produce the same score, band, recommendation
      and explanation, byte for byte, on any machine. Nothing here is learned,
      probabilistic, or statistical -- every number is a judgement written down
      by a person and reviewable as such.

      **A gap in evidence is never reported as safe.** When HarborMaster could
      not establish something -- a registry that did not answer, a digest it
      could not resolve -- the recommendation is `unknown`, which is
      deliberately not `proceed`.

      `POST /plans/generate` generates ANALYSIS. It is the only write, it takes
      no body and no target, and it schedules a pass over HarborMaster's own
      database.

security:
  # Applies to every operation. The four public endpoints override it with an
  # empty requirement, which is the ONLY way an operation becomes reachable
  # without a session -- and it is visible in the diff when one does.
  - sessionCookie: []

paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: Report dependency reachability
      operationId: getHealth
      security: []
      description: |
        Probes every dependency and returns a report.

        This endpoint always responds `200` when the server is running. The
        endpoint answering at all is the liveness signal; the body carries the
        readiness detail. A client must branch on `status`, not on the HTTP
        code, so it can tell "HarborMaster is down" (no response) apart from
        "Docker is down" (`status: degraded`).

        **The body is REDUCED for an unauthenticated caller** -- `status` and
        nothing else. It has to stay public, because a container runtime's
        HEALTHCHECK cannot hold a session, and the full report names the
        database path, the journal mode, the Docker API version, and how long
        the daemon has been unreachable. That is a reconnaissance gift to
        anyone who can reach the port. An authenticated caller gets the whole
        report.
      responses:
        "200":
          description: The health report. Check `status` for the verdict.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              examples:
                healthy:
                  summary: All dependencies reachable
                  value:
                    status: healthy
                    database: { status: up, latencyMs: 1 }
                    docker: { status: up, latencyMs: 4, version: "1.51" }
                    checkedAt: "2026-08-03T09:20:11.482Z"
                    uptimeSeconds: 3600
                degraded:
                  summary: Docker socket unreachable, API still serving
                  value:
                    status: degraded
                    database: { status: up, latencyMs: 1 }
                    docker:
                      status: down
                      detail: docker engine unreachable
                      latencyMs: 10000
                    checkedAt: "2026-08-03T09:20:11.482Z"
                    uptimeSeconds: 3600
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/version:
    get:
      tags: [System]
      summary: Report build metadata
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build metadata.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/inventory:
    get:
      tags: [Inventory]
      summary: Report inventory and refresh status
      operationId: getInventory
      description: |
        Returns Docker connectivity, refresh state, the current generation and
        checksum, headline counts, and recent warnings.

        `generation` advances only when a refresh completes AND is persisted,
        so a client can tell whether the inventory it holds is current.
        `checksum` fingerprints the inventory's content: an unchanged host
        produces an unchanged checksum, which is a cheap way to skip a refetch.

        Docker connectivity is probed live on every call rather than read from
        the last refresh.
      responses:
        "200":
          description: Inventory status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryStatus"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/v1/inventory/refresh:
    post:
      tags: [Inventory]
      summary: Trigger an inventory refresh
      operationId: refreshInventory
      description: |
        Starts a refresh in the background and returns immediately with `202`.

        The refresh is asynchronous because a sweep of a thousand containers
        cannot be something an HTTP client waits on: it would exceed the
        server's write timeout. Poll `GET /api/v1/inventory` and watch
        `inProgress` and `generation` for completion.

        Overlapping refreshes are refused rather than queued. A refresh
        requested while one is running returns `409` together with the active
        refresh's start time, so the caller learns what is happening rather
        than just that it failed.

        Docker reachability is checked before the refresh is accepted, so an
        unreachable daemon is an immediate `503` rather than an accepted
        refresh that fails out of sight moments later.

        This endpoint changes HarborMaster's own records only. It performs no
        Docker mutation of any kind.
      responses:
        "202":
          description: Refresh accepted and started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshAccepted"
        "405":
          description: |
            Read methods are rejected. Only POST triggers a refresh, so a GET
            cannot cause work as a side effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A refresh is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshConflict"
        "503":
          description: |
            The inventory is disabled by configuration, or the Docker Engine is
            unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/inventory/filters:
    get:
      tags: [Inventory]
      summary: List the filter vocabularies in use
      operationId: getInventoryFilters
      description: |
        Returns the valid states and health values, the Compose projects and
        image repositories actually present, and the sortable field names. A
        client can populate its selectors from this rather than hard-coding
        them.
      responses:
        "200":
          description: Filter vocabularies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterOptions"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/v1/containers:
    get:
      tags: [Containers]
      summary: List containers
      operationId: listContainers
      description: |
        Returns a page of containers from the persisted inventory, with
        filtering and sorting applied by the database.

        Ordering is always deterministic: the requested sort field is followed
        by name and then ID as tiebreaks, so paging cannot repeat or skip a
        container.

        Sort fields are validated against a fixed allowlist. Nothing from the
        query string is ever interpolated into SQL.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          description: Matches container name, image reference, or ID prefix.
          schema: { type: string }
        - name: state
          in: query
          description: |
            Filter by state. Repeat the parameter or supply a comma-separated
            list; values are OR-ed.
          schema:
            type: string
            examples: ["running", "running,paused"]
        - name: health
          in: query
          description: Filter by health, OR-ed like `state`.
          schema:
            type: string
            examples: ["unhealthy"]
        - name: project
          in: query
          description: Exact Compose project name.
          schema: { type: string }
        - name: service
          in: query
          description: Exact Compose service name.
          schema: { type: string }
        - name: image
          in: query
          description: Exact image repository or full reference.
          schema: { type: string }
        - name: restartPolicy
          in: query
          schema:
            type: string
            enum: ["no", always, on-failure, unless-stopped]
        - name: harbormasterEnabled
          in: query
          description: |
            Filter on the `io.harbormaster.enabled` label. Omitting the
            parameter does not filter; `false` matches containers where the
            label is present and false, which is not the same as absent.
          schema: { type: boolean }
        - name: labelKey
          in: query
          description: Match containers carrying this label key.
          schema: { type: string }
        - name: labelValue
          in: query
          description: Narrow `labelKey` to an exact value. Requires `labelKey`.
          schema: { type: string }
        - name: includeAbsent
          in: query
          description: |
            Include containers that earlier refreshes saw but the most recent
            one did not. Absent containers are retained rather than deleted, so
            their history survives.
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema:
            type: string
            default: name
            enum: [name, state, health, created, started, image, project, service, restartCount, lastSeen]
        - name: direction
          in: query
          schema:
            type: string
            default: asc
            enum: [asc, desc]
      responses:
        "200":
          description: A page of containers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/v1/containers/{id}:
    get:
      tags: [Containers]
      summary: Get one container's normalized detail
      operationId: getContainer
      description: |
        Accepts a full container ID, an unambiguous ID prefix, or an exact
        container name. An exact match always wins over a prefix.

        A prefix matching several containers returns `409`, never an arbitrary
        one of them.

        The response carries the normalized sections only. The redacted raw
        inspection payload is served from `/raw`, so a client that wants the
        normalized view never receives it by accident.
      parameters:
        - $ref: "#/components/parameters/ContainerId"
      responses:
        "200":
          description: The container's normalized detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AmbiguousId"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/v1/containers/{id}/raw:
    get:
      tags: [Containers]
      summary: Get the redacted raw inspection payload
      operationId: getContainerRaw
      description: |
        Returns the runtime's own inspection output with sensitive values
        removed, for troubleshooting and for fields HarborMaster has not
        normalized yet.

        **This is not a faithful copy.** Redacted values are gone, not
        recoverable, so the payload cannot be used to recreate a container
        exactly. The response says so in its `notice` field.
      parameters:
        - $ref: "#/components/parameters/ContainerId"
      responses:
        "200":
          description: The redacted inspection payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawInspection"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AmbiguousId"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/v1/images:
    get:
      tags: [Images]
      summary: List images
      operationId: listImages
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of images with reference counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/v1/images/{id}:
    get:
      tags: [Images]
      summary: Get one image
      operationId: getImage
      description: Accepts a full image ID, a short ID, or an unambiguous prefix.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: |
            The image, how many containers reference it, and what registries
            report about each of its references.

            A strict SUPERSET of the pre-Phase-6 response: `image` and
            `containerCount` are unchanged and in the same places, and `intel`
            is additive. `intel` is a LIST because one local image can carry
            several references -- the same content tagged twice.

            `intel` is empty when the engine is disabled, or when nothing about
            this image has been checked yet. The second case is not "no updates
            available"; see `checkStatus` on each entry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ImageUsage"
                  - type: object
                    required: [intel]
                    properties:
                      intel:
                        type: array
                        items: { $ref: "#/components/schemas/ImageIntel" }
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AmbiguousId"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/v1/networks:
    get:
      tags: [Networks and volumes]
      summary: List networks
      operationId: listNetworks
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of networks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/v1/volumes:
    get:
      tags: [Networks and volumes]
      summary: List volumes
      operationId: listVolumes
      description: |
        Volume metadata only. HarborMaster never reads volume contents.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of volumes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/v1/events:
    get:
      tags: [Events]
      summary: List observed Docker events
      operationId: listDockerEvents
      description: |
        Returns a page of the Docker events HarborMaster observed, with
        filtering and sorting applied by the database.

        Ordering is always deterministic: the requested sort field is followed
        by the local `sequence` as a tiebreak, so paging cannot repeat or skip
        an event. That tiebreak matters here more than elsewhere -- a burst of
        events shares a Docker timestamp, so sorting by time alone ties
        constantly.

        Default ordering is newest first.

        Sort fields are validated against a fixed allowlist. `action` is the one
        filter checked only for length rather than against a vocabulary, because
        Docker's action set varies by daemon version and an allowlist would
        reject a filter for an action the host really emits. It travels as a
        bound parameter either way; nothing from the query string reaches SQL as
        an identifier.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: type
          in: query
          description: |
            Filter by event type. Repeat the parameter or supply a
            comma-separated list; values are OR-ed.
          schema:
            type: string
            examples: ["container", "container,image"]
        - name: action
          in: query
          description: |
            Filter by action, OR-ed like `type`. Case-insensitive. Actions carry
            no closed vocabulary: use `GET /api/v1/event-filters` for the ones
            actually present.
          schema:
            type: string
            maxLength: 64
            examples: ["start", "die,stop"]
        - name: result
          in: query
          description: Filter by processing outcome, OR-ed like `type`.
          schema:
            type: string
            examples: ["warning", "processed,ignored"]
        - name: actorId
          in: query
          description: |
            Match the container ID, image ID or reference, network ID, or volume
            name the event concerns. A prefix is accepted, so a short container
            ID resolves without supplying all 64 characters.
          schema: { type: string }
        - name: project
          in: query
          description: Exact Compose project name.
          schema: { type: string }
        - name: service
          in: query
          description: Exact Compose service name.
          schema: { type: string }
        - name: search
          in: query
          description: Matches the resource name or an actor ID prefix.
          schema: { type: string }
        - name: since
          in: query
          description: |
            Lower bound on `observedAt`, inclusive. RFC 3339 only: accepting
            several formats would mean guessing which was meant.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: |
            Upper bound on `observedAt`, inclusive. Must not be earlier than
            `since`; an inverted range is rejected rather than silently matching
            nothing.
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          schema:
            type: string
            default: sequence
            enum: [sequence, observed, dockerTime, type, action, result, project, name]
        - name: direction
          in: query
          schema:
            type: string
            default: desc
            enum: [asc, desc]
      responses:
        "200":
          description: A page of events. Actor attributes are already redacted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DockerEventList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/EventsUnavailable"

  /api/v1/events/{id}:
    get:
      tags: [Events]
      summary: Get one observed event
      operationId: getDockerEvent
      description: |
        Returns one event by its local `sequence` number, together with links to
        the resources it concerns where HarborMaster can resolve them.

        A container link keeps working after a destroy: the container row is
        retained and marked absent rather than deleted, which is the useful
        answer.
      parameters:
        - name: id
          in: path
          required: true
          description: The event's local sequence number. A positive integer.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The event, with redacted attributes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DockerEventDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/EventsUnavailable"

  /api/v1/events/stream:
    get:
      tags: [Events]
      summary: Stream events over Server-Sent Events
      operationId: streamDockerEvents
      description: |
        A long-lived `text/event-stream` response carrying events as they are
        persisted.

        SSE rather than WebSockets: the traffic is one-way server-to-browser,
        SSE is plain HTTP so it inherits this server's timeouts, security
        headers, and access log unchanged, and the browser reconnects on its own.
        No WebSocket endpoint exists or is planned for this purpose.

        ### Frames

        Four named event types are emitted, plus comment heartbeats:

        - `ready` -- sent once when the stream opens, carrying
          `{ lastEventId, replayed, redacted, notice }`.
        - `docker-event` -- one event. The frame's `id:` is the event's local
          `sequence`, which the browser echoes back as `Last-Event-ID`.
        - `replay-truncated` -- sent when a replay was capped, carrying
          `{ skipped, limit, notice }`.
        - `closed` -- the server is ending the stream deliberately, carrying
          `{ reason }`. See below.
        - `: heartbeat` -- a comment frame on the configured interval, which
          keeps proxies from closing an idle connection. Clients ignore it.

        A `retry:` field is sent first, telling the browser how long to wait
        before reconnecting.

        ### A stream is re-authorized, not authorized once

        Every other route re-reads the account on each request, which is what
        makes a disablement, a demotion, or a password change take effect
        immediately. A stream makes ONE request and then runs for as long as the
        client holds it -- up to the session's absolute lifetime.

        So the session and the `event:read` permission are **re-checked on every
        heartbeat**, and the stream ends the moment either stops holding. A
        client receives a `closed` frame saying so, and should stop reconnecting
        and present its sign-in page rather than loop into a 401.

        The check fails CLOSED: a lookup that errors ends the stream. A stream is
        a standing grant, and a grant that cannot be reconfirmed is one that
        should stop.

        ### Replay

        A client may resume with the `Last-Event-ID` header (which the browser's
        EventSource sends automatically on reconnect) or a `lastEventId` query
        parameter (which is the only route available on a first connection,
        since EventSource cannot set a header there).

        Replay reads from SQLite and is CAPPED at
        `HARBORMASTER_EVENTS_STREAM_REPLAY_LIMIT` events. A client that fell
        further behind receives a `replay-truncated` frame saying how many were
        skipped, and should reload `GET /api/v1/events` rather than expect the
        stream to catch it up. A malformed resume point is ignored and the
        stream starts live, rather than failing a request from a client that is
        mid-reconnect.

        ### Redaction

        Every frame carries HarborMaster's own event model with attributes
        already redacted. No raw Docker payload is ever written to this stream.
        This matters because the endpoint is unauthenticated like the rest of
        the API.

        ### Limits

        Concurrent subscribers are capped by
        `HARBORMASTER_EVENTS_STREAM_MAX_SUBSCRIBERS`. At the cap, new
        connections receive `503` with `Retry-After` rather than being queued: a
        client told to come back can back off, while one parked in a queue
        occupies the connection it was refused.

        A subscriber that stops reading has events DROPPED for it alone. It
        never blocks event processing or back-pressures the Docker stream.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: |
            The last `sequence` the client received. Sent automatically by
            EventSource on reconnect.
          schema: { type: integer, minimum: 0 }
        - name: lastEventId
          in: query
          required: false
          description: |
            The same resume point as the header, for a first connection where
            EventSource cannot set one.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: |
            An open event stream. The response does not end until the client
            disconnects or the server shuts down.
          headers:
            Cache-Control:
              description: Always `no-cache, no-store, must-revalidate`.
              schema: { type: string }
            X-Accel-Buffering:
              description: |
                Always `no`, which disables nginx response buffering. Without it
                a proxy accumulates frames and the stream stops being live.
              schema: { type: string }
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  An SSE byte stream. OpenAPI cannot describe frame structure,
                  so the payload schemas are documented separately: a
                  `docker-event` frame's `data:` is a `DockerEvent`, a `ready`
                  frame's is a `StreamReady`, and a `replay-truncated` frame's is
                  a `StreamTruncated`.
              examples:
                stream:
                  summary: A reconnect that replayed one event, then went live
                  value: |
                    retry: 1000

                    id: 41
                    event: docker-event
                    data: {"sequence":41,"type":"container","action":"start","actorName":"shop-web-1","result":"processed"}

                    event: ready
                    data: {"lastEventId":41,"replayed":1,"redacted":true,"notice":"Attribute values matching sensitive-name patterns are masked. No raw Docker payload is sent."}

                    : heartbeat

                    id: 42
                    event: docker-event
                    data: {"sequence":42,"type":"container","action":"die","actorName":"shop-web-1","result":"processed"}
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: |
            The event engine is disabled by configuration (`feature_disabled`),
            or the subscriber limit is reached (`service_unavailable`, with
            `Retry-After`).
          headers:
            Retry-After:
              description: Seconds to wait before retrying, sent at the subscriber limit.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                disabled:
                  value:
                    error:
                      code: feature_disabled
                      message: the event engine is disabled by configuration
                atLimit:
                  value:
                    error:
                      code: service_unavailable
                      message: too many event stream subscribers; try again shortly

  /api/v1/event-engine:
    get:
      tags: [Events]
      summary: Report event-engine status
      operationId: getEventEngine
      description: |
        Returns the event engine's connection state, timings, queue occupancy,
        counters, and retention policy.

        A DISABLED engine is reported as `enabled: false` with state `disabled`,
        not as an error: running on periodic reconciliation alone is a supported
        configuration. A deployment with no engine configured at all returns the
        same shape, so a client renders one "off" state rather than two.

        `lastError` is a sanitised summary. It never carries a socket path, a
        daemon internal, or a credential.
      responses:
        "200":
          description: Event-engine status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEngineStatus"
              examples:
                connected:
                  summary: Live and healthy
                  value:
                    enabled: true
                    state: connected
                    connectedSince: "2026-08-03T09:00:00Z"
                    lastEventAt: "2026-08-03T09:20:11.482Z"
                    lastReconciliationAt: "2026-08-03T09:00:05Z"
                    currentBackoffMs: 0
                    queueDepth: 0
                    queueCapacity: 1024
                    pendingRefreshes: 0
                    overflowPending: false
                    subscribers: 1
                    subscriberLimit: 16
                    counters:
                      eventsReceived: 412
                      eventsPersisted: 401
                      eventsDeduplicated: 11
                      eventsDropped: 0
                      targetedRefreshes: 388
                      fullReconciliations: 2
                      reconnectCount: 0
                      refreshFailures: 0
                      eventsPruned: 0
                    retention: { maxAgeSeconds: 604800, maxCount: 50000, intervalSeconds: 3600 }
                    storedEvents: 401
                reconnecting:
                  summary: Stream lost; the inventory is on periodic reconciliation
                  value:
                    enabled: true
                    state: reconnecting
                    lastDisconnectedAt: "2026-08-03T09:31:02Z"
                    currentBackoffMs: 4000
                    queueDepth: 0
                    queueCapacity: 1024
                    pendingRefreshes: 0
                    overflowPending: false
                    subscribers: 0
                    subscriberLimit: 16
                    counters:
                      eventsReceived: 412
                      eventsPersisted: 401
                      eventsDeduplicated: 11
                      eventsDropped: 0
                      targetedRefreshes: 388
                      fullReconciliations: 3
                      reconnectCount: 2
                      refreshFailures: 0
                      eventsPruned: 0
                    lastError: docker engine unreachable
                    retention: { maxAgeSeconds: 604800, maxCount: 50000, intervalSeconds: 3600 }
                    storedEvents: 401
                disabled:
                  summary: Switched off by configuration
                  value:
                    enabled: false
                    state: disabled
                    currentBackoffMs: 0
                    queueDepth: 0
                    queueCapacity: 0
                    pendingRefreshes: 0
                    overflowPending: false
                    subscribers: 0
                    subscriberLimit: 0
                    counters:
                      eventsReceived: 0
                      eventsPersisted: 0
                      eventsDeduplicated: 0
                      eventsDropped: 0
                      targetedRefreshes: 0
                      fullReconciliations: 0
                      reconnectCount: 0
                      refreshFailures: 0
                      eventsPruned: 0
                    retention: { maxAgeSeconds: 0, maxCount: 0, intervalSeconds: 0 }
                    storedEvents: 0
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/event-filters:
    get:
      tags: [Events]
      summary: List the event filter vocabularies in use
      operationId: getEventFilters
      description: |
        Returns the event types and processing results HarborMaster knows,
        together with the actions and Compose projects actually present in
        recorded history, and the sortable field names.

        Actions come from the data rather than a constant because Docker's
        action set varies by daemon version.

        Registered at `/event-filters` rather than `/events/filters` for a
        routing reason: a literal `filters` segment there would neither contain
        nor be contained by `GET /events/{id}`, which Go's ServeMux rejects as an
        ambiguous pair. It is event metadata either way.
      responses:
        "200":
          description: Filter vocabularies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFilterOptions"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/EventsUnavailable"

  /api/v1/snapshots:
    get:
      tags: [Snapshots]
      summary: List configuration snapshots
      operationId: listSnapshots
      description: |
        Returns a paginated, filterable list of immutable configuration
        snapshots, newest first by default.

        The canonical configuration document is deliberately omitted from list
        rows: a page of fifty snapshots would otherwise carry fifty complete
        configurations to render a table that shows none of them. Fetch a single
        snapshot to get it.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: containerId
          in: query
          description: Restrict to one container's history.
          schema: { type: string, maxLength: 255 }
        - name: trigger
          in: query
          description: |
            Filter by what caused the capture. Repeatable, or comma-separated.
          schema:
            type: array
            items: { $ref: "#/components/schemas/SnapshotTrigger" }
          style: form
          explode: true
        - name: readiness
          in: query
          description: |
            Filter by the last recorded restore-readiness verdict. `unknown`
            means no evaluation has run yet.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ReadinessStatus" }
          style: form
          explode: true
        - name: checksum
          in: query
          description: Find the snapshot with an exact configuration checksum.
          schema: { type: string, pattern: "^[0-9a-fA-F]{1,64}$" }
        - name: since
          in: query
          description: Only snapshots captured at or after this RFC 3339 instant.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Only snapshots captured at or before this RFC 3339 instant.
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          description: Sort field. Validated against a fixed allowlist.
          schema:
            type: string
            enum: [createdAt, id, container, readiness, trigger]
            default: createdAt
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SnapshotsUnavailable"

    post:
      tags: [Snapshots]
      summary: Capture a configuration snapshot
      operationId: createSnapshot
      description: |
        Captures a container's current configuration as an immutable snapshot.

        **This does not change the container.** Capture reads HarborMaster's own
        inventory and writes to HarborMaster's own database. HarborMaster has no
        ability to create, update, restart, or remove a container, and no
        endpoint restores a snapshot.

        Re-capturing an unchanged configuration returns the **existing**
        snapshot with `deduplicated: true` and status `200` rather than creating
        a duplicate. That deduplication is what makes this endpoint safe to call
        repeatedly, and it means Phase 3 records *configuration history* rather
        than time-series evidence: an unchanged capture leaves no new record.

        Sensitive environment values are never stored. Each contributes a keyed
        digest instead, which supports exactly one operation: deciding whether
        the value changed between two snapshots.

        ### Request limits

        The body must be exactly one JSON object with `Content-Type:
        application/json`. Unknown fields are rejected rather than ignored,
        trailing content is refused, and every string must be valid UTF-8 with
        no control characters. The endpoint is rate limited per process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnapshotRequest"
      responses:
        "201":
          description: A new snapshot was captured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "200":
          description: |
            The configuration was unchanged, so the existing snapshot is
            returned with `deduplicated: true`. Nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: A capture is already in progress for this container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SnapshotsUnavailable"

  /api/v1/snapshots/{id}:
    get:
      tags: [Snapshots]
      summary: Get one snapshot
      operationId: getSnapshot
      description: |
        Returns one snapshot including its canonical configuration document and
        its derived environment, mount, and network sections.

        Sensitive environment entries carry no value and no digest: presence and
        byte length are all the API exposes about them.
      parameters:
        - $ref: "#/components/parameters/SnapshotId"
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SnapshotsUnavailable"

  /api/v1/snapshots/{id}/diff:
    get:
      tags: [Snapshots]
      summary: Compare a snapshot against another or against current
      operationId: getSnapshotDiff
      description: |
        Compares the snapshot against another snapshot, or against the
        container's current configuration.

        Comparing against `current` reads live configuration in memory and
        writes nothing: a GET never creates a snapshot as a side effect.

        ### Secrets

        A sensitive entry reports only *that* it changed, derived from digest
        comparison. Values and digests are never returned. Two digests produced
        under different HMAC keys report `unverifiable` rather than a
        false `modified` — otherwise a key rotation would look like every secret
        changing at once.

        ### Limits

        Concurrency, wall time, entries compared, entries returned, and the size
        of any single value are all bounded. Truncation is **always explicit**
        via `truncated`, `truncationReason`, and per-group `returned`/`total`
        counts, so a client can distinguish "no further changes" from "we
        stopped looking". A truncated diff never reports `identical`.

        There are no user-defined comparison expressions, JSONPath, selectors,
        or patterns. Output is narrowed by naming groups from a closed
        vocabulary.
      parameters:
        - $ref: "#/components/parameters/SnapshotId"
        - name: against
          in: query
          description: |
            `current` (the default) compares against live configuration; a
            numeric snapshot id compares against that snapshot.
          schema: { type: string, default: current }
        - name: group
          in: query
          description: Restrict output to these groups. Repeatable.
          schema:
            type: array
            items: { $ref: "#/components/schemas/DiffGroupName" }
          style: form
          explode: true
        - name: includeUnchanged
          in: query
          description: |
            Include unchanged entries. Off by default so a response is
            proportional to the change rather than to the configuration.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotDiff"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SnapshotsUnavailable"

  /api/v1/snapshots/{id}/restore-readiness:
    get:
      tags: [Snapshots]
      summary: Validate whether a snapshot could be restored
      operationId: getSnapshotReadiness
      description: |
        Evaluates whether restoring this snapshot **would** succeed.

        **HarborMaster cannot restore a container, and this endpoint does not
        bring it closer to being able to.** The report is informational: it
        exists so an operator can see today whether the baseline a future
        restore would need is complete.

        ### Provenance matters

        Most checks answer from HarborMaster's cached inventory rather than from
        the daemon, so the report carries `inventoryGeneration`,
        `inventoryCompletedAt`, `inventoryAgeSeconds`, and `daemonCheckedAt`.
        Beyond a configured freshness threshold, `inventoryStale` is set and the
        overall verdict degrades to at most `warning`: HarborMaster does not
        claim `ready` on the strength of a stale reading.

        Evaluation never triggers an inventory refresh. A read endpoint that
        could drive privileged socket traffic would be a denial-of-service
        amplifier.

        ### Secrets and bind mounts always cap the verdict

        Because sensitive values are never stored, any container with sensitive
        environment variables reports at best `warning` — restoring it requires
        secret injection that does not exist yet.

        Bind-mount sources always report `unverifiable`: Phase 3 inspects no
        host filesystem, and `unverifiable` caps the overall verdict at
        `warning` rather than being rounded to a pass.
      parameters:
        - $ref: "#/components/parameters/SnapshotId"
      responses:
        "200":
          description: The readiness report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SnapshotsUnavailable"

  /api/v1/drift:
    get:
      tags: [Drift]
      summary: List configuration drift
      operationId: listDrift
      description: |
        Returns drift records: one per field that differs between a container's
        baseline snapshot and its current configuration.

        Defaults to OPEN records only (everything except `resolved`), because a
        list dominated by resolved history buries what still stands. Passing an
        explicit `status` filter turns that default off.

        Sensitive fields report `sensitive: true` with both values empty.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: containerId
          in: query
          description: Restrict to one container, matched exactly.
          schema: { type: string, maxLength: 128 }
        - name: snapshotId
          in: query
          description: Restrict to drift measured against one baseline.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: category
          in: query
          description: |
            Repeatable, or comma-separated. An unrecognised value is rejected
            rather than ignored.
          schema:
            type: array
            items: { $ref: "#/components/schemas/DriftCategory" }
        - name: severity
          in: query
          description: Repeatable, or comma-separated.
          schema:
            type: array
            items: { $ref: "#/components/schemas/DriftSeverity" }
        - name: status
          in: query
          description: |
            Repeatable, or comma-separated. Supplying this disables the
            open-only default.
          schema:
            type: array
            items: { $ref: "#/components/schemas/DriftStatus" }
        - name: openOnly
          in: query
          description: Exclude resolved records. Defaults to true.
          schema: { type: boolean, default: true }
        - name: sort
          in: query
          schema:
            type: string
            enum: [detectedAt, lastSeenAt, id, container, category, field, status, severity]
            default: detectedAt
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of drift records.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DriftRecord" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DriftUnavailable"

  /api/v1/drift/summary:
    get:
      tags: [Drift]
      summary: Drift summary for the dashboard
      operationId: getDriftSummary
      description: |
        Aggregate counts by severity, status, and category, plus how many
        containers hold open drift and how many have been evaluated at all.

        `containersEvaluated` matters: without it, "no drift" is ambiguous
        between a clean estate and one that was never checked. `incomplete`
        reports that at least one container's most recent evaluation could not
        examine everything, so the counts are a floor rather than a total.

        Computed by aggregate queries whose cost is proportional to the number
        of distinct severities and categories, not to the number of records.
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftSummary"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DriftUnavailable"

  /api/v1/drift/container/{id}:
    get:
      tags: [Drift]
      summary: Drift for one container
      operationId: getContainerDrift
      description: |
        One container's drift records, together with the EVALUATION that
        produced them.

        The evaluation is included so a client can tell "no drift" from "never
        checked" without a second request. It is absent when the container has
        never been evaluated.
      parameters:
        - $ref: "#/components/parameters/ContainerId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: openOnly
          in: query
          schema: { type: boolean, default: true }
        - name: severity
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/DriftSeverity" }
      responses:
        "200":
          description: The container's drift.
          content:
            application/json:
              schema:
                type: object
                required: [containerId, records, pagination]
                properties:
                  containerId: { type: string }
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/DriftRecord" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                  evaluation: { $ref: "#/components/schemas/DriftEvaluation" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: The id prefix matched more than one container.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DriftUnavailable"

  /api/v1/drift/{id}:
    get:
      tags: [Drift]
      summary: Get one drift record
      operationId: getDriftRecord
      parameters:
        - $ref: "#/components/parameters/DriftId"
      responses:
        "200":
          description: The drift record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftRecord" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DriftUnavailable"
    patch:
      tags: [Drift]
      summary: Change a drift record's status
      operationId: updateDriftStatus
      description: |
        Moves a drift record's status. **This is the only write in the drift
        API, and it changes nothing outside HarborMaster's own database.** No
        container, image, or snapshot is touched.

        Allowed transitions are `acknowledged`, `ignored`, and `expected`.
        `active` and `resolved` are rejected: they are engine-owned facts about
        whether the difference still exists, and letting a caller assert
        "resolved" would make the drift list stop describing reality.

        An operator's status SURVIVES re-evaluation. Only a record that had
        been resolved returns to `active`, and only because the difference came
        back.

        Guarded like the POST endpoints: `application/json` required, unknown
        fields rejected, body size capped, and a per-process rate limit.
      parameters:
        - $ref: "#/components/parameters/DriftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [acknowledged, ignored, expected]
                note:
                  type: string
                  description: |
                    Operator annotation. Bounded in BYTES, validated as UTF-8,
                    and refused if it contains control characters.
                  maxLength: 500
      responses:
        "200":
          description: The updated record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftRecord" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: The request body exceeded the configured limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415":
          description: Content-Type was not application/json.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: The write rate limit was exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DriftUnavailable"

  /api/v1/policies:
    get:
      tags: [Policy]
      summary: List policy definitions
      operationId: listPolicies
      description: |
        Returns the policies a container's configuration is checked against.

        Archived policies are EXCLUDED by default: an archived policy is
        history, and a list dominated by history buries the rules actually in
        force. Pass `includeArchived=true` to see them.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          description: |
            Matches the name or description. LIKE metacharacters in the term are
            escaped, so a term of `%` matches policies literally containing a
            percent sign rather than everything.
          schema: { type: string, maxLength: 200 }
        - name: enabled
          in: query
          description: Restrict to policies that participate in evaluation.
          schema: { type: boolean }
        - name: includeArchived
          in: query
          description: Include withdrawn policies. Defaults to false.
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, severity, createdAt, updatedAt, rules, id]
            default: name
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: A page of policy definitions.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PolicyDefinition" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

    post:
      tags: [Policy]
      summary: Create a policy
      operationId: createPolicy
      description: |
        Stores a new policy definition and schedules a compliance pass, so the
        new rule applies from now on rather than from the next scheduled sweep.

        **This creates a rule, not an action.** HarborMaster checks
        configuration against a policy; it never applies, enforces, or pushes
        one to Docker.

        `name`, `severity` and `rules` are required — an omitted field on a
        create is a caller mistake rather than an instruction to keep an
        existing value. The identifier is generated by the server: a body
        carrying `policyId` is rejected as an unrecognised field.

        A policy may carry at most ONE rule of each type. A violation is
        identified by (container, policy, rule type), so two rules of one type
        would compete for the same history row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyRequest" }
            example:
              name: Production hardening
              description: What every production container must look like
              severity: high
              enabled: true
              rules:
                - type: privilegedForbidden
                  severity: critical
                - type: userNotRoot
                - type: imageAllowlist
                  values: ["registry.example.com/*"]
      responses:
        "201":
          description: The stored policy. `Location` carries its canonical URL.
          headers:
            Location:
              description: The new policy's URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDefinition" }
        "400":
          $ref: "#/components/responses/PolicyInvalid"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "409":
          description: A policy with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

  /api/v1/policies/{id}:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    get:
      tags: [Policy]
      summary: Get a policy definition
      operationId: getPolicy
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDefinition" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

    patch:
      tags: [Policy]
      summary: Update a policy
      operationId: updatePolicy
      description: |
        A PARTIAL update: an omitted field is left alone. Supplying `rules`
        replaces the whole list.

        The result is validated as the WHOLE policy the update will produce, not
        as the changed fields in isolation — a rules list that is legal on its
        own can still be illegal next to the name it is landing beside.

        `policyId` is immutable and absent from the request schema. An archived
        policy cannot be edited: editing one would change what a violation
        appears to have been measured against.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyRequest" }
            example:
              enabled: false
      responses:
        "200":
          description: The updated policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDefinition" }
        "400":
          $ref: "#/components/responses/PolicyInvalid"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A policy with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

    delete:
      tags: [Policy]
      summary: Withdraw a policy
      operationId: archivePolicy
      description: |
        **ARCHIVES rather than destroys.**

        A violation references its policy, and the history has to survive the
        rule being withdrawn: an auditor asking what the estate was failing last
        quarter must not get a different answer because someone tidied up this
        quarter. So the definition is retained and marked `archived`, it stops
        being evaluated, and its open violations resolve in the same
        transaction. The schema enforces the same thing through
        `ON DELETE RESTRICT`.

        There is no endpoint that permanently removes a policy.
      responses:
        "204":
          description: The policy was withdrawn. No body.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

  /api/v1/policy-rules:
    get:
      tags: [Policy]
      summary: The rule catalogue
      operationId: getPolicyRules
      description: |
        Every rule type a policy may use, with the closed vocabularies and the
        definition bounds the server validates against.

        Served so a policy editor is built from the same source of truth the
        validator uses. A hand-maintained list in a client would eventually
        offer a rule the backend rejects.
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyRuleCatalogue" }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

  /api/v1/policy-summary:
    get:
      tags: [Policy]
      summary: Compliance summary for the dashboard
      operationId: getPolicySummary
      description: |
        Aggregate counts by severity, status, and rule, plus how many containers
        are compliant and how many have been evaluated at all.

        `containersEvaluated` matters: without it, "6 compliant" is ambiguous
        between a healthy estate and one that was never checked. `incomplete`
        reports that at least one container's most recent pass could not apply
        every policy, so the counts are a floor rather than a total.

        Computed by aggregate queries whose cost is proportional to the number
        of distinct severities and rule types, not to the number of violations.
      responses:
        "200":
          description: The compliance aggregate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicySummary" }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

  /api/v1/policy-violations:
    get:
      tags: [Policy]
      summary: List policy violations
      operationId: listPolicyViolations
      description: |
        Returns violations: one per rule that a container fails.

        One row per FAILED RULE, not per offending item. A forbidden-environment
        rule listing four patterns against a container carrying three of them is
        one violation naming the rule, with the offending NAMES rendered into
        `observed`.

        Defaults to OPEN violations only (everything except `resolved`).
        Passing an explicit `status` filter turns that default off.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: containerId
          in: query
          description: Restrict to one container, matched exactly.
          schema: { type: string, maxLength: 128 }
        - name: policyId
          in: query
          description: Restrict to one policy.
          schema: { type: string, pattern: "^pol_[0-9a-f]{20}$" }
        - name: rule
          in: query
          description: |
            Repeatable, or comma-separated. An unrecognised value is rejected
            rather than ignored.
          schema:
            type: array
            items: { $ref: "#/components/schemas/PolicyRuleType" }
        - name: severity
          in: query
          description: Repeatable, or comma-separated.
          schema:
            type: array
            items: { $ref: "#/components/schemas/PolicySeverity" }
        - name: status
          in: query
          description: |
            Repeatable, or comma-separated. Supplying this disables the
            open-only default.
          schema:
            type: array
            items: { $ref: "#/components/schemas/PolicyViolationStatus" }
        - name: openOnly
          in: query
          description: Exclude resolved violations. Defaults to true.
          schema: { type: boolean, default: true }
        - name: sort
          in: query
          schema:
            type: string
            enum: [detectedAt, lastSeenAt, id, container, policy, rule, status, severity]
            default: detectedAt
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of violations.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PolicyViolation" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

  /api/v1/policy-violations/container/{id}:
    get:
      tags: [Policy]
      summary: One container's compliance
      operationId: getContainerPolicy
      description: |
        The container's violations together with the PASS that produced them.

        The evaluation is included so a client can tell "compliant" from "never
        checked" without a second request. It is ABSENT when the container has
        never been evaluated — left out rather than invented, because that is
        the distinction this response exists to preserve.
      parameters:
        - $ref: "#/components/parameters/ContainerId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: openOnly
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: The container's compliance.
          content:
            application/json:
              schema:
                type: object
                required: [containerId, violations, pagination]
                properties:
                  containerId: { type: string }
                  violations:
                    type: array
                    items: { $ref: "#/components/schemas/PolicyViolation" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                  evaluation:
                    allOf:
                      - $ref: "#/components/schemas/PolicyEvaluation"
                    description: Absent when the container has never been evaluated.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AmbiguousId"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

  /api/v1/policy-violations/{id}:
    parameters:
      - $ref: "#/components/parameters/ViolationId"
    get:
      tags: [Policy]
      summary: Get a violation
      operationId: getPolicyViolation
      responses:
        "200":
          description: The violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyViolation" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

    patch:
      tags: [Policy]
      summary: Acknowledge or exempt a violation
      operationId: updatePolicyViolationStatus
      description: |
        Moves a violation's STATUS and nothing else. It cannot change a
        container, a policy, or the fact that the rule fails.

        Only `acknowledged` and `exempted` are accepted. `active` and `resolved`
        are engine-owned: a caller asserting "resolved" would be asserting a
        fact about the world rather than an intent, and the compliance report
        would start lying about what is still true.

        **Neither status suppresses re-evaluation.** The next pass still applies
        the rule, still refreshes `lastSeenAt`, and still resolves the violation
        the moment the container complies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [acknowledged, exempted]
                note:
                  type: string
                  description: |
                    Operator annotation. Bounded in BYTES, validated as UTF-8,
                    and refused if it carries a control character.
                  maxLength: 500
            example:
              status: acknowledged
              note: Accepted until the next release
      responses:
        "200":
          description: The updated violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyViolation" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"

  /api/v1/policy/evaluate:
    post:
      tags: [Policy]
      summary: Request a compliance pass
      operationId: evaluatePolicies
      description: |
        Schedules a compliance pass over every container and answers 202
        immediately. **It does not wait for the pass to finish.**

        Asynchronous deliberately: a synchronous evaluation of a
        thousand-container estate would hold an unauthenticated request open for
        minutes and give one caller a way to occupy a connection and the single
        database writer at will. The request goes through the same coalescing
        queue the scheduled passes use, so calling it in a loop produces one
        pass rather than a backlog — and it is rate limited on top of that.

        A pass also runs automatically after every successful inventory refresh,
        so this endpoint is for impatience rather than for correctness.
      responses:
        "202":
          description: The pass was scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [requested, engine]
                properties:
                  requested: { type: boolean }
                  engine: { $ref: "#/components/schemas/PolicyEngineStatus" }
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"


  /api/v1/images/updates:
    get:
      tags: [Image intelligence]
      summary: Which images have a newer version published
      operationId: listImageUpdates
      description: |
        Returns every tracked image reference with what the registry reports
        about it, together with the estate aggregate.

        The summary travels WITH the list so a dashboard renders in one request,
        and so `checked` is always beside `updatesAvailable`. That pairing
        matters: an update count without "how many were actually checked"
        invites reading a stale estate as a healthy one.

        Defaults to references with an ACTIONABLE update. Pass
        `updatesOnly=false` for everything tracked, including references that
        are up to date, awaiting a first check, or not checkable at all.

        **No parameter here becomes a network destination.** `registry` filters
        the stored column; it is matched exactly against a host HarborMaster
        itself derived from an image reference, and cannot introduce one.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: update
          in: query
          description: |
            Repeatable, or comma-separated. An unrecognised value is rejected
            rather than ignored.
          schema:
            type: array
            items: { $ref: "#/components/schemas/UpdateType" }
        - name: status
          in: query
          description: Repeatable, or comma-separated.
          schema:
            type: array
            items: { $ref: "#/components/schemas/CheckStatus" }
        - name: registry
          in: query
          description: |
            Restrict to one or more registry hosts, matched exactly against a
            stored value. Validated as a host NAME; it selects among registries
            the estate already references and cannot name a new one.
          schema:
            type: array
            maxItems: 32
            items: { type: string, maxLength: 253 }
        - name: updatesOnly
          in: query
          description: Only references with an actionable update. Defaults to true.
          schema: { type: boolean, default: true }
        - name: inUseOnly
          in: query
          description: Only references a present container actually runs.
          schema: { type: boolean }
        - name: search
          in: query
          description: |
            Matches the canonical or familiar reference. LIKE metacharacters are
            escaped, so a term of `%` matches references literally containing a
            percent sign rather than everything.
          schema: { type: string, maxLength: 512 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [update, reference, registry, status, lastChecked, containers, id]
            default: update
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of tracked references, with the estate aggregate.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ImageIntel" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                  summary: { $ref: "#/components/schemas/ImageIntelSummary" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ImageIntelUnavailable"

  /api/v1/images/{id}/history:
    get:
      tags: [Image intelligence]
      summary: What has changed about an image
      operationId: getImageHistory
      description: |
        Observed CHANGES for every reference resolving to this local image,
        newest first.

        Only actual movements are recorded -- a digest that moved, an update
        that appeared or was taken, a check that started or stopped failing. A
        pass that found everything unchanged writes nothing, so an empty history
        means the image has been stable or has not been checked, NOT that
        nothing was looked at.
      parameters:
        - $ref: "#/components/parameters/ImageId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of observed changes.
          content:
            application/json:
              schema:
                type: object
                required: [imageId, references, items, pagination]
                properties:
                  imageId: { type: string }
                  references:
                    type: array
                    description: |
                      Every tracked reference that resolved to this image, so a
                      merged history is attributable.
                    items: { type: string }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ImageUpdateEvent" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AmbiguousId"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ImageIntelUnavailable"

  /api/v1/images/refresh:
    post:
      tags: [Image intelligence]
      summary: Request a metadata collection pass
      operationId: refreshImageMetadata
      description: |
        Schedules a metadata collection pass and answers 202 immediately.

        **It pulls nothing.** The pass resolves manifests and lists tags over
        HTTPS, anonymously, and records what it learned. No image is downloaded,
        no container is touched, and no Docker capability is involved.

        **It takes no body and no target.** There is no registry, host, URL, or
        reference parameter -- deliberately, because that is the API-layer half
        of the SSRF defence. The pass covers whatever references the inventory
        already holds, and any query parameter attached to the request is simply
        not read.

        Asynchronous for two reasons: a synchronous pass would hold an
        unauthenticated request open across hundreds of registry lookups, and it
        would hand a caller a way to generate outbound traffic on demand. The
        request is coalesced -- calling it in a loop produces one pass, not a
        backlog -- and it is rate limited on top of that.
      responses:
        "202":
          description: The pass was scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [requested, engine]
                properties:
                  requested: { type: boolean }
                  engine: { $ref: "#/components/schemas/ImageIntelEngineStatus" }
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ImageIntelUnavailable"

  /api/v1/plans:
    get:
      tags: [Change plans]
      summary: Assessments of proposed image changes
      operationId: listChangePlans
      description: |
        Returns change plans with the estate aggregate.

        The summary travels WITH the list so a dashboard renders in one request,
        and so `undetermined` is always beside `actionable`. That pairing
        matters: an "actionable" count without "how many could not be judged"
        invites reading a partly-assessed estate as a clean one.

        Defaults to CURRENT plans -- the newest per container. A superseded plan
        describes a world that has moved on, and listing it beside the current
        one would double-count the estate. Pass `currentOnly=false` to include
        the history.

        Sorted by risk band descending by default, because the dashboard's
        question is "what most needs attention" rather than "what happened
        most recently".

        Absence of a plan for a container means NO CHANGE IS PROPOSED for it --
        not that a change was assessed as safe.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: band
          in: query
          description: |
            Repeatable, or comma-separated. An unrecognised value is rejected
            rather than ignored.
          schema:
            type: array
            items: { $ref: "#/components/schemas/RiskBand" }
        - name: recommendation
          in: query
          description: Repeatable, or comma-separated.
          schema:
            type: array
            items: { $ref: "#/components/schemas/Recommendation" }
        - name: update
          in: query
          description: Repeatable, or comma-separated.
          schema:
            type: array
            items: { $ref: "#/components/schemas/UpdateType" }
        - name: currentOnly
          in: query
          description: |
            Only the newest plan per container. Defaults to true.
          schema: { type: boolean, default: true }
        - name: minRisk
          in: query
          description: Minimum risk score, 0 to 100.
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [band, risk, recommendation, generatedAt, container, update, id]
            default: band
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of plans, with the estate aggregate.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChangePlan" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                  summary: { $ref: "#/components/schemas/ChangePlanSummary" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PlanningUnavailable"

  /api/v1/plans/{id}:
    get:
      tags: [Change plans]
      summary: One assessment
      operationId: getChangePlan
      description: |
        Returns one plan by its immutable identifier, including the full
        reasoning: every rule that contributed, what it contributed, and why.

        There is no PATCH and no DELETE. A plan is a record of what was believed
        at one moment; an endpoint that edited one would destroy exactly the
        property that makes plans worth keeping.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            A server-generated plan identifier, `plan_` followed by twenty
            hexadecimal characters. Random rather than sequential: it appears in
            URLs, and a sequential one would leak how many plans exist.
          schema:
            type: string
            pattern: "^plan_[0-9a-f]{20}$"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePlan" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PlanningUnavailable"

  /api/v1/plans/container/{id}:
    get:
      tags: [Change plans]
      summary: One container's planning view
      operationId: getContainerPlans
      description: |
        The container's current plan and the history that led to it.

        History is the REASONING TIMELINE: how HarborMaster's assessment of this
        container has changed over time, which is what makes a verdict
        reviewable rather than merely stated. Newest first.

        `current` is ABSENT when the container has no plan. That means no change
        is proposed for it, NOT that a change was judged safe -- the two are
        different and a client must be able to tell them apart.
      parameters:
        - $ref: "#/components/parameters/ContainerId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The container's current plan and its history.
          content:
            application/json:
              schema:
                type: object
                required: [containerId, history, pagination]
                properties:
                  containerId: { type: string }
                  current:
                    allOf:
                      - $ref: "#/components/schemas/ChangePlan"
                    description: |
                      Absent when no change is proposed for this container.
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/ChangePlan" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AmbiguousId"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PlanningUnavailable"

  /api/v1/plans/generate:
    post:
      tags: [Change plans]
      summary: Request a plan generation pass
      operationId: generateChangePlans
      description: |
        Schedules a plan generation pass and answers 202 immediately.

        **It generates ANALYSIS.** The pass re-reads HarborMaster's own tables
        and re-runs HarborMaster's own risk model. It pulls no image, touches no
        container, restores nothing, and schedules no change -- there is no
        route here that could, and adding one would have to get past the
        architecture test that keeps the Docker SDK inside `internal/docker`.

        **It takes no body and no target.** There is no container, image, or
        registry parameter; the pass covers whatever the inventory already
        holds, and any query parameter attached to the request is simply not
        read.

        Asynchronous deliberately: a synchronous pass over a
        ten-thousand-container estate would hold an unauthenticated request open
        for minutes. The request is coalesced -- calling it in a loop produces
        one pass, not a backlog -- and it is rate limited on top of that.

        It is also close to free on a settled estate. Every assessment is
        fingerprinted over exactly the values it read, so a pass with nothing new
        to say writes nothing at all.
      responses:
        "202":
          description: The pass was scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [requested, planner]
                properties:
                  requested: { type: boolean }
                  planner: { $ref: "#/components/schemas/PlannerStatus" }
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/PlanningUnavailable"

  /api/v1/acquisitions:
    get:
      tags: [Image acquisition]
      summary: Images HarborMaster has downloaded
      operationId: listAcquisitions
      description: |
        Every attempt to acquire an image, newest first, with the estate
        aggregate.

        Each record is the audit trail of one DOWNLOAD. None of them describes a
        container being changed, because that operation does not exist.

        The summary carries `enabled`, so an empty list in a deployment that has
        not opted in is not read as "nothing has ever been downloaded".
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: state
          in: query
          description: |
            Repeatable, or comma-separated. An unrecognised value is rejected
            rather than ignored.
          schema:
            type: array
            items: { $ref: "#/components/schemas/AcquisitionState" }
        - name: failure
          in: query
          description: Repeatable, or comma-separated.
          schema:
            type: array
            items: { $ref: "#/components/schemas/AcquisitionFailure" }
        - name: activeOnly
          in: query
          description: Only work still in progress.
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [requestedAt, completedAt, state, container, id]
            default: requestedAt
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of acquisitions, with the estate aggregate.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Acquisition" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                  summary: { $ref: "#/components/schemas/AcquisitionSummary" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AcquisitionUnavailable"

    post:
      tags: [Image acquisition]
      summary: Download an approved image to this host
      operationId: requestAcquisition
      description: |
        **The only endpoint in this API that changes the Docker host.**

        Downloads the image an approved change plan names into the daemon's
        local image store, and answers 202 immediately.

        ### What it does not do

        **It does not update the container.** Nothing is stopped, started,
        recreated, or reconfigured; the container keeps running the image it was
        created from. Applying the acquired image is an operator's job with
        their own tooling. There is no endpoint in this API that would do it and
        no capability behind one.

        ### What it accepts

        A plan id, and optionally an idempotency key. **No registry,
        repository, digest, tag, platform, or pull option** -- unknown fields
        are rejected rather than ignored, so a target cannot be smuggled in. The
        image is derived from the plan.

        ### What it checks first

        The full preflight runs SYNCHRONOUSLY before the 202, so a refusal is
        immediate rather than arriving as a failed background job, and it runs
        AGAIN immediately before the download. That second run is what closes
        the gap between "a plan said this was reasonable" and "we are fetching
        it": the plan must still be current and still recommend the change, the
        container must still exist, the registry evidence must be fresh, and the
        digest must be the one that was approved.

        A refusal is a 409 (or a 404 / 429 / 503 where the situation warrants)
        carrying a `refusal` field naming the specific check that said no.

        ### After the transfer

        The image is re-inspected through the read-only path and its digest and
        platform compared against what was approved. A mismatch is recorded as a
        failure with the evidence, and is never retried automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcquisitionRequest" }
      responses:
        "202":
          description: The download was accepted and runs in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Acquisition" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          description: |
            The change plan or its container no longer exists. Carries the
            specific refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionRefusalResponse" }
        "409":
          description: |
            A preflight check refused. The world has moved since the plan was
            written, or an acquisition for this image is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionRefusalResponse" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: |
            Too many acquisitions are already running, or the write rate limit
            was exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionRefusalResponse" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AcquisitionUnavailable"

  /api/v1/acquisitions/{id}:
    get:
      tags: [Image acquisition]
      summary: One acquisition, with its audit trail
      operationId: getAcquisition
      description: |
        One acquisition and the bounded record of what happened to it, oldest
        entry first.

        The trail records state transitions and periodic progress. It is not a
        copy of the daemon's pull stream: that stream is unbounded and
        registry-influenced, and every string relayed from it is truncated and
        stripped of control characters before it is stored.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            A server-generated acquisition identifier, `acq_` followed by twenty
            hexadecimal characters.
          schema:
            type: string
            pattern: "^acq_[0-9a-f]{20}$"
      responses:
        "200":
          description: The acquisition and its audit trail.
          content:
            application/json:
              schema:
                type: object
                required: [acquisition, events]
                properties:
                  acquisition: { $ref: "#/components/schemas/Acquisition" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AcquisitionEvent" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AcquisitionUnavailable"

  /api/v1/acquisitions/{id}/cancel:
    post:
      tags: [Image acquisition]
      summary: Stop a download
      operationId: cancelAcquisition
      description: |
        Stops an acquisition an operator no longer wants.

        This changes nothing on the host beyond ending a transfer partway, which
        leaves the daemon's image store as it was. It takes no body.

        **Verification cannot be cancelled.** Once a transfer completes the
        bytes are already on the host, and stopping the confirmation step would
        leave an unverified image with no record saying so. An acquisition in
        `verifying` answers 409.

        An acquisition that finished between the request and the write is not an
        error: the operator's intent was that it stop, and it has.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^acq_[0-9a-f]{20}$"
      responses:
        "200":
          description: The acquisition, now cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Acquisition" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: |
            The acquisition has already finished, or has passed the point where
            stopping it is safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AcquisitionUnavailable"

  /api/v1/executions:
    get:
      tags: [Container recreation]
      summary: Containers HarborMaster has recreated
      operationId: listExecutions
      description: |
        Every recreation attempt, newest first, with the estate aggregate.

        The ordering puts work that NEEDS ATTENTION above everything else: a
        failure that left containers on this host is what an operator opens this
        page to find.

        The summary carries `enabled`, so an empty list in a deployment that has
        not opted in is not read as "nothing has ever been recreated", and
        `needsAttention`, which counts the failures a person still has to
        settle.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: state
          in: query
          description: |
            Repeatable, or comma-separated. An unrecognised value is rejected
            rather than ignored.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ExecutionState" }
        - name: failure
          in: query
          description: Repeatable, or comma-separated.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ExecutionFailure" }
        - name: activeOnly
          in: query
          description: Only work still in progress.
          schema: { type: boolean }
        - name: needsAttention
          in: query
          description: |
            Only failures that left containers on this host for an operator to
            settle. Selected from the CHECKPOINT rather than from the failure
            classification, because the checkpoint is what says whether anything
            was actually changed.
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [requestedAt, completedAt, state, container, id]
            default: requestedAt
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of recreations, with the estate aggregate.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Execution" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                  summary: { $ref: "#/components/schemas/ExecutionSummary" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ExecutionUnavailable"

    post:
      tags: [Container recreation]
      summary: Recreate one container on an already-acquired image
      operationId: requestExecution
      description: |
        **The only endpoint in this API that changes something RUNNING.**

        Stops one container, creates a replacement from its own configuration
        and the acquired image, starts it, proves it, and removes the original.
        Answers 202 immediately; the work runs in the background.

        ### What it accepts

        An ACQUISITION ID, and optionally an idempotency key. **No container, no
        image, no digest, no tag, no command, no mount, no capability, no
        privilege flag, no timeout, and no force.** Unknown fields are rejected
        rather than ignored. Everything about what will happen is derived from
        the acquisition, which was derived from a change plan.

        There is no `allowReuse`, no `force`, and no `skipVerification`. An
        acquisition is single use: a second recreation needs a fresh plan and a
        fresh acquisition.

        ### What it checks first

        The full preflight runs SYNCHRONOUSLY before the 202, so a refusal is
        immediate rather than arriving as a failed background job, and it runs
        AGAIN immediately before the first mutation. Every prerequisite is
        re-read: the acquisition succeeded and is fresh and unused, the plan is
        current and still recommends the change, the container exists and is
        still on the assessed image, the inventory is fresh, a usable snapshot
        exists, the policy evaluation is fresh and complete with no critical
        violation, the registry evidence is fresh, and the image is still
        present locally carrying the approved digest for this platform.

        A refusal is a 409 (or a 404 / 429 / 503 where the situation warrants)
        carrying a `refusal` field naming the specific check that said no.

        ### What happens to the containers

        The original is STOPPED and RENAMED to `<name>.hm-old-<executionId>`. It
        is not removed. The replacement takes the original's name, and the
        original is removed only after all four proofs pass and the success is
        recorded durably.

        On any failure after that first stop, the replacement is stopped and
        renamed to `<name>.hm-failed-<executionId>`, both containers are left in
        place, and the record carries a manual `recovery` plan. **HarborMaster
        does not roll back**, and there is no endpoint that would.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionRequest" }
      responses:
        "202":
          description: The recreation was accepted and runs in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          description: |
            The acquisition, its plan, or its container no longer exists.
            Carries the specific refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionRefusalResponse" }
        "409":
          description: |
            A preflight check refused. The world has moved since the image was
            acquired, the acquisition has already been used, or a recreation for
            this container is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionRefusalResponse" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: |
            Too many recreations are already running, or the write rate limit
            was exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionRefusalResponse" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ExecutionUnavailable"

  /api/v1/executions/{id}:
    get:
      tags: [Container recreation]
      summary: One recreation, with its audit trail
      operationId: getExecution
      description: |
        One recreation and the bounded record of what happened to it, oldest
        entry first.

        The record carries the CHECKPOINT, which is the field to read first: it
        says what is true of the host, as opposed to `state`, which says what
        HarborMaster was doing. After an interrupted recreation only the first
        question matters.

        When a failure left containers behind, `recovery` carries the manual
        steps. It is text. Nothing executes it.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            A server-generated execution identifier, `exec_` followed by twenty
            hexadecimal characters.
          schema:
            type: string
            pattern: "^exec_[0-9a-f]{20}$"
      responses:
        "200":
          description: The recreation and its audit trail.
          content:
            application/json:
              schema:
                type: object
                required: [execution, events]
                properties:
                  execution: { $ref: "#/components/schemas/Execution" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ExecutionEvent" }
                  rollback:
                    allOf:
                      - $ref: "#/components/schemas/RollbackEligibility"
                    description: |
                      Whether this recreation LOOKS like one that can be undone,
                      and if not, why.

                      **Advice only, and computed from records alone.** It
                      issues no Docker call, so it cannot say whether the two
                      containers are still where the record puts them — this
                      endpoint is polled, and letting a read turn one HTTP
                      request into four privileged socket calls would make it a
                      denial-of-service amplifier.

                      Nothing is lost by that. `POST /rollbacks` runs the full
                      assessment against the live host before it accepts
                      anything, and runs it again immediately before the first
                      mutation. A caller that saw `eligible: true` here can
                      still be refused there, with a specific reason.

                      ABSENT when manual rollback is not configured, which is
                      distinct from a refusal: a check that was never performed
                      establishes nothing.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ExecutionUnavailable"

  /api/v1/executions/{id}/cancel:
    post:
      tags: [Container recreation]
      summary: Stop a recreation that has not yet changed anything
      operationId: cancelExecution
      description: |
        Stops a recreation an operator no longer wants. It takes no body.

        **Only before the first mutation.** A recreation in `queued`,
        `validating`, or `capturing` has changed nothing on this host, so
        stopping it is free. From `creating` onward the original has been
        stopped and a replacement may exist, and abandoning that would leave the
        host in a state nobody recorded -- so the only safe direction is
        forwards, through verification, to a recorded conclusion.

        An execution past that point answers 409. The message says why rather
        than only refusing, because "you cannot cancel this" invites an operator
        to try harder while "the container has already been stopped" tells them
        what to do next.

        A recreation that finished between the request and the write is not an
        error: the caller is told what the record actually says.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^exec_[0-9a-f]{20}$"
      responses:
        "200":
          description: The recreation, now cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Execution" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: |
            The recreation has already finished, or has passed the point where
            stopping it would leave the host in an unrecorded state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ExecutionUnavailable"


  # ------------------------------------------------------- manual rollback --

  /api/v1/rollbacks:
    get:
      tags: [Manual rollback]
      summary: Recreations an operator has undone
      operationId: listRollbacks
      description: |
        Every rollback attempt, newest first, with the estate aggregate.

        The ordering puts work that NEEDS ATTENTION above everything else: a
        rollback that failed after changing this host is what an operator opens
        this page to find, and it is the case where a container may currently be
        down.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: executionId
          in: query
          description: Only rollbacks of one recreation.
          schema:
            type: string
            pattern: "^exec_[0-9a-f]{20}$"
        - name: state
          in: query
          description: |
            Repeatable, or comma-separated. An unrecognised value is rejected
            rather than ignored.
          schema:
            type: array
            items: { $ref: "#/components/schemas/RollbackState" }
        - name: failure
          in: query
          description: Repeatable, or comma-separated.
          schema:
            type: array
            items: { $ref: "#/components/schemas/RollbackFailure" }
        - name: activeOnly
          in: query
          description: Only work still in progress.
          schema: { type: boolean }
        - name: needsAttention
          in: query
          description: |
            Only failures that left containers on this host for an operator to
            settle. Selected from the CHECKPOINT rather than from the failure
            classification, because the checkpoint is what says whether anything
            was actually changed.
          schema: { type: boolean }
      responses:
        "200":
          description: A page of rollbacks, with the estate aggregate.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Rollback" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                  summary: { $ref: "#/components/schemas/RollbackSummary" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RollbackUnavailable"

    post:
      tags: [Manual rollback]
      summary: Undo one recreation
      operationId: requestRollback
      description: |
        **Stops the container a recreation put in place and starts the one it
        replaced.** Answers 202 immediately; the work runs in the background.

        ### This causes downtime

        The replacement is stopped BEFORE the original is started, and the
        original has to start and pass its checks before service resumes. There
        is no overlap and no draining.

        ### What it accepts

        An EXECUTION ID, and optionally an idempotency key. **No container id,
        no container name, no image, no digest, no snapshot, no Docker
        parameter, and no force.** Unknown fields are rejected rather than
        ignored. Both container identities come from HarborMaster's own record
        of that recreation, so aiming a rollback at a container of the caller's
        choosing is structurally impossible rather than merely checked for.

        ### What it checks first

        The full preflight runs SYNCHRONOUSLY before the 202, so a refusal is
        immediate rather than arriving as a failed background job, and it runs
        AGAIN immediately before the first mutation. Every prerequisite is
        re-read: the execution exists and has settled, its checkpoint left an
        arrangement that can be undone, the original was not removed, no
        successful rollback of it exists, no rollback or recreation of this
        container is in flight, the daemon answers, the inventory is fresh, both
        containers are still present under the names and images the record
        gives, the production name is free or held by the replacement, and the
        original's configuration can be projected so the result can be proved.

        A refusal is a 409 (or 404 / 503 where the situation warrants) carrying a
        `refusal` field naming the specific check that said no.

        ### What happens to the containers

        The replacement is STOPPED and RENAMED to
        `<name>.hm-rolledback-<rollbackId>`. **It is not removed** -- it is the
        evidence of why the recreation was backed out, and the rollback
        capability has no remove method. The original is then renamed back to
        the production name and started, and proved: health or stability, image
        identity, configuration preservation, network attachment. A rollback is
        recorded as succeeded only when all four pass.

        On any failure after that first stop, both containers are left in place,
        the checkpoint records exactly what was done, and a manual `recovery`
        plan is written. **HarborMaster never guesses which container should
        serve traffic**, and it does not try to put things back: it has just
        demonstrated that its model of the host is wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackRequest" }
      responses:
        "202":
          description: The rollback was accepted and runs in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rollback" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          description: |
            The recreation is not recorded here. Carries the specific refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RollbackRefusalResponse" }
        "409":
          description: |
            A preflight check refused. The recreation left nothing to undo, the
            original is gone or is not the container the record describes, this
            recreation has already been rolled back, or a rollback or recreation
            for this container is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RollbackRefusalResponse" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: |
            Too many rollbacks are already running, or the write rate limit was
            exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RollbackRefusalResponse" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RollbackUnavailable"

  /api/v1/rollbacks/{id}:
    get:
      tags: [Manual rollback]
      summary: One rollback, with its checkpoint trail
      operationId: getRollback
      description: |
        One rollback and the bounded record of what happened to it, oldest entry
        first.

        The record carries the CHECKPOINT, which is the field to read first: it
        says what is true of the host, as opposed to `state`, which says what
        HarborMaster was doing. After an interrupted rollback only the first
        question matters.

        When a failure left containers behind, `recovery` carries the manual
        steps. It is text. Nothing executes it.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            A server-generated rollback identifier, `rbk_` followed by twenty
            hexadecimal characters.
          schema:
            type: string
            pattern: "^rbk_[0-9a-f]{20}$"
      responses:
        "200":
          description: The rollback and its checkpoint trail.
          content:
            application/json:
              schema:
                type: object
                required: [rollback, events]
                properties:
                  rollback: { $ref: "#/components/schemas/Rollback" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/RollbackEvent" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RollbackUnavailable"

  /api/v1/rollbacks/{id}/cancel:
    post:
      tags: [Manual rollback]
      summary: Stop a rollback that has not yet changed anything
      operationId: cancelRollback
      description: |
        Stops a rollback an operator no longer wants. It takes no body.

        **Only before the first mutation.** A rollback in `queued` or
        `validating` has changed nothing on this host, so stopping it is free.
        From `stoppingReplacement` onward the replacement has been stopped, and
        abandoning that would leave a container an operator depends on neither
        running nor recorded as down -- so the only safe direction is forwards,
        through verification, to a recorded conclusion.

        A rollback past that point answers 409. The message says why rather than
        only refusing, because "you cannot cancel this" invites an operator to
        try harder while "the replacement has already been stopped" tells them
        what to do next.

        A rollback that finished between the request and the write is not an
        error: the caller is told what the record actually says.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^rbk_[0-9a-f]{20}$"
      responses:
        "200":
          description: The rollback, now cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rollback" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: |
            The rollback has already finished, or has passed the point where
            stopping it would leave the host in an unrecorded state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/RollbackUnavailable"


  # ------------------------------------------------------------ identity --

  /api/v1/auth/bootstrap:
    get:
      tags: [Identity]
      summary: Report whether this installation has been claimed
      operationId: getBootstrapStatus
      security: []
      description: |
        Public, and deliberately says almost nothing: whether an administrator
        exists, and that claiming needs the one-time token. A client needs this
        to choose between the sign-in page and the bootstrap page before it
        holds any credential.
      responses:
        "200":
          description: The bootstrap state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

    post:
      tags: [Identity]
      summary: Create the first administrator
      operationId: bootstrapInstallation
      security: []
      description: |
        Exchanges the one-time bootstrap token for the first administrator and
        issues a session.

        **Reachable only while the installation is unclaimed.** Once an
        administrator exists this answers `404`: for that installation the
        endpoint genuinely no longer exists, and answering "forbidden" would
        confirm there is a flow to race.

        The token is printed to the server's output at startup and re-minted on
        every restart of an unclaimed installation, so claiming requires the
        ability to read the log rather than merely to reach the port. Both the
        success and every rejected attempt are audited.

        CSRF-exempt because there is no session to derive a token from; covered
        instead by SameSite, the Origin and Fetch Metadata checks, the JSON
        content-type requirement, and the rate limiter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "200":
          description: |
            The installation is claimed. The session cookie is set; the body
            carries the account and the CSRF token, and never the session token.
          headers:
            Set-Cookie:
              description: The session cookie. HttpOnly, SameSite, Path=/.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: The bootstrap token was absent, wrong, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The installation already has an administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      tags: [Identity]
      summary: Authenticate and start a session
      operationId: login
      security: []
      description: |
        **Every credential failure answers `401` with the same code and the same
        prose** -- an unknown username, a wrong password, and a disabled account
        are indistinguishable to a client. The server makes the TIMING match too
        by hashing an unknown username against a decoy, so this endpoint cannot
        be used as an account directory.

        Repeated failures apply an exponential per-account backoff and a
        per-address throttle. A backoff rather than a lockout: a lockout would
        let anyone who knows a username deny that account service.

        The session token is set in an HttpOnly cookie and appears in no
        response body. The CSRF token IS in the body, because a script has to
        send it back in a header and it is useless without the cookie a script
        cannot read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. The session cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie. HttpOnly, SameSite, Path=/.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: |
            The username or password is incorrect. One response for every cause.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: unauthenticated
                  message: the username or password is incorrect
                requestId: 3f8a1c9e7b2d4a6f0c1e5b93
        "429":
          $ref: "#/components/responses/RateLimited"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/auth/logout:
    post:
      tags: [Identity]
      summary: End this session
      operationId: logout
      description: |
        Revokes the session this request arrived on and expires the cookie. No
        other session on the account is affected -- ending all of them is what a
        password change does.
      responses:
        "204":
          description: The session is revoked and the cookie expired.
          headers:
            Set-Cookie:
              description: The expired session cookie.
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/session:
    get:
      tags: [Identity]
      summary: Report the caller's identity
      operationId: getSession
      description: |
        The signed-in account, everything its role permits, and a CSRF token for
        this session. A client calls this first: it is how an application learns
        whether it is signed in, and what to render.

        Reachable by an account that must change its password, because
        otherwise it could not discover that it must.
      responses:
        "200":
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/password:
    post:
      tags: [Identity]
      summary: Change the caller's own password
      operationId: changePassword
      description: |
        **The current password is required** even though the request is already
        authenticated. A session is a possession factor and the current password
        a knowledge factor; requiring both stops a stolen session being upgraded
        into permanent account control.

        **The session rotates.** Every session on the account is revoked --
        including any a thief holds, and including this one -- and a fresh
        cookie replaces it. The response carries a NEW CSRF token, which a
        client must install or its next write is refused.

        Reachable by an account that must change its password: that is the whole
        point of the exemption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: The password is changed and a replacement session issued.
          headers:
            Set-Cookie:
              description: The replacement session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: |
            The new password was refused by the policy. The message explains
            which rule it failed and never echoes the password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/sessions:
    get:
      tags: [Identity]
      summary: List the caller's own live sessions
      operationId: listOwnSessions
      description: |
        The caller's OWN. There is no parameter naming another account: an
        administrator investigating somebody else's sessions does it through the
        account endpoints, where the permission check is explicit.
      responses:
        "200":
          description: The caller's live sessions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/sessions/{id}/revoke:
    post:
      tags: [Identity]
      summary: End one of the caller's own sessions
      operationId: revokeOwnSession
      parameters:
        - name: id
          in: path
          required: true
          description: The public session identifier, never the token.
          schema: { type: string }
      responses:
        "204":
          description: The session is revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------ accounts --

  /api/v1/users:
    get:
      tags: [Accounts]
      summary: List accounts
      operationId: listUsers
      description: Requires `user:manage`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Accounts]
      summary: Create an account
      operationId: createUser
      description: |
        Requires `user:manage`.

        Omitting `password` makes HarborMaster generate one and return it
        EXACTLY ONCE, which is the safer default: an administrator never has to
        invent a password for somebody else and never has one they chose sitting
        in their clipboard. It is never stored in plaintext and never
        retrievable again.

        Every new account carries `mustChangePassword`, because the credential
        was chosen by somebody other than its holder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: |
            The account, and the generated password if one was generated. The
            password is in this response and nowhere else, ever.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The username is taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Accounts]
      summary: Read one account
      operationId: getUser
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Accounts]
      summary: Change an account's role or status
      operationId: updateUser
      description: |
        Requires `user:manage`.

        **There is deliberately no DELETE.** Disabling preserves the history an
        audit record depends on, and an account that never existed is a
        different fact from one that was turned off.

        Two refusals are built in and are not configurable: an administrator
        cannot modify their own account, and the last active administrator
        cannot be demoted or disabled. Either change ends every session on the
        affected account immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The account as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The change would remove the last active administrator, or the caller
            tried to modify their own account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/{id}/password-reset:
    post:
      tags: [Accounts]
      summary: Reset an account's password
      operationId: resetUserPassword
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      description: |
        Requires `user:manage`.

        Sets a GENERATED temporary password, returns it once, and revokes every
        session on the account. The password is generated rather than chosen by
        the administrator: one they picked is one they know.
      responses:
        "200":
          description: The temporary password, returned once.
          content:
            application/json:
              schema:
                type: object
                required: [temporaryPassword]
                properties:
                  temporaryPassword:
                    type: string
                    description: |
                      Shown once, stored nowhere, and must be changed at the
                      account's next sign-in.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/roles:
    get:
      tags: [Accounts]
      summary: List the roles and what each one permits
      operationId: getRoles
      description: |
        The catalogue the authorization middleware itself reads. Fetched rather
        than hardcoded by a client: a second copy would eventually offer a role
        the server does not recognise.
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCatalogue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ------------------------------------------------------- security audit --

  /api/v1/audit:
    get:
      tags: [Security audit]
      summary: Read the security audit log
      operationId: listAuditEvents
      description: |
        Requires `audit:read`, which only an administrator holds.

        Who did what, to what, from where, and whether it worked. **It is not a
        request log**: no body, no header, no environment value, and no
        credential appears in any record. Records are append-only -- nothing in
        HarborMaster can edit or delete one.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: action
          in: query
          description: Repeatable. Values outside the vocabulary are rejected.
          schema: { type: array, items: { type: string } }
        - name: outcome
          in: query
          description: Repeatable.
          schema:
            type: array
            items: { type: string, enum: [succeeded, failed, denied] }
        - name: actorUserId
          in: query
          schema: { type: string }
        - name: targetType
          in: query
          schema: { type: string }
        - name: targetId
          in: query
          description: |
            The identifier the action acted on -- an execution id, a policy id,
            a snapshot number, or, for an authorization denial, the permission
            that was refused.
          schema: { type: string, maxLength: 256 }
        - name: securityOnly
          in: query
          description: |
            Restrict to authentication, authorization, and account
            administration -- the records kept far longer than operational ones.
          schema: { type: boolean }
        - name: since
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of audit records, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/summary:
    get:
      tags: [Security audit]
      summary: Count audit records by outcome
      operationId: getAuditSummary
      responses:
        "200":
          description: The counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: harbormaster_session
      description: |
        An opaque, server-side session token.

        Named `__Host-harbormaster_session` when the request arrived over
        HTTPS. The `__Host-` prefix is a browser-enforced guarantee rather than
        a convention: a cookie carrying it MUST be Secure, MUST have `Path=/`,
        and MUST NOT set a Domain, which stops a sibling subdomain overwriting
        the session cookie.

        Set by `POST /auth/login` and `POST /auth/bootstrap`. It is HttpOnly, so
        no script can read it, and it appears in no response body, URL, or log.
        The server stores only a keyed digest, so a stolen database yields no
        usable session.

        Every state-changing request additionally needs the
        `X-HarborMaster-CSRF` header; see `csrfToken`.

    csrfToken:
      type: apiKey
      in: header
      name: X-HarborMaster-CSRF
      description: |
        The per-session CSRF token, required on POST, PUT, PATCH, and DELETE.

        Returned by `/auth/login`, `/auth/session`, and `/auth/password`. It is
        DERIVED from the session token rather than stored, so it rotates with
        the session and nothing at rest can be stolen. A custom header cannot be
        set by a cross-origin form or a "simple" fetch without a preflight, and
        no CORS headers are served -- so the preflight fails.

        Declared as a scheme for documentation. The document's global
        requirement names `sessionCookie` only, because an OpenAPI security
        requirement cannot express "this applies to write methods".

  headers:
    RequestId:
      description: |
        Server-generated correlation ID, also present in the access log. A
        client-supplied `X-Request-ID` is ignored rather than echoed.
      schema:
        type: string

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Items per page. Values above the maximum are rejected, not clamped.
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
    ContainerId:
      name: id
      in: path
      required: true
      description: Full container ID, unambiguous ID prefix, or exact container name.
      schema: { type: string }
    SnapshotId:
      name: id
      in: path
      required: true
      description: Numeric snapshot identifier.
      schema: { type: integer, format: int64, minimum: 1 }
    DriftId:
      name: id
      in: path
      required: true
      description: Numeric drift record identifier.
      schema: { type: integer, format: int64, minimum: 1 }
    PolicyId:
      name: id
      in: path
      required: true
      description: |
        Immutable policy identifier. Validated by SHAPE before it reaches a
        query: server-generated ids have exactly one form, so anything else is
        a miss.
      schema: { type: string, pattern: "^pol_[0-9a-f]{20}$" }
    ViolationId:
      name: id
      in: path
      required: true
      description: Numeric policy violation identifier.
      schema: { type: integer, format: int64, minimum: 1 }
    ImageId:
      name: id
      in: path
      required: true
      description: Full image ID, short ID, or an unambiguous prefix.
      schema: { type: string, maxLength: 256 }

  responses:
    Unauthenticated:
      description: |
        No usable session. The session cookie is absent, expired, revoked, or
        belongs to an account that no longer exists or has been disabled --
        which of those is deliberately not distinguished.

        A `bootstrap_required` code means the installation has no administrator
        yet; claim it with `POST /auth/bootstrap`.

        The response clears the session cookie, so a browser holding a dead
        token stops sending it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            noSession:
              value:
                error: { code: unauthenticated, message: authentication is required }
                requestId: 3f8a1c9e7b2d4a6f0c1e5b93
            unclaimed:
              value:
                error:
                  code: bootstrap_required
                  message: this installation has no administrator yet
                requestId: 3f8a1c9e7b2d4a6f0c1e5b93

    Forbidden:
      description: |
        Authenticated, but the account's role does not hold this endpoint's
        permission -- or the account must change its password before doing
        anything else, or a state-changing request carried no valid CSRF token.

        Every denial is recorded in the security audit log with the PERMISSION
        that was refused, never the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            wrongRole:
              value:
                error: { code: forbidden, message: your role does not permit this }
                requestId: 3f8a1c9e7b2d4a6f0c1e5b93
            csrf:
              value:
                error:
                  code: csrf_required
                  message: this request needs a valid CSRF token
                requestId: 3f8a1c9e7b2d4a6f0c1e5b93
            mustChangePassword:
              value:
                error:
                  code: password_change_required
                  message: this account must set a new password before doing anything else
                requestId: 3f8a1c9e7b2d4a6f0c1e5b93

    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: { code: not_found, message: container not found }
            requestId: 3f8a1c9e7b2d4a6f0c1e5b93

    InvalidRequest:
      description: |
        A query parameter was malformed or out of range. The message names the
        parameter and what was expected; it never echoes the value supplied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: { code: invalid_request, message: pageSize must be at most 200 }
            requestId: 3f8a1c9e7b2d4a6f0c1e5b93

    AmbiguousId:
      description: |
        The supplied ID prefix matches more than one resource. HarborMaster
        refuses rather than picking one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ambiguous_id
              message: the id prefix matches more than one container; supply more characters
            requestId: 3f8a1c9e7b2d4a6f0c1e5b93

    MethodNotAllowed:
      description: |
        The path exists but the method is not permitted. Every endpoint except
        the inventory refresh is read-only.
      headers:
        Allow:
          description: Permitted methods.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: { code: method_not_allowed, message: method not allowed }

    InventoryUnavailable:
      description: |
        The inventory is not configured or is disabled by configuration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: { code: feature_disabled, message: inventory is disabled by configuration }

    EventsUnavailable:
      description: |
        The event engine is not configured on this deployment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: { code: feature_disabled, message: the event engine is not configured }

    PayloadTooLarge:
      description: The request body exceeded the configured limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: |
        An unexpected server-side failure. The message is deliberately generic:
        the API never returns a stack trace or an internal error chain. Use
        `requestId` to find the full detail in the server log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    SnapshotsUnavailable:
      description: Snapshots are not configured or are disabled by configuration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    DriftUnavailable:
      description: |
        Drift detection is not configured or is disabled by configuration.
        Records already collected remain readable; only evaluation stops.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    AcquisitionUnavailable:
      description: |
        Image acquisition is not available in this deployment.

        Returned by the WRITE endpoints whenever acquisition is switched off,
        which is the default: a HarborMaster in this state holds no write
        capability against the Docker host at all -- the capability is absent
        rather than merely unused.

        The READ endpoints stay available and answer 200 with `summary.enabled`
        set to false, so records already stored remain readable and an empty
        list is not mistaken for "nothing has ever been downloaded". They answer
        503 only when the feature is not wired at all.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ExecutionUnavailable:
      description: |
        Container recreation is not available in this deployment.

        The default, and the strongest form of "off" HarborMaster has: when the
        feature is disabled the Docker adapter's container mutation capability
        is never handed to anything, so the process holds no ability to stop or
        replace a container at all. The capability is ABSENT rather than merely
        unused, and no request can turn it back on.

        The READ endpoints stay available and answer 200 with `summary.enabled`
        set to false, so records already stored remain readable. They answer 503
        only when the feature is not wired at all.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    RollbackUnavailable:
      description: |
        Manual rollback is not available in this deployment.

        The default, and the strongest form of "off" HarborMaster has: when the
        feature is disabled the Docker adapter's rollback capability is never
        handed to anything, so the process holds no ability to stop, rename, or
        start a container through this path at all. The capability is ABSENT
        rather than merely unused, and no request can turn it back on.

        Every rollback route answers 503 in that case, including the reads. A
        404 would say the feature does not exist and send an operator looking
        for the wrong thing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PlanningUnavailable:
      description: |
        Change planning is not configured or is disabled by configuration.

        Plans already stored remain in the database; only generation and these
        endpoints stop. Reported as 503 rather than as an empty list, because an
        empty list of plans reads as "no risk found" and a disabled feature has
        found nothing at all.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ImageIntelUnavailable:
      description: |
        Image intelligence is not configured or is disabled by configuration.

        When disabled, HarborMaster makes NO outbound network request at all --
        which is the setting an air-gapped deployment wants. Metadata already
        collected remains in the database; only the lookups and these endpoints
        stop.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PolicyUnavailable:
      description: |
        The policy engine is not configured or is disabled by configuration.
        Definitions and violations already stored remain in the database; only
        evaluation and the endpoints stop.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PolicyInvalid:
      description: |
        The policy definition was rejected. The message names the FIELD and the
        constraint it broke -- for example `rules[0].values[0] must be at most
        128 bytes` -- and never echoes the value supplied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_request
              message: rules[1].type is already used by another rule in this policy; merge their values instead
            requestId: 3f8a1c9e7b2d4a6f0c1e5b93

    UnsupportedMediaType:
      description: |
        The request did not carry `Content-Type: application/json`. Required on
        every write endpoint, which also forces a CORS preflight for
        cross-origin callers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    CrossOriginRejected:
      description: |
        The request carried `Sec-Fetch-Site: cross-site`/`same-site`, or an
        `Origin` that does not match the request host.

        This is defence in depth rather than the primary control: these headers
        are absent in older browsers and trivially omitted by a non-browser
        client. Request validation, rate limiting, and concurrency limits hold
        independently of them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    RateLimited:
      description: |
        The write or comparison rate limit was exceeded. `Retry-After` gives the
        seconds to wait.

        The limit is per process, not per client: HarborMaster is
        unauthenticated, so there is no trustworthy client identity to key on,
        and a per-IP bucket would be trivially evaded while implying a precision
        the system does not have.

        The policy write endpoints use a SEPARATE, more permissive bucket. A
        limit should be proportional to what the request costs, and a policy
        write is one small transaction on HarborMaster's own table rather than a
        Docker sweep.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ------------------------------------------------------------- shared --

    Pagination:
      type: object
      required: [page, pageSize, totalItems, totalPages, hasNext, hasPrevious]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }

    ErrorCode:
      type: string
      description: |
        Stable machine-readable identifier. Client logic must branch on this
        rather than on `message`, whose prose may change.
      enum:
        - not_found
        - method_not_allowed
        - payload_too_large
        - internal_error
        - invalid_request
        - ambiguous_id
        - conflict
        - service_unavailable
        - feature_disabled

    ErrorResponse:
      type: object
      description: The envelope returned by every non-2xx JSON response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                Short human-readable summary, safe to display. Never contains a
                stack trace, a filesystem path, an internal error chain, or a
                value the caller supplied.
        requestId:
          type: string
          description: Correlates this response with the server log.

    # ------------------------------------------------------------- system --

    ComponentStatus:
      type: string
      description: Reachability of a single dependency.
      enum: [up, down]

    Component:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ComponentStatus"
        detail:
          type: string
          description: |
            Short, operator-safe explanation when the dependency is down. Never
            carries a raw error chain, a socket path, or credentials.
        latencyMs: { type: integer, format: int64, minimum: 0 }
        version: { type: string }

    HealthReport:
      type: object
      required: [status, database, docker, checkedAt, uptimeSeconds]
      properties:
        status:
          type: string
          description: |
            * `healthy` — every dependency is up.
            * `degraded` — the Docker Engine is unreachable, or the Docker event
              stream is disconnected. HarborMaster still serves; the UI renders
              a disconnected state.
            * `unhealthy` — the database is unreachable.
          enum: [healthy, degraded, unhealthy]
        database:
          $ref: "#/components/schemas/Component"
        docker:
          $ref: "#/components/schemas/Component"
        events:
          description: |
            The Docker event engine. Omitted entirely when no engine is
            configured, rather than reporting a fabricated status.

            A disconnected stream yields `degraded` overall and never
            `unhealthy`: periodic reconciliation still keeps the inventory
            correct, and a transient reconnect must not fail the container
            health check and cause a restart loop. A DISABLED engine reports
            `up`, because running on periodic reconciliation alone is a
            supported configuration.
          $ref: "#/components/schemas/Component"
        checkedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer, format: int64, minimum: 0 }

    VersionInfo:
      type: object
      required: [version, commit, buildDate, goVersion, platform]
      properties:
        version: { type: string, examples: [v0.2.0] }
        commit: { type: string, examples: [9f2c1ab] }
        buildDate: { type: string, examples: ["2026-08-03T08:00:00Z"] }
        goVersion: { type: string, examples: [go1.26.5] }
        platform: { type: string, examples: [linux/amd64] }

    # ------------------------------------------------------ docker events --

    DockerEventType:
      type: string
      description: |
        The kind of object an event describes. `other` covers anything
        HarborMaster does not model: such events are recorded so the history is
        honest about what arrived, but they trigger no inventory work.
      enum: [container, image, network, volume, daemon, other]

    EventProcessingResult:
      type: string
      description: |
        * `processed` — recorded, and a refresh was requested where applicable.
        * `deduplicated` — an identical event was already seen inside the
          deduplication window. Counted, not stored, and it does no extra work.
        * `ignored` — recorded, but the event has no inventory consequence
          (an exec, an unmodelled type).
        * `warning` — recorded, but it could not be mapped onto one resource, so
          a full reconciliation was requested instead. A conservative success,
          not a failure.
        * `failed` — processing raised an error. The event is still stored, and
          `error` carries a sanitised summary.
      enum: [processed, deduplicated, ignored, warning, failed]

    RefreshRequest:
      type: string
      description: |
        The synchronization the event asked for. Events never write container
        state; they request one of these, and the inventory service performs the
        actual read and persist.
      enum:
        - none
        - container
        - container_absent
        - image
        - image_catalog
        - networks
        - volumes
        - full

    EventConnectionState:
      type: string
      description: |
        The event stream's connection state. `disabled` is a deliberate
        operating mode, not a fault.
      enum: [disabled, connecting, connected, reconnecting, stopped]

    DockerEvent:
      type: object
      description: |
        One normalized, redacted observation from the Docker event stream.

        A hint that something MAY have changed, never a statement of what a
        container now is. Attribute values whose key matched a sensitive-name
        pattern carry `********`.
      required:
        - sequence
        - fingerprint
        - hostId
        - type
        - action
        - attributes
        - dockerTime
        - observedAt
        - result
        - refreshRequested
        - createdAt
      properties:
        sequence:
          type: integer
          format: int64
          description: |
            HarborMaster's monotonic local ordering, assigned on persistence. It
            is the SSE event ID and the deterministic tiebreak for every list
            query. Because Docker guarantees no global ordering, this records
            the order events were OBSERVED in.
        fingerprint:
          type: string
          description: |
            The deterministic deduplication identity, derived from host, type,
            action, actor, scope, and the daemon's nanosecond timestamp. Widened
            to include every actor attribute when the daemon supplied only whole
            seconds, which is too coarse to separate a burst.
        hostId: { type: string, examples: [local] }
        type:
          $ref: "#/components/schemas/DockerEventType"
        action:
          type: string
          description: |
            The verb, lower-cased. Deliberately an open string rather than an
            enum: daemons differ by version in which actions they emit. A
            colon-separated suffix (a health status, an exec command line) is
            split off into the `harbormaster.actionDetail` attribute so the verb
            stays filterable and the detail is not lost.
          examples: [start, die, health_status, pull]
        actorId:
          type: string
          description: |
            The container ID, image ID or reference, network ID, or volume name
            the event concerns. Empty when the daemon supplied none, in which
            case HarborMaster escalates to a full reconciliation rather than
            guessing.
        actorName:
          type: string
          description: The human-readable resource name, where the daemon provides one.
        scope:
          type: string
          description: "`local` for engine events, `swarm` for cluster events."
          examples: [local]
        attributes:
          type: object
          additionalProperties: { type: string }
          description: |
            Actor attributes AFTER redaction. These are the resource's labels
            plus daemon-supplied fields, so they can carry credentials; any
            value whose KEY matched a sensitive pattern is `********`.
            Non-sensitive structural metadata is preserved, because inventory
            correlation depends on it.
          examples:
            - name: shop-web-1
              image: "nginx:1.27"
              DB_PASSWORD: "********"
        composeProject: { type: string }
        composeService: { type: string }
        harbormasterLabels:
          type: object
          additionalProperties: { type: string }
          description: "`io.harbormaster.*` attributes with the prefix stripped."
        dockerTime:
          type: string
          format: date-time
          description: When the daemon says the event happened.
        dockerTimeNano:
          type: integer
          format: int64
          description: |
            The same instant in nanoseconds, when the daemon supplied one.
            Absent (0) on older daemons that report whole seconds only.
        observedAt:
          type: string
          format: date-time
          description: |
            When HarborMaster read the event off the stream. It differs from
            `dockerTime` by the stream latency normally, and by much more after
            a reconnect -- which is exactly why both are recorded.
        result:
          $ref: "#/components/schemas/EventProcessingResult"
        refreshRequested:
          $ref: "#/components/schemas/RefreshRequest"
        error:
          type: string
          description: |
            A sanitised processing failure or warning reason. Never a raw Docker
            error, which can name the socket path.
        connectionState:
          $ref: "#/components/schemas/EventConnectionState"
        createdAt: { type: string, format: date-time }

    DockerEventDetail:
      allOf:
        - $ref: "#/components/schemas/DockerEvent"
        - type: object
          required: [links, redacted]
          properties:
            links:
              type: object
              description: |
                API paths for the resources this event concerns, where they can
                be resolved. Absent rather than guessed when they cannot.
              properties:
                container: { type: string, examples: ["/api/v1/containers/b8f1c0d2e3a4"] }
                image: { type: string, examples: ["/api/v1/images/sha256:abc"] }
            redacted:
              type: boolean
              const: true
              description: |
                Always true. Attribute values matching sensitive-name patterns
                were replaced before the event was stored, so there is no
                unredacted copy anywhere.

    DockerEventList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DockerEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"

    EventEngineCounters:
      type: object
      description: |
        Lifetime tallies. Plain counters rather than a metrics framework:
        HarborMaster has no metrics dependency, and adding one to publish nine
        integers would be a poor trade.
      required:
        - eventsReceived
        - eventsPersisted
        - eventsDeduplicated
        - eventsDropped
        - targetedRefreshes
        - fullReconciliations
        - reconnectCount
        - refreshFailures
        - eventsPruned
      properties:
        eventsReceived:
          type: integer
          format: int64
          description: Events read off the Docker stream.
        eventsPersisted:
          type: integer
          format: int64
        eventsDeduplicated:
          type: integer
          format: int64
          description: |
            Suppressed by the in-memory window or rejected by the event table's
            unique fingerprint constraint.
        eventsDropped:
          type: integer
          format: int64
          description: |
            Discarded because the processing queue was full. Every drop also
            requests a full reconciliation, because a dropped event may have
            been the only notice of a change.
        targetedRefreshes: { type: integer, format: int64 }
        fullReconciliations: { type: integer, format: int64 }
        reconnectCount:
          type: integer
          format: int64
          description: Cumulative across restarts, so flapping survives one.
        refreshFailures: { type: integer, format: int64 }
        eventsPruned:
          type: integer
          format: int64
          description: Event rows removed by retention.

    EventRetentionPolicy:
      type: object
      description: |
        How long event history is kept. Zero on either bound disables that
        dimension; both zero keeps everything, which is valid but unbounded.

        Pruning is internal only: this phase deliberately exposes no destructive
        endpoint, because an unauthenticated one that deletes history would be
        exactly the wrong thing to add first.
      required: [maxAgeSeconds, maxCount, intervalSeconds]
      properties:
        maxAgeSeconds: { type: integer, format: int64, minimum: 0 }
        maxCount: { type: integer, format: int64, minimum: 0 }
        intervalSeconds: { type: integer, format: int64, minimum: 0 }

    EventEngineStatus:
      type: object
      required:
        - enabled
        - state
        - currentBackoffMs
        - queueDepth
        - queueCapacity
        - pendingRefreshes
        - overflowPending
        - subscribers
        - subscriberLimit
        - counters
        - retention
        - storedEvents
      properties:
        enabled:
          type: boolean
          description: |
            Reflects configuration. When false nothing connects, and the
            application is NOT degraded: periodic reconciliation carries the
            inventory alone, which is a supported mode.
        state:
          $ref: "#/components/schemas/EventConnectionState"
        connectedSince: { type: string, format: date-time }
        lastConnectedAt: { type: string, format: date-time }
        lastDisconnectedAt: { type: string, format: date-time }
        lastEventAt: { type: string, format: date-time }
        lastReconciliationAt: { type: string, format: date-time }
        currentBackoffMs:
          type: integer
          format: int64
          description: |
            The delay before the next connection attempt, after jitter. Zero
            while connected.
        queueDepth:
          type: integer
          description: |
            Events waiting to be processed. A depth approaching capacity means
            events are arriving faster than they can be persisted.
        queueCapacity: { type: integer }
        pendingRefreshes:
          type: integer
          description: Distinct resources waiting for a debounced refresh.
        overflowPending:
          type: boolean
          description: |
            True while a queue overflow has forced a full reconciliation that
            has not completed. The application reports degraded until it does.
        subscribers: { type: integer }
        subscriberLimit:
          type: integer
          description: |
            Concurrent SSE clients allowed. Zero means unlimited. At the limit,
            `GET /api/v1/events/stream` returns 503.
        counters:
          $ref: "#/components/schemas/EventEngineCounters"
        lastError:
          type: string
          description: |
            A sanitised summary of the most recent failure. It never carries a
            socket path, a daemon internal, or a credential.
          examples: [docker engine unreachable]
        retention:
          $ref: "#/components/schemas/EventRetentionPolicy"
        storedEvents: { type: integer, format: int64 }

    EventFilterOptions:
      type: object
      required: [types, actions, results, projects, sortFields]
      properties:
        types:
          type: array
          items: { type: string }
        actions:
          type: array
          description: |
            The actions actually present in recorded history, not a constant:
            Docker's action set varies by daemon version.
          items: { type: string }
        results:
          type: array
          items: { type: string }
        projects:
          type: array
          items: { type: string }
        sortFields:
          type: array
          items: { type: string }

    StreamReady:
      type: object
      description: |
        The payload of the SSE `ready` frame, sent once when a stream opens.
        Not returned by any JSON endpoint; documented here because OpenAPI
        cannot describe SSE frame structure directly.
      required: [lastEventId, replayed, redacted, notice]
      properties:
        lastEventId:
          type: integer
          format: int64
          description: |
            The newest sequence the client now holds, so a client that sent no
            resume point knows where the live stream begins.
        replayed:
          type: integer
          description: How many stored events were replayed before going live.
        redacted:
          type: boolean
          const: true
        notice: { type: string }

    StreamTruncated:
      type: object
      description: |
        The payload of the SSE `replay-truncated` frame, sent when a
        Last-Event-ID replay hit the cap.
      required: [skipped, limit, notice]
      properties:
        skipped:
          type: integer
          description: |
            How many stored events the replay could not include. Reload
            `GET /api/v1/events` to see them; the stream will not catch up.
        limit: { type: integer }
        notice: { type: string }

    # ---------------------------------------------------------- inventory --

    RefreshState:
      type: string
      enum: [idle, running, succeeded, failed]

    RefreshTrigger:
      type: string
      enum: [startup, periodic, manual]

    WarningCode:
      type: string
      description: |
        * `container_vanished` — the container was removed between being listed
          and being inspected. Expected churn on a busy host, not a fault.
        * `inspect_failed` — inspection failed for another reason; the
          container is recorded from summary data alone.
        * `image_unavailable` — the image could not be inspected, usually
          because it was removed while still in use.
        * `incomplete_data` — the runtime returned a record missing fields
          HarborMaster expected.
      enum: [container_vanished, inspect_failed, image_unavailable, incomplete_data]

    InventoryWarning:
      type: object
      required: [generation, code, message, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        generation: { type: integer, format: int64 }
        containerId: { type: string }
        containerName: { type: string }
        code:
          $ref: "#/components/schemas/WarningCode"
        message:
          type: string
          description: |
            Operator-facing prose. Never a raw runtime error, a socket path, or
            an environment value.
        occurredAt: { type: string, format: date-time }

    RefreshRecord:
      type: object
      required: [generation, trigger, state, startedAt, durationMs]
      properties:
        id: { type: integer, format: int64 }
        generation: { type: integer, format: int64 }
        trigger:
          $ref: "#/components/schemas/RefreshTrigger"
        state:
          $ref: "#/components/schemas/RefreshState"
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64, minimum: 0 }
        containersListed: { type: integer, minimum: 0 }
        containersInspected: { type: integer, minimum: 0 }
        containersFailed: { type: integer, minimum: 0 }
        imagesInspected: { type: integer, minimum: 0 }
        networksListed: { type: integer, minimum: 0 }
        volumesListed: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        checksum:
          type: string
          description: Empty for a failed refresh, which produces no inventory.
        error:
          type: string
          description: Sanitised failure reason. Never a raw runtime error.

    InventoryCounts:
      type: object
      required: [containers, absent, running, stopped, paused, restarting, healthy, unhealthy, images, networks, volumes, warnings, byState]
      properties:
        containers: { type: integer, minimum: 0 }
        absent:
          type: integer
          minimum: 0
          description: Containers retained from an earlier refresh but no longer present.
        running: { type: integer, minimum: 0 }
        stopped:
          type: integer
          minimum: 0
          description: Exited plus dead, which is what an operator means by "stopped".
        paused: { type: integer, minimum: 0 }
        restarting: { type: integer, minimum: 0 }
        healthy: { type: integer, minimum: 0 }
        unhealthy: { type: integer, minimum: 0 }
        images: { type: integer, minimum: 0 }
        networks: { type: integer, minimum: 0 }
        volumes: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        byState:
          type: object
          description: Exact per-state breakdown.
          additionalProperties: { type: integer, minimum: 0 }

    InventoryStatus:
      type: object
      required: [enabled, runtime, docker, state, inProgress, generation, counts, warnings]
      properties:
        enabled: { type: boolean }
        runtime: { type: string, examples: [docker] }
        docker:
          $ref: "#/components/schemas/Component"
        state:
          $ref: "#/components/schemas/RefreshState"
        inProgress: { type: boolean }
        generation:
          type: integer
          format: int64
          description: |
            Advances only when a refresh completes and is persisted. `0` means
            no inventory has ever been stored.
        checksum:
          type: string
          description: |
            Deterministic fingerprint of the inventory's content. Excludes
            timestamps, duration, and generation, so an unchanged host yields
            an unchanged checksum.
        lastAttempt:
          $ref: "#/components/schemas/RefreshRecord"
        lastSuccess:
          $ref: "#/components/schemas/RefreshRecord"
        counts:
          $ref: "#/components/schemas/InventoryCounts"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/InventoryWarning"

    RefreshAccepted:
      type: object
      required: [accepted, trigger, startedAt, message]
      properties:
        accepted: { type: boolean, const: true }
        trigger:
          $ref: "#/components/schemas/RefreshTrigger"
        startedAt: { type: string, format: date-time }
        message: { type: string }

    RefreshConflict:
      type: object
      description: |
        A 409 body. Extends the standard error envelope with the active
        refresh, so a client can report what is happening rather than only that
        its request failed.
      required: [error, active]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message: { type: string }
        requestId: { type: string }
        active:
          type: object
          required: [inProgress, startedAt]
          properties:
            inProgress: { type: boolean }
            startedAt: { type: string, format: date-time }

    FilterOptions:
      type: object
      required: [states, health, projects, images, sortFields]
      properties:
        states:
          type: array
          items: { $ref: "#/components/schemas/ContainerState" }
        health:
          type: array
          items: { $ref: "#/components/schemas/HealthState" }
        projects:
          type: array
          description: Compose projects actually present in the inventory.
          items: { type: string }
        images:
          type: array
          description: Image repositories actually present in the inventory.
          items: { type: string }
        sortFields:
          type: array
          items: { type: string }

    # --------------------------------------------------------- containers --

    ContainerState:
      type: string
      description: |
        Normalized lifecycle state. The vocabulary is closed; an unrecognised
        runtime state maps to `unknown` rather than passing through.
      enum: [created, running, paused, restarting, removing, exited, dead, unknown]

    HealthState:
      type: string
      description: A container with no healthcheck reports `none`.
      enum: [none, starting, healthy, unhealthy]

    ImageRef:
      type: object
      description: |
        A parsed image reference. `raw` is always the reference exactly as the
        container declared it; parsing is best-effort and never fails.
      required: [raw]
      properties:
        raw: { type: string, examples: ["nginx:1.27"] }
        repository: { type: string, examples: [nginx] }
        tag: { type: string, examples: ["1.27"] }
        digest: { type: string, examples: ["sha256:abc..."] }

    RestartPolicy:
      type: object
      required: [name]
      properties:
        name:
          type: string
          enum: ["no", always, on-failure, unless-stopped]
        maximumRetryCount:
          type: integer
          description: Applies to the on-failure policy only.

    Port:
      type: object
      required: [containerPort, protocol, published]
      properties:
        containerPort: { type: integer, minimum: 0, maximum: 65535 }
        protocol: { type: string, examples: [tcp, udp] }
        hostIp: { type: string }
        hostPort: { type: integer, minimum: 0, maximum: 65535 }
        published:
          type: boolean
          description: |
            Distinguishes a port merely exposed by the image from one actually
            bound on the host. Only published ports are reachable.

    ComposeMetadata:
      type: object
      required: [managed, oneOff]
      properties:
        managed:
          type: boolean
          description: True when the container carries a Compose project label.
        project: { type: string }
        service: { type: string }
        containerNumber: { type: integer }
        workingDir: { type: string }
        configFiles: { type: string }
        version: { type: string }
        oneOff:
          type: boolean
          description: Started by `compose run` rather than `compose up`.

    HarborMasterMetadata:
      type: object
      properties:
        enabled:
          type: boolean
          description: |
            Absent when the container carries no `io.harbormaster.enabled`
            label. Absent, true, and false are three distinct answers.
        labels:
          type: object
          description: Every `io.harbormaster.*` label, prefix stripped.
          additionalProperties: { type: string }

    ContainerSummary:
      type: object
      description: The list-row projection of a container.
      required: [hostId, id, shortId, name, image, state, health, createdAt, restartCount, restartPolicy, compose, harbormaster, ports, present, firstSeenAt, lastSeenAt, generation, warningCount]
      properties:
        hostId: { type: string }
        id: { type: string }
        shortId: { type: string }
        name: { type: string }
        image:
          $ref: "#/components/schemas/ImageRef"
        imageId: { type: string }
        state:
          $ref: "#/components/schemas/ContainerState"
        status:
          type: string
          description: Runtime status text such as "Up 3 minutes". Volatile.
        health:
          $ref: "#/components/schemas/HealthState"
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        exitCode:
          type: integer
          description: Present only once the container has exited.
        restartCount: { type: integer, minimum: 0 }
        restartPolicy:
          $ref: "#/components/schemas/RestartPolicy"
        compose:
          $ref: "#/components/schemas/ComposeMetadata"
        harbormaster:
          $ref: "#/components/schemas/HarborMasterMetadata"
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        present:
          type: boolean
          description: |
            False for a container earlier refreshes saw but the most recent one
            did not. Such rows are retained rather than deleted.
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        generation: { type: integer, format: int64 }
        warningCount: { type: integer, minimum: 0 }

    ContainerList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContainerSummary" }
        pagination:
          $ref: "#/components/schemas/Pagination"

    StateDetail:
      type: object
      required: [state, running, paused, restarting, dead, oomKilled, restartCount, health]
      properties:
        state: { $ref: "#/components/schemas/ContainerState" }
        rawState:
          type: string
          description: What the runtime reported, kept so an unmapped value stays visible.
        status: { type: string }
        running: { type: boolean }
        paused: { type: boolean }
        restarting: { type: boolean }
        dead: { type: boolean }
        oomKilled: { type: boolean }
        exitCode: { type: integer }
        error: { type: string }
        restartCount: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        health: { $ref: "#/components/schemas/HealthState" }
        healthFailingStreak: { type: integer, minimum: 0 }
        healthLog:
          type: array
          description: |
            Healthcheck timings and exit codes. The probe's stdout/stderr is
            deliberately NOT carried: a healthcheck command is arbitrary and
            its output routinely contains credentials.
          items:
            type: object
            required: [start, end, exitCode]
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              exitCode: { type: integer }

    Process:
      type: object
      required: [tty, stdinOpen]
      properties:
        hostname: { type: string }
        domainname: { type: string }
        entrypoint: { type: array, items: { type: string } }
        command: { type: array, items: { type: string } }
        user:
          type: string
          description: Empty means the image's default, which is frequently root.
        workingDir: { type: string }
        stopSignal: { type: string }
        stopTimeoutSeconds:
          type: integer
          description: Absent when the container inherits the daemon default.
        tty: { type: boolean }
        stdinOpen: { type: boolean }

    EnvVar:
      type: object
      description: |
        One environment variable or log-driver option. The real value of a
        sensitive entry is never present in any API response.
      required: [name, value, sensitivity]
      properties:
        name: { type: string }
        value:
          type: string
          description: |
            The display-safe value: the real value when not sensitive,
            `********` when it is.
        sensitivity:
          type: string
          enum: [normal, sensitive]

    Label:
      type: object
      required: [key, value, source]
      properties:
        key: { type: string }
        value: { type: string }
        source:
          type: string
          description: Which convention the key belongs to.
          enum: [user, compose, harbormaster]

    Mount:
      type: object
      required: [type, destination, readOnly]
      properties:
        type:
          type: string
          enum: [bind, volume, tmpfs, npipe, cluster, unknown]
        source: { type: string }
        destination: { type: string }
        readOnly: { type: boolean }
        propagation: { type: string }
        consistency: { type: string }
        volumeName: { type: string }
        driver: { type: string }
        driverOptions:
          type: object
          additionalProperties: { type: string }
        tmpfsOptions: { type: string }

    NetworkAttachment:
      type: object
      required: [networkName]
      properties:
        networkId: { type: string }
        networkName: { type: string }
        driver: { type: string }
        aliases: { type: array, items: { type: string } }
        ipv4Address: { type: string }
        ipv6Address: { type: string }
        gateway: { type: string }
        macAddress: { type: string }
        endpointId: { type: string }
        links: { type: array, items: { type: string } }

    HealthCheck:
      type: object
      description: Configured healthcheck, as distinct from its current verdict.
      required: [disabled]
      properties:
        test: { type: array, items: { type: string } }
        intervalMs: { type: integer, format: int64 }
        timeoutMs: { type: integer, format: int64 }
        startPeriodMs: { type: integer, format: int64 }
        startIntervalMs: { type: integer, format: int64 }
        retries: { type: integer }
        disabled:
          type: boolean
          description: |
            True when the container explicitly turns the image's healthcheck
            off, which is different from having none configured.

    Ulimit:
      type: object
      required: [name, soft, hard]
      properties:
        name: { type: string }
        soft: { type: integer, format: int64 }
        hard: { type: integer, format: int64 }

    Resources:
      type: object
      description: |
        Absent optional fields mean "not set", which is different from being
        set to zero. A `pidsLimit` of 0 means unlimited; an absent one means
        the daemon default applies.
      properties:
        cpuShares: { type: integer, format: int64 }
        cpuQuota: { type: integer, format: int64 }
        cpuPeriod: { type: integer, format: int64 }
        nanoCpus: { type: integer, format: int64 }
        cpusetCpus: { type: string }
        cpusetMems: { type: string }
        memoryBytes: { type: integer, format: int64 }
        memoryReservationBytes: { type: integer, format: int64 }
        memorySwapBytes: { type: integer, format: int64 }
        memorySwappiness: { type: integer, format: int64 }
        kernelMemoryBytes:
          type: integer
          format: int64
          description: Deprecated in the Engine API; reported only if a daemon still sets it.
        pidsLimit: { type: integer, format: int64 }
        blkioWeight: { type: integer }
        shmSizeBytes: { type: integer, format: int64 }
        oomScoreAdj: { type: integer }
        oomKillDisable: { type: boolean }
        ulimits:
          type: array
          items: { $ref: "#/components/schemas/Ulimit" }

    Device:
      type: object
      required: [pathOnHost, pathInContainer]
      properties:
        pathOnHost: { type: string }
        pathInContainer: { type: string }
        cgroupPermissions: { type: string }

    DeviceRequest:
      type: object
      properties:
        driver: { type: string }
        count: { type: integer }
        deviceIds: { type: array, items: { type: string } }
        capabilities:
          type: array
          items: { type: array, items: { type: string } }
        options:
          type: object
          additionalProperties: { type: string }

    Security:
      type: object
      required: [privileged, readonlyRootfs, noNewPrivileges]
      properties:
        privileged: { type: boolean }
        readonlyRootfs: { type: boolean }
        capAdd: { type: array, items: { type: string } }
        capDrop: { type: array, items: { type: string } }
        securityOpt: { type: array, items: { type: string } }
        apparmorProfile: { type: string }
        selinuxLabel: { type: string }
        seccompProfile: { type: string }
        noNewPrivileges: { type: boolean }
        devices:
          type: array
          items: { $ref: "#/components/schemas/Device" }
        deviceCgroupRules: { type: array, items: { type: string } }
        deviceRequests:
          type: array
          items: { $ref: "#/components/schemas/DeviceRequest" }
        ipcMode: { type: string }
        pidMode: { type: string }
        utsMode: { type: string }
        usernsMode: { type: string }
        cgroupnsMode: { type: string }
        sysctls:
          type: object
          additionalProperties: { type: string }
        groupAdd:
          type: array
          description: |
            Supplementary groups. Notable because adding the docker group is
            how a container gains control of the host.
          items: { type: string }

    Logging:
      type: object
      properties:
        driver: { type: string }
        options:
          type: array
          description: |
            Masked with the same rules as the environment: log driver
            configuration routinely carries endpoint credentials.
          items: { $ref: "#/components/schemas/EnvVar" }

    ContainerDetail:
      type: object
      description: |
        The full normalized view of one container. Sections mirror the UI's
        tabs one-for-one.

        Identity is split across two sections by intent: stable identifiers and
        timestamps live in `overview`, where the list view also needs them,
        while `hostname` and `domainname` live in `process` because they are
        container configuration.
      required: [overview, state, process, environment, labels, ports, mounts, networks, resources, security, logging, compose, harbormaster, warnings]
      properties:
        overview:
          $ref: "#/components/schemas/ContainerSummary"
        state:
          $ref: "#/components/schemas/StateDetail"
        image:
          $ref: "#/components/schemas/Image"
        process:
          $ref: "#/components/schemas/Process"
        healthCheck:
          $ref: "#/components/schemas/HealthCheck"
        environment:
          type: array
          items: { $ref: "#/components/schemas/EnvVar" }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        mounts:
          type: array
          items: { $ref: "#/components/schemas/Mount" }
        networks:
          type: array
          items: { $ref: "#/components/schemas/NetworkAttachment" }
        resources:
          $ref: "#/components/schemas/Resources"
        security:
          $ref: "#/components/schemas/Security"
        logging:
          $ref: "#/components/schemas/Logging"
        compose:
          $ref: "#/components/schemas/ComposeMetadata"
        harbormaster:
          $ref: "#/components/schemas/HarborMasterMetadata"
        warnings:
          type: array
          items: { $ref: "#/components/schemas/InventoryWarning" }

    RawInspection:
      type: object
      required: [containerId, redacted, notice, inspection]
      properties:
        containerId: { type: string }
        redacted:
          type: boolean
          const: true
        notice:
          type: string
          description: |
            States that sensitive values have been removed and that the payload
            cannot be used to recreate the container exactly.
        inspection:
          description: The runtime's inspection output, with sensitive values removed.
          type: object
          additionalProperties: true

    # -------------------------------------------- images, networks, volumes --

    Image:
      type: object
      required: [id, shortId, repoTags, repoDigests, size]
      properties:
        id: { type: string }
        shortId: { type: string }
        repoTags:
          type: array
          description: Empty for an untagged ("dangling") image.
          items: { type: string }
        repoDigests:
          type: array
          description: Usually present only for images pulled from or pushed to a registry.
          items: { type: string }
        createdAt: { type: string, format: date-time }
        architecture: { type: string }
        os: { type: string }
        osVersion: { type: string }
        variant: { type: string }
        size: { type: integer, format: int64 }
        author: { type: string }
        comment: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }

    ImageUsage:
      type: object
      required: [image, containerCount]
      properties:
        image:
          $ref: "#/components/schemas/Image"
        containerCount:
          type: integer
          minimum: 0
          description: Present containers referencing this image.

    ImageList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ImageUsage" }
        pagination:
          $ref: "#/components/schemas/Pagination"

    Network:
      type: object
      required: [id, name, internal, attachable, ipv6]
      properties:
        id: { type: string }
        name: { type: string }
        driver: { type: string }
        scope: { type: string }
        internal: { type: boolean }
        attachable: { type: boolean }
        ipv6: { type: boolean }
        createdAt: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        subnets:
          type: array
          items: { type: string }

    NetworkList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Network" }
        pagination:
          $ref: "#/components/schemas/Pagination"

    Volume:
      type: object
      description: Metadata only. HarborMaster never reads volume contents.
      required: [name]
      properties:
        name: { type: string }
        driver: { type: string }
        scope: { type: string }
        mountpoint: { type: string }
        createdAt: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        options:
          type: object
          additionalProperties: { type: string }

    VolumeList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Volume" }
        pagination:
          $ref: "#/components/schemas/Pagination"

    # -------------------------------------------------------- snapshots --

    SnapshotTrigger:
      type: string
      description: |
        What caused a capture. A closed vocabulary, enforced by a database
        constraint.

        Notably absent: anything implying HarborMaster acted on a container.
        `scheduled` and `pre_update` are reserved for later phases and are never
        produced today.
      enum: [manual, api, scheduled, pre_update]

    ReadinessStatus:
      type: string
      description: |
        A restore-readiness verdict.

        `unknown` means no evaluation has run; it is the stored default and a
        valid filter value, and is never produced by an evaluation.

        `unverifiable` appears on individual checks only. It means HarborMaster
        could not establish the answer, and it caps the overall verdict at
        `warning` -- a report never claims `ready` on a fact it did not check.
      enum: [unknown, ready, warning, not_ready, unverifiable]

    ReadinessCheckId:
      type: string
      description: Identifier of one restore-readiness check.
      enum:
        - daemon_reachable
        - inventory_fresh
        - image_available
        - image_digest_known
        - named_volumes_present
        - mount_sources
        - networks_present
        - restart_policy_valid
        - compose_metadata_complete
        - secrets_available
        - config_consistent
        - runtime_features

    Sensitivity:
      type: string
      description: |
        How a value is treated. `sensitive` means the value is never stored,
        never logged, and never returned by this API.
      enum: [normal, sensitive]

    Snapshot:
      type: object
      description: |
        An immutable configuration checkpoint.

        Everything except `readinessStatus` and `readinessEvaluatedAt` is fixed
        at capture time. `spec` is the canonical document and `checksum` covers
        it together with the secret digests, so a snapshot can be verified
        without trusting the row it came from.

        `spec` is omitted from list responses.
      required:
        [id, containerId, containerName, specVersion, checksum, trigger,
         readinessStatus, createdAt]
      properties:
        id: { type: integer, format: int64 }
        hostId: { type: string }
        containerId: { type: string }
        containerName: { type: string }
        imageReference: { type: string }
        imageDigest: { type: string }
        imageId: { type: string }
        specVersion:
          type: integer
          description: |
            Shape of the canonical document. Old documents are never rewritten:
            re-encoding evidence would change its checksum.
        spec:
          $ref: "#/components/schemas/SnapshotSpec"
        checksum:
          type: string
          description: |
            Hex SHA-256 over the canonical document plus the secret digests.
            Identical logical configuration produces an identical checksum.
          pattern: "^[0-9a-f]{64}$"
        harbormasterVersion: { type: string }
        dockerApiVersion: { type: string }
        dockerEngineVersion: { type: string }
        trigger:
          $ref: "#/components/schemas/SnapshotTrigger"
        reason:
          type: string
          description: Operator-supplied prose. Length-bounded and UTF-8 validated.
          maxLength: 4096
        inventoryGeneration:
          type: integer
          format: int64
          description: The inventory generation the capture observed.
        eventSequence: { type: integer, format: int64 }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/InventoryWarning" }
        warningCount: { type: integer }
        readinessStatus:
          $ref: "#/components/schemas/ReadinessStatus"
        readinessEvaluatedAt: { type: string, format: date-time }
        digestKeyId:
          type: string
          description: |
            Identifies the HMAC key this snapshot's secret digests were produced
            under. Derived from the key by hashing, so it cannot produce it.
            Digests under different key IDs are not comparable, and a diff that
            spans two reports `unverifiable` rather than guessing.
        createdAt: { type: string, format: date-time }
        deduplicated:
          type: boolean
          description: |
            Present on a capture response only. True means the configuration was
            unchanged and this is the pre-existing snapshot: nothing was created.

    SnapshotEnvEntry:
      type: object
      description: |
        One captured environment variable or log-driver option.

        **A sensitive entry carries no `value` and no digest.** The API cannot
        return either: the digest fields are unserialisable by construction.
        `present` and `length` are all that is exposed, which is what an
        operator needs to reason about a restore without revealing the value.
      required: [position, key, classification, present]
      properties:
        position:
          type: integer
          description: |
            Captured order, preserved because environment order is semantically
            meaningful to some programs.
        key: { type: string }
        classification:
          $ref: "#/components/schemas/Sensitivity"
        present:
          type: boolean
          description: |
            False means the variable was not set at all, which is distinct from
            being set to the empty string.
        value:
          type: string
          description: Empty and omitted for a sensitive entry.
        length:
          type: integer
          description: Byte length of the original value.

    SnapshotMount:
      type: object
      required: [destination, type]
      properties:
        destination: { type: string }
        type: { type: string, enum: [bind, volume, tmpfs, npipe, cluster, unknown] }
        source: { type: string }
        readOnly: { type: boolean }
        volumeName: { type: string }
        driver: { type: string }

    SnapshotNetwork:
      type: object
      required: [networkName]
      properties:
        networkName: { type: string }
        aliases:
          type: array
          items: { type: string }

    SnapshotSpec:
      type: object
      description: |
        The canonical configuration document: the single source of truth for a
        snapshot, from which every relational section is derived.

        Volatile fields are ABSENT rather than filtered -- timestamps, status
        prose, restart counts, runtime IP addresses, gateways, MAC addresses,
        endpoint IDs, and health results have no field to occupy. That is what
        makes the checksum stable across restarts.

        It contains no plaintext secret in any encoding.
      required: [specVersion, identity, image]
      properties:
        specVersion: { type: integer }
        identity:
          type: object
          properties:
            containerId: { type: string }
            containerName: { type: string }
        image:
          type: object
          properties:
            reference: { type: string }
            repository: { type: string }
            tag: { type: string }
            digest: { type: string }
            imageId: { type: string }
            repoDigests:
              type: array
              items: { type: string }
            architecture: { type: string }
            os: { type: string }
        process:
          $ref: "#/components/schemas/Process"
        environment:
          type: array
          items: { $ref: "#/components/schemas/SnapshotEnvEntry" }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        networks:
          type: array
          items: { $ref: "#/components/schemas/SnapshotNetwork" }
        mounts:
          type: array
          items: { $ref: "#/components/schemas/SnapshotMount" }
        restartPolicy:
          $ref: "#/components/schemas/RestartPolicy"
        healthCheck:
          $ref: "#/components/schemas/HealthCheck"
        resources:
          $ref: "#/components/schemas/Resources"
        security:
          $ref: "#/components/schemas/Security"
        logging:
          type: object
          properties:
            driver: { type: string }
            options:
              type: array
              items: { $ref: "#/components/schemas/SnapshotEnvEntry" }
        compose:
          $ref: "#/components/schemas/ComposeMetadata"
        harbormaster:
          $ref: "#/components/schemas/HarborMasterMetadata"

    SnapshotDetail:
      allOf:
        - $ref: "#/components/schemas/Snapshot"
        - type: object
          properties:
            environment:
              type: array
              items: { $ref: "#/components/schemas/SnapshotEnvEntry" }
            mounts:
              type: array
              items: { $ref: "#/components/schemas/SnapshotMount" }
            networks:
              type: array
              items: { $ref: "#/components/schemas/SnapshotNetwork" }

    SnapshotList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Snapshot" }
        pagination:
          $ref: "#/components/schemas/Pagination"

    CreateSnapshotRequest:
      type: object
      description: |
        Decoded strictly: unknown fields are rejected rather than ignored, and
        the body must be exactly one JSON object.
      required: [containerId]
      properties:
        containerId:
          type: string
          description: Full ID, unambiguous ID prefix, or exact container name.
          minLength: 1
          maxLength: 255
        reason:
          type: string
          description: |
            Why the snapshot was taken. Must be valid UTF-8 with no control
            characters, and is bounded by configuration (500 bytes by default).
          maxLength: 4096

    SnapshotConflict:
      type: object
      description: A capture is already running for this container.
      required: [error, active]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message: { type: string }
        requestId: { type: string }
        active:
          type: object
          properties:
            inProgress: { type: boolean }
            startedAt: { type: string, format: date-time }

    ReadinessCheck:
      type: object
      required: [id, status]
      properties:
        id:
          $ref: "#/components/schemas/ReadinessCheckId"
        status:
          $ref: "#/components/schemas/ReadinessStatus"
        detail:
          type: string
          description: |
            Operator-facing prose. Never contains a secret value, a raw daemon
            error, or a path the snapshot does not already record.

    ReadinessReport:
      type: object
      description: |
        A complete restore-readiness evaluation. Informational: HarborMaster
        cannot restore a container.
      required: [snapshotId, status, checks, evaluatedAt]
      properties:
        snapshotId: { type: integer, format: int64 }
        status:
          $ref: "#/components/schemas/ReadinessStatus"
        checks:
          type: array
          items: { $ref: "#/components/schemas/ReadinessCheck" }
        evaluatedAt: { type: string, format: date-time }
        daemonCheckedAt:
          type: string
          format: date-time
          description: When the reachability ping in this evaluation ran.
        inventoryGeneration:
          type: integer
          format: int64
          description: The inventory generation the evaluation read.
        inventoryCompletedAt:
          type: string
          format: date-time
          description: |
            When that inventory refresh finished. Measured from the last
            SUCCESSFUL refresh: a failed attempt does not make data fresher.
        inventoryAgeSeconds: { type: integer, format: int64 }
        inventoryStale:
          type: boolean
          description: |
            The inventory exceeded the configured freshness threshold, which
            caps the overall verdict at `warning`.
        readyCount: { type: integer }
        warningCount: { type: integer }
        notReadyCount: { type: integer }
        unverifiableCount: { type: integer }

    DiffGroupName:
      type: string
      description: |
        A configuration section. A closed, code-defined vocabulary -- output is
        narrowed by naming groups, never by a user-supplied expression or path.
      enum:
        [environment, labels, ports, networks, mounts, resources, security,
         compose, metadata]

    ChangeKind:
      type: string
      description: |
        How one entry differs.

        `unverifiable` means the two values cannot be compared at all --
        specifically, two secret digests produced under different HMAC keys.
        Reporting `modified` there would tell an operator every secret changed
        after a key rotation.
      enum: [added, removed, modified, unchanged, unverifiable]

    DiffEntry:
      type: object
      required: [key, kind]
      properties:
        key: { type: string }
        kind:
          $ref: "#/components/schemas/ChangeKind"
        old:
          type: string
          description: Always empty for a sensitive entry.
        new:
          type: string
          description: Always empty for a sensitive entry.
        sensitive:
          type: boolean
          description: |
            The entry's values are withheld. The change is reported through
            `kind` alone, derived from digest comparison.
        note: { type: string }

    DiffGroup:
      type: object
      required: [name, entries]
      properties:
        name:
          $ref: "#/components/schemas/DiffGroupName"
        entries:
          type: array
          items: { $ref: "#/components/schemas/DiffEntry" }
        added: { type: integer }
        removed: { type: integer }
        modified: { type: integer }
        unchanged: { type: integer }
        truncated:
          type: boolean
          description: |
            This group stopped short of comparing or returning everything.
            Never silent: a truncated group that looked complete would read as
            two identical configurations.
        returned: { type: integer }
        total: { type: integer }

    SnapshotDiff:
      type: object
      required: [fromSnapshotId, groups, identical]
      properties:
        fromSnapshotId: { type: integer, format: int64 }
        toSnapshotId:
          type: integer
          format: int64
          description: Zero when the comparison target was live configuration.
        againstCurrent: { type: boolean }
        groups:
          type: array
          items: { $ref: "#/components/schemas/DiffGroup" }
        identical:
          type: boolean
          description: |
            Nothing differs. Never true on a truncated diff: a truncated
            comparison has not established that the two are identical.
        addedCount: { type: integer }
        removedCount: { type: integer }
        modifiedCount: { type: integer }
        changedCount: { type: integer }
        unchangedCount: { type: integer }
        truncated: { type: boolean }
        truncationReason: { type: string }

    DriftCategory:
      type: string
      description: |
        The part of the configuration that moved. Finer-grained than the diff
        engine's groups, because "metadata" there covers image identity, the
        process, the restart policy, the health check, and logging — five
        things an operator filters on separately.
      enum:
        [
          security,
          image,
          mounts,
          ports,
          networks,
          process,
          health,
          environment,
          resources,
          restart,
          logging,
          labels,
          compose,
          metadata,
        ]

    DriftSeverity:
      type: string
      description: |
        How much worse the host is now — not how large the change was.

        DIRECTION decides the rank. `privileged` moving false→true is
        `critical`; true→false is the operator fixing something and is `low`. A
        capability added is `critical`; one dropped is not. Ranking the field
        rather than the movement would fill a dashboard with critical alerts
        for improvements.

        - `critical` — a lost containment boundary, or an image digest change.
        - `high` — a wider attack surface or a removed safety net.
        - `medium` — changed behaviour that could matter.
        - `low` — bookkeeping.
      enum: [critical, high, medium, low]

    DriftStatus:
      type: string
      description: |
        `active` and `resolved` are ENGINE-owned facts about whether the
        difference still exists. `acknowledged`, `ignored`, and `expected` are
        OPERATOR-owned statements of intent, and are the only three a PATCH may
        set.
      enum: [active, resolved, acknowledged, ignored, expected]

    DriftRecord:
      type: object
      description: |
        One field that differs between a container's baseline snapshot and its
        current configuration.

        `previousValue` and `currentValue` are ALWAYS absent when `sensitive`
        is true. What changed is reported through `kind`, derived from a keyed
        digest comparison; the values themselves are never stored and never
        served.
      required:
        [
          id,
          containerId,
          containerName,
          snapshotId,
          detectedAt,
          lastSeenAt,
          inventoryGeneration,
          category,
          field,
          kind,
          severity,
          status,
        ]
      properties:
        id: { type: integer, format: int64 }
        containerId: { type: string }
        containerName: { type: string }
        snapshotId:
          type: integer
          format: int64
          description: The baseline this was measured against.
        detectedAt:
          type: string
          format: date-time
          description: |
            When the difference was FIRST seen. It does not move when a later
            evaluation sees it again, so the age of a record is the age of the
            drift.
        lastSeenAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        inventoryGeneration:
          type: integer
          format: int64
          description: The inventory generation the comparison read.
        category: { $ref: "#/components/schemas/DriftCategory" }
        field:
          type: string
          description: |
            The comparison key, such as `privileged` or `image.digest`.
            Engine-generated; never caller text.
        kind: { type: string, enum: [added, removed, modified, unverifiable] }
        severity: { $ref: "#/components/schemas/DriftSeverity" }
        previousValue:
          type: string
          description: Absent when `sensitive` is true.
        currentValue:
          type: string
          description: Absent when `sensitive` is true.
        sensitive:
          type: boolean
          description: |
            The field is secret-backed. Both values are withheld; only the fact
            of the change is reported.
        status: { $ref: "#/components/schemas/DriftStatus" }
        reason:
          type: string
          description: |
            Why it is ranked as it is, from a fixed set of engine phrases.
            Never an error string and never a value.
        note:
          type: string
          description: Operator annotation from a status change.
        statusChangedAt: { type: string, format: date-time }

    DriftEvaluation:
      type: object
      description: |
        One container's most recent comparison ATTEMPT.

        Recorded separately from the records because an evaluation that found
        nothing is still a fact: it is what distinguishes "matches its
        baseline" from "never checked".
      required: [containerId, evaluatedAt, driftCount, complete]
      properties:
        containerId: { type: string }
        containerName: { type: string }
        snapshotId:
          type: integer
          format: int64
          description: Zero when the container has no baseline snapshot.
        evaluatedAt: { type: string, format: date-time }
        inventoryGeneration: { type: integer, format: int64 }
        driftCount: { type: integer }
        complete:
          type: boolean
          description: |
            False when the comparison could not examine everything — a
            truncated diff, or no baseline. `driftCount` is then a floor rather
            than a total, and nothing is resolved on the strength of it.
        reason: { type: string }

    DriftSummary:
      type: object
      description: |
        Dashboard aggregate. Severity and category counts describe OPEN drift
        only: including resolved history would make "3 critical" mean "3
        critical at some point since installation".
      required:
        [
          total,
          open,
          bySeverity,
          byStatus,
          byCategory,
          containersWithDrift,
          containersEvaluated,
          incomplete,
        ]
      properties:
        total: { type: integer }
        open:
          type: integer
          description: Every record that is not resolved.
        bySeverity:
          type: object
          additionalProperties: { type: integer }
        byStatus:
          type: object
          additionalProperties: { type: integer }
        byCategory:
          type: object
          additionalProperties: { type: integer }
        containersWithDrift: { type: integer }
        containersEvaluated:
          type: integer
          description: |
            Containers a comparison has been ATTEMPTED for. Without this,
            "12 containers have drift" implies the rest were checked and clean.
        lastEvaluatedAt: { type: string, format: date-time }
        incomplete:
          type: boolean
          description: |
            At least one container's most recent evaluation could not examine
            everything, so these counts are a floor.

    PolicySeverity:
      type: string
      description: |
        How much a violation matters. Follows the RULE, not the container: a
        rule may override its policy's default, and an omitted override
        inherits.
      enum: [critical, high, medium, low]

    PolicyViolationStatus:
      type: string
      description: |
        `active` and `resolved` are ENGINE-owned facts about whether the rule
        still fails. `acknowledged` and `exempted` are OPERATOR-owned statements
        of intent, and are the only two a PATCH may set.

        Neither operator status suppresses re-evaluation: the rule is still
        applied on every pass and the violation still resolves by itself once
        the container complies.
      enum: [active, resolved, acknowledged, exempted]

    PolicyRuleType:
      type: string
      description: |
        The closed vocabulary of checks. Every rule's semantics are fixed at
        compile time; there is no expression language, template, or script
        anywhere in the policy engine.

        Two entries are narrower than their names suggest, and the catalogue
        endpoint says so:

        - `requiredCapabilities` / `forbiddenCapabilities` evaluate the DECLARED
          configuration (`capAdd`). HarborMaster cannot see the daemon's default
          capability set, so a capability granted by default is invisible to it.
        - `networkAllowlist` evaluates the container's ATTACHED NETWORKS, which
          is how Docker surfaces the network mode: host mode appears as `host`,
          isolation as `none`. A container attached to no network of its own
          shares another container's namespace and never satisfies an allowlist.
      enum:
        - privilegedForbidden
        - readOnlyRootFilesystemRequired
        - imageAllowlist
        - imageDenylist
        - requiredLabels
        - forbiddenLabels
        - requiredEnv
        - forbiddenEnv
        - requiredCapabilities
        - forbiddenCapabilities
        - memoryLimitRequired
        - cpuLimitRequired
        - restartPolicyAllowlist
        - networkAllowlist
        - userNotRoot
        - healthCheckRequired

    PolicyValueKind:
      type: string
      description: |
        What a rule's `values` mean. Pattern kinds accept `*` (any run,
        including none) and `?` (exactly one character) and nothing else — no
        character classes, no alternation, no regular expressions. The exact
        kinds are compared literally and reject wildcards, because a wildcard
        there would silently match nothing.
      enum:
        - none
        - imagePattern
        - labelKeyPattern
        - envNamePattern
        - capability
        - restartPolicy
        - networkName

    PolicyRule:
      type: object
      description: |
        One typed check. `values` is required for rule types whose
        `requiresValues` is true in the catalogue, and must be ABSENT for the
        rest — a rule carrying values it cannot use is rejected rather than
        silently ignored.
      required: [type]
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/PolicyRuleType" }
        severity:
          allOf:
            - $ref: "#/components/schemas/PolicySeverity"
          description: Overrides the policy default for this rule. Omitted inherits.
        values:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 128
            description: |
              A pattern or an exact name, depending on the rule's value kind.
              Patterns are bounded in length and in wildcard count, and a
              pattern that exceeds either is refused at write time rather than
              trimmed at match time.

    PolicyDefinition:
      type: object
      description: |
        One administrator-defined policy: a named set of rules with a default
        severity.

        Every enabled, unarchived policy is evaluated against every present
        container. There is no selector language — an organisational rule
        usually means "the estate", and a selector would be a second thing an
        unauthenticated caller could make expensive.
      required: [policyId, name, severity, enabled, archived, rules, createdAt, updatedAt]
      properties:
        policyId:
          type: string
          pattern: "^pol_[0-9a-f]{20}$"
          description: |
            IMMUTABLE and server-generated from the system entropy source. Never
            accepted from a caller and never changed by an update: a violation
            references it, so a mutable id would orphan history.
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        severity: { $ref: "#/components/schemas/PolicySeverity" }
        enabled:
          type: boolean
          description: |
            Whether the policy participates in evaluation. Disabling one
            resolves its open violations in the same transaction, because the
            rule no longer applies.
        archived:
          type: boolean
          description: |
            Set by DELETE, which withdraws rather than destroys. An archived
            policy is not evaluated and cannot be edited, and the violations it
            found are kept.
        archivedAt: { type: string, format: date-time }
        rules:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/PolicyRule" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PolicyRequest:
      type: object
      description: |
        The create and update body.

        Every field is optional in the schema because a PATCH is partial and an
        omitted field is left alone. A CREATE must nonetheless supply `name`,
        `severity` and `rules`; the server rejects one that does not.

        There is deliberately no `policyId`, and `additionalProperties: false`
        means a body carrying one is rejected rather than ignored.
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        severity: { $ref: "#/components/schemas/PolicySeverity" }
        enabled: { type: boolean, default: true }
        rules:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/PolicyRule" }

    PolicyRuleSpec:
      type: object
      required: [type, label, description, valueKind, requiresValues]
      properties:
        type: { $ref: "#/components/schemas/PolicyRuleType" }
        label: { type: string }
        description:
          type: string
          description: |
            Exactly what the rule checks, including where HarborMaster's view is
            narrower than the daemon's.
        valueKind: { $ref: "#/components/schemas/PolicyValueKind" }
        requiresValues: { type: boolean }

    PolicyRuleCatalogue:
      type: object
      description: |
        Every rule type, the closed vocabularies, and the definition bounds the
        server validates against.
      required: [rules, severities, restartPolicyNames, limits]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/PolicyRuleSpec" }
        severities:
          type: array
          items: { $ref: "#/components/schemas/PolicySeverity" }
        restartPolicyNames:
          type: array
          description: The closed vocabulary a restart-policy rule may name.
          items: { type: string }
        limits:
          type: object
          description: |
            The configured bounds. A client may pre-check against them, but the
            server is authoritative.
          properties:
            maxRules: { type: integer }
            maxValuesPerRule: { type: integer }
            maxNameBytes: { type: integer }
            maxDescriptionBytes: { type: integer }

    PolicyViolation:
      type: object
      description: |
        One rule that a container fails.

        One row per FAILED RULE, not per offending item, and identified by
        (container, policy, rule type) rather than by its values — which is what
        makes a container whose forbidden label keeps changing one long-lived
        record rather than a new one per pass.

        `observed` is engine-rendered text. For an environment rule it is the
        offending variable NAMES: policies evaluate names only, and the
        evaluation input has no field capable of holding a value.
      required:
        [
          id,
          policyId,
          policyName,
          containerId,
          containerName,
          ruleType,
          severity,
          detectedAt,
          lastSeenAt,
          inventoryGeneration,
          status,
        ]
      properties:
        id: { type: integer, format: int64 }
        policyId: { type: string }
        policyName:
          type: string
          description: |
            Denormalised, so a list needs no join and a violation stays readable
            after its policy is archived.
        containerId: { type: string }
        containerName: { type: string }
        ruleType: { $ref: "#/components/schemas/PolicyRuleType" }
        severity: { $ref: "#/components/schemas/PolicySeverity" }
        detectedAt:
          type: string
          format: date-time
          description: |
            When the violation was FIRST seen. It does not move when a later
            pass sees the same failure again, so the age of a violation is the
            age of the non-compliance.
        lastSeenAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        inventoryGeneration: { type: integer, format: int64 }
        observed:
          type: string
          maxLength: 1024
          description: What the container has. Never an environment variable value.
        expected:
          type: string
          maxLength: 1024
          description: What the rule required, rendered from its own parameters.
        reason:
          type: string
          maxLength: 1024
          description: |
            Engine prose from a fixed set of phrases. Never an error string,
            never caller input.
        status: { $ref: "#/components/schemas/PolicyViolationStatus" }
        note: { type: string, maxLength: 500 }
        statusChangedAt: { type: string, format: date-time }

    PolicyEvaluation:
      type: object
      description: |
        One container's most recent compliance pass.

        Stored separately from the violations because a pass that found NOTHING
        is a fact worth keeping: it is what distinguishes "compliant" from
        "never evaluated".
      required:
        [
          containerId,
          containerName,
          evaluatedAt,
          inventoryGeneration,
          policiesEvaluated,
          rulesEvaluated,
          violationCount,
          compliant,
          complete,
        ]
      properties:
        containerId: { type: string }
        containerName: { type: string }
        evaluatedAt: { type: string, format: date-time }
        inventoryGeneration: { type: integer, format: int64 }
        policiesEvaluated: { type: integer }
        rulesEvaluated: { type: integer }
        violationCount: { type: integer }
        compliant:
          type: boolean
          description: |
            True only when the pass was COMPLETE and found nothing. An
            incomplete pass is never reported as compliant: it did not establish
            compliance, it stopped looking.
        complete:
          type: boolean
          description: |
            False when the pass could not apply every policy. `violationCount`
            is then a floor rather than a total, and the pass resolves nothing.
        reason: { type: string }

    PolicySummary:
      type: object
      description: The compliance aggregate the dashboard renders.
      properties:
        policies:
          type: integer
          description: Definitions that are enabled and unarchived.
        policiesTotal:
          type: integer
          description: Every definition that still exists, archived included.
        total: { type: integer }
        open: { type: integer }
        bySeverity:
          type: object
          additionalProperties: { type: integer }
        byStatus:
          type: object
          additionalProperties: { type: integer }
        byRule:
          type: object
          additionalProperties: { type: integer }
        containersEvaluated:
          type: integer
          description: |
            Containers a pass has been ATTEMPTED for. Without this, "6
            containers are compliant" implies the rest were checked and failing.
        containersCompliant:
          type: integer
          description: Containers whose most recent COMPLETE pass found nothing.
        containersNonCompliant:
          type: integer
          description: Distinct containers holding at least one open violation.
        lastEvaluatedAt: { type: string, format: date-time }
        incomplete:
          type: boolean
          description: |
            At least one container's most recent pass could not apply every
            policy, so these counts are a floor.

    PolicyEngineStatus:
      type: object
      description: |
        The evaluation queue's state. An overflowed queue means the estate is
        being evaluated by full sweep rather than per container, which is
        correct but slower.
      properties:
        enabled: { type: boolean }
        policyCount: { type: integer }
        pendingEvaluations: { type: integer }
        sweepPending: { type: boolean }
        overflowed: { type: boolean }

    RegistryKind:
      type: string
      description: |
        Which provider serves a registry host. The distribution API is the same
        everywhere; what differs is host defaulting, repository shape, and how an
        anonymous pull token is obtained.
      enum: [dockerhub, ghcr, oci, unknown]

    UpdateType:
      type: string
      description: |
        What kind of update is available.

        `unknown` is NOT a small update. It means HarborMaster could not
        determine whether one exists -- a calendar-style tag, a tag listing that
        hit its budget, or a comparison the parser refused to make. It must read
        differently from `none`, which is a positive statement that the image is
        current.

        `digest` means the SAME TAG now resolves to different content: the
        publisher republished it. It is the only update type available for a tag
        that carries no version, which is why "latest" never reports a version
        change.
      enum: [none, digest, patch, minor, major, prerelease, unknown]

    CheckStatus:
      type: string
      description: |
        The outcome of the most recent registry lookup.

        Three of these mean there is nothing to fix:

        - `unauthorized` -- the repository is private, and HarborMaster holds no
          registry credentials by design.
        - `notFound` -- often a locally built image that was never published.
        - `unsupported` -- the reference names no public registry, so it can
          never be looked up. Deliberately distinct from `failed`, so a
          dashboard does not show a healthy estate as broken.
      enum: [pending, ok, failed, rateLimited, unauthorized, notFound, unsupported]

    ImageEventKind:
      type: string
      description: What changed. Only actual movements are recorded.
      enum:
        - discovered
        - digestChanged
        - updateFound
        - updateCleared
        - checkFailed
        - checkRecovered

    Platform:
      type: object
      description: |
        The OS and architecture a manifest targets. Recorded because a
        multi-architecture image resolves to a different digest per platform, so
        "the digest changed" is only meaningful once the platform is fixed.
      properties:
        os: { type: string }
        architecture: { type: string }
        variant: { type: string }

    ImageIntel:
      type: object
      description: |
        Everything known about one image reference.

        One record per REFERENCE rather than per container: a hundred containers
        running the same image are one registry lookup, which is the difference
        between a client a registry tolerates and one it blocks.

        The conditional-request validator is deliberately absent from this
        schema. It is a cache implementation detail with no meaning to a client,
        and it is registry-supplied text.
      required:
        [id, reference, familiar, registryKind, registry, repository,
         pinned, containerCount, updateType, checkStatus, firstSeenAt, failureCount]
      properties:
        id: { type: integer, format: int64 }
        reference:
          type: string
          description: The canonical form, e.g. "docker.io/library/nginx:1.25".
        familiar:
          type: string
          description: The short form an operator recognises, e.g. "nginx:1.25".
        registryKind: { $ref: "#/components/schemas/RegistryKind" }
        registry: { type: string }
        namespace: { type: string }
        repository: { type: string }
        tag: { type: string }
        localDigest:
          type: string
          description: The manifest digest the local daemon reports.
        remoteDigest:
          type: string
          description: |
            The digest the registry currently serves, COMPUTED from the manifest
            bytes rather than read from a registry header.
        pinned:
          type: boolean
          description: The reference names a digest, so its tag cannot move.
        platform: { $ref: "#/components/schemas/Platform" }
        imageId:
          type: string
          description: |
            The local image, when one exists. A reference can have intelligence
            without a local image: a container may name an image the daemon has
            since removed.
        containerCount: { type: integer }
        updateType: { $ref: "#/components/schemas/UpdateType" }
        latestTag:
          type: string
          description: |
            The newer tag found by version comparison. Absent for a digest-only
            update, which has no newer tag to name.
        updateReason:
          type: string
          description: |
            Why that verdict, from a fixed set of phrases. Never
            registry-supplied text.
        checkStatus: { $ref: "#/components/schemas/CheckStatus" }
        statusDetail:
          type: string
          description: |
            HarborMaster's own description of a non-OK status, from a fixed set
            of phrases. **Never a registry-supplied string.**
        firstSeenAt: { type: string, format: date-time }
        lastCheckedAt: { type: string, format: date-time }
        lastSuccessAt:
          type: string
          format: date-time
          description: |
            The most recent lookup that ANSWERED. A failed lookup moves
            `lastCheckedAt` and leaves this alone, so the gap between them is how
            stale the answer is.
        nextCheckAt: { type: string, format: date-time }
        failureCount: { type: integer }
        publishedAt:
          type: string
          format: date-time
          description: |
            When the remote image was built, from an OCI annotation. Frequently
            absent, and refused rather than guessed when it does not parse.
        vendor: { type: string, maxLength: 512 }
        source: { type: string, maxLength: 512 }
        labels:
          type: object
          description: |
            The OCI annotations that were kept -- a bounded allowlist of keys,
            not everything the registry sent.
          additionalProperties: { type: string }

    ImageUpdateEvent:
      type: object
      description: |
        One observed CHANGE. A pass that found everything unchanged writes
        nothing, which is what keeps this a history rather than a log of checks.
      required: [id, reference, observedAt, kind, checkStatus]
      properties:
        id: { type: integer, format: int64 }
        reference: { type: string }
        observedAt: { type: string, format: date-time }
        kind: { $ref: "#/components/schemas/ImageEventKind" }
        previousDigest: { type: string }
        currentDigest: { type: string }
        previousUpdateType: { $ref: "#/components/schemas/UpdateType" }
        currentUpdateType: { $ref: "#/components/schemas/UpdateType" }
        latestTag: { type: string }
        checkStatus: { $ref: "#/components/schemas/CheckStatus" }
        detail:
          type: string
          description: HarborMaster's own words, from a fixed set.

    RegistryHealth:
      type: object
      description: |
        One registry host's recent behaviour.

        Kept per HOST because rate limits, outages, and backoff are properties of
        an endpoint rather than of an image. It is also what lets a UI say
        "updates are stale because this registry is rate-limiting us" instead of
        showing a hundred individually failed images with no explanation.
      required: [host, registryKind, images, consecutiveFailures, rateLimited]
      properties:
        host: { type: string }
        registryKind: { $ref: "#/components/schemas/RegistryKind" }
        images:
          type: integer
          description: How many references this host serves.
        lastSuccessAt: { type: string, format: date-time }
        lastFailureAt: { type: string, format: date-time }
        consecutiveFailures: { type: integer }
        availableAt:
          type: string
          format: date-time
          description: |
            When the host may be contacted again. Set by HarborMaster's backoff
            and, when a registry sends one, by its own Retry-After.
        lastDetail: { type: string }
        rateLimited:
          type: boolean
          description: |
            The most recent failure was a rate limit, which an operator should
            read very differently from an outage.

    AcquisitionState:
      type: string
      description: |
        Where one acquisition has got to.

        `queued`, `validating`, `pulling` and `verifying` are active; the rest
        are terminal and nothing moves out of them.

        `succeeded` means the image is present locally and its digest was
        confirmed. It does NOT mean a container was updated -- no container is
        touched by any acquisition.
      enum:
        - queued
        - validating
        - pulling
        - verifying
        - succeeded
        - failed
        - cancelled
        - expired

    AcquisitionFailure:
      type: string
      description: |
        Why an acquisition did not succeed.

        `digestMismatch` is the serious one: the image now on the host is not
        the one that was approved. It is never retried automatically, because
        repeating a pull that produced the wrong content is how a transient
        substitution becomes a persistent one.

        `verification` is distinct from a mismatch: the check could not be
        PERFORMED, which establishes nothing at all.
      enum:
        - preflight
        - dockerUnavailable
        - registry
        - transfer
        - timeout
        - digestMismatch
        - platformMismatch
        - verification
        - internal

    AcquisitionRefusal:
      type: string
      description: |
        Which preflight check refused.

        A refusal means the safety model WORKED: something about the world no
        longer matches what was approved. Each value names one way that can
        happen between a plan being written and its image being fetched.
      enum:
        - planMissing
        - planSuperseded
        - planStale
        - recommendation
        - digestUnavailable
        - digestChanged
        - platformUnavailable
        - restoreReadiness
        - policyViolation
        - registryStale
        - duplicate
        - dockerUnavailable
        - limit
        - targetRefused
        - disabled
        - containerMissing

    AcquisitionRefusalResponse:
      type: object
      description: |
        The error envelope plus the specific check that refused, so a client can
        branch on WHICH check said no without parsing prose.
      required: [error, refusal]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                HarborMaster's own fixed phrase for this refusal. Never a daemon
                or registry string.
        refusal: { $ref: "#/components/schemas/AcquisitionRefusal" }
        requestId: { type: string }

    AcquisitionTarget:
      type: object
      description: |
        The immutable image an acquisition names, derived entirely from a change
        plan. There is no request field that supplies any of it.
      required: [registry, repository, digest]
      properties:
        registry:
          type: string
          description: The host the image lives on, e.g. `docker.io`.
        repository:
          type: string
          description: The path within it, e.g. `library/nginx`.
        digest:
          type: string
          description: |
            The manifest digest. Always present: an acquisition without one
            could fetch content that changed after approval.
        reference:
          type: string
          description: |
            The familiar form for display, e.g. `nginx:1.27.1`. Never used to
            perform the download.
        platform: { $ref: "#/components/schemas/Platform" }

    AcquisitionRequest:
      type: object
      description: |
        An operator's ask. Two fields, and neither names an image.

        Unknown fields are REJECTED rather than ignored, so a registry,
        repository, digest, tag, or pull option cannot be smuggled in.
      required: [planId]
      additionalProperties: false
      properties:
        planId:
          type: string
          description: The approved change plan. The target comes from it.
          pattern: "^plan_[0-9a-f]{20}$"
        requestKey:
          type: string
          description: |
            An optional idempotency key, so a retried request -- or a
            double-clicked button -- returns the existing record rather than
            starting a second download. Printable ASCII, at most 100 characters.
          maxLength: 100

    Acquisition:
      type: object
      description: |
        One immutable record of an attempt to acquire an image.

        Identity, target, and approval are written once. The lifecycle fields
        advance forwards and stop at a terminal state; a completed acquisition
        is never rewritten by a later attempt.

        **No field here describes a container being changed**, because that
        operation does not exist.
      required:
        - acquisitionId
        - planId
        - containerId
        - containerName
        - target
        - state
        - requestedAt
        - expiresAt
        - planDigest
      properties:
        acquisitionId:
          type: string
          pattern: "^acq_[0-9a-f]{20}$"
        planId:
          type: string
          description: |
            The change plan that approved this image. A plain reference: an
            audit record must survive its plan being pruned.
        containerId: { type: string }
        containerName: { type: string }
        target: { $ref: "#/components/schemas/AcquisitionTarget" }
        state: { $ref: "#/components/schemas/AcquisitionState" }
        failure: { $ref: "#/components/schemas/AcquisitionFailure" }
        message:
          type: string
          description: |
            HarborMaster's own sentence about the outcome, from a fixed
            vocabulary keyed by `failure`. **Never a daemon error or a registry
            response**, so a socket path or attacker-influenced string cannot
            reach a client.
        refusal: { $ref: "#/components/schemas/AcquisitionRefusal" }
        acquiredImageId:
          type: string
          description: |
            What VERIFICATION found on the host, as opposed to what was
            expected. On a mismatch this is the evidence, which is why it is
            recorded even when it disagrees with the target.
        acquiredDigest: { type: string }
        acquiredPlatform: { $ref: "#/components/schemas/Platform" }
        sizeBytes:
          type: integer
          format: int64
          description: |
            The local image size from inspection. Authoritative, unlike the
            transfer's own progress counters.
        layers:
          type: integer
          description: |
            How many layers the transfer touched. An estimate for display:
            layers already present locally are never counted.
        bytesTransferred:
          type: integer
          format: int64
          description: An estimate, for the same reason as `layers`.
        progress:
          type: string
          description: |
            The most recent status line, e.g. `Downloading`. Relayed by the
            daemon from the registry, so it is truncated, stripped of control
            characters, and rate-limited before it is stored.
        requestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: |
            When a still-queued request is abandoned. An expired request was
            never validated and never pulled: running it later would be acting
            on an approval whose evidence has aged.
        requestKey: { type: string }
        requestedBy:
          allOf:
            - $ref: "#/components/schemas/Requester"
          description: |
            The account that asked for this. Carried on the record so the
            OUTCOME can be attributed by the worker that finishes the job,
            minutes later, with no request and no session of its own.

            Absent on records written before HarborMaster recorded requesters.
        planDigest:
          type: string
          description: |
            The plan's input fingerprint AS APPROVED. What the preflight compares
            against to establish that the evidence has not moved.

    AcquisitionEvent:
      type: object
      description: |
        One bounded entry in an acquisition's audit trail.

        Records state transitions and periodic progress, three times bounded:
        the adapter rate-limits emission, the service caps its own writes, and
        the repository caps the stored count per acquisition.
      required: [state, at]
      properties:
        state: { $ref: "#/components/schemas/AcquisitionState" }
        detail:
          type: string
          description: |
            A short note in HarborMaster's own words, or a sanitised progress
            status. Rendered as text, never as markup.
        bytesTransferred: { type: integer, format: int64 }
        layers: { type: integer }
        at: { type: string, format: date-time }

    AcquisitionSummary:
      type: object
      description: The dashboard aggregate.
      properties:
        total: { type: integer }
        active: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
        byFailure:
          type: object
          additionalProperties: { type: integer }
        lastCompletedAt: { type: string, format: date-time }
        enabled:
          type: boolean
          description: |
            Whether acquisition is switched on at all, so an empty list is not
            read as "nothing has ever been downloaded".

    # ------------------------------------------------- container recreation --

    ExecutionState:
      type: string
      description: |
        Where one recreation has got to. A strict, forward-only lifecycle.

        The states up to and including `capturing` change NOTHING on the host
        and are freely cancellable. `creating` is the MUTATION POINT: from there
        the original has been stopped, and the recreation must reach a recorded
        conclusion rather than being abandoned.

        `succeeded` means all four proofs passed, the outcome was recorded, and
        the original was removed -- in that order.
      enum:
        - queued
        - validating
        - capturing
        - creating
        - starting
        - verifying
        - succeeded
        - failed
        - cancelled
        - expired

    ExecutionCheckpoint:
      type: string
      description: |
        What is TRUE OF THE HOST, as opposed to what HarborMaster was doing.

        **The field to read first on any failed or interrupted record.** It is
        written after each Docker mutation completes and before the next is
        attempted, so it says what has certainly been done. `state` says only
        what was being attempted.

        An empty value on a FAILED record whose `mutatedAt` is null means
        nothing on the host was changed. An empty value on one whose `mutatedAt`
        is set means a stop was issued and never confirmed -- the recovery plan
        says so rather than guessing.
      enum:
        - ""
        - originalStopped
        - originalParked
        - replacementCreated
        - replacementStarted
        - replacementVerified
        - replacementQuarantined
        - originalRemoved

    ExecutionFailure:
      type: string
      description: |
        Why a recreation did not succeed. A closed vocabulary; the message an
        operator reads is built from this and never from a daemon string.

        `preflight`, `capture`, and `secretUnavailable` all happen BEFORE the
        mutation point and leave the host untouched. Every other value means
        containers were left behind and the `recovery` plan applies.

        `persistence` is the one to understand: HarborMaster could not record
        what it had just done, so it STOPPED rather than acting again on an
        uncertain record. Repeating a stop, a rename, or a remove against a host
        whose recorded state is unknown is how a recoverable situation becomes
        an unrecoverable one.
      enum:
        - ""
        - preflight
        - capture
        - stop
        - rename
        - create
        - start
        - healthTimeout
        - unhealthy
        - notStable
        - imageMismatch
        - preservation
        - network
        - secretUnavailable
        - dockerUnavailable
        - timeout
        - interrupted
        - persistence
        - internal

    ExecutionRefusal:
      type: string
      description: |
        Which preflight check refused. A refusal means the safety model WORKED
        and nothing on this host was changed.

        `acquisitionConsumed` is the single-use rule: one recreation per
        acquisition, ever, with no override. A second one needs a fresh plan and
        a fresh acquisition.
      enum:
        - ""
        - disabled
        - acquisitionMissing
        - acquisitionNotSucceeded
        - acquisitionStale
        - acquisitionConsumed
        - planMissing
        - planSuperseded
        - planChanged
        - recommendation
        - containerMissing
        - containerChanged
        - containerState
        - inventoryStale
        - snapshotMissing
        - restoreReadiness
        - policyViolation
        - policyStale
        - registryStale
        - imageMissing
        - digestMismatch
        - platformMismatch
        - conflict
        - limit
        - dockerUnavailable
        - secretUnavailable
        - nameUnavailable

    ExecutionRefusalResponse:
      type: object
      description: |
        The error envelope plus the specific check that refused.

        The extra field exists so a client can branch on WHICH check said no
        without parsing prose: "a newer plan exists" and "the daemon is down"
        call for different things from an operator, and both arrive as a 409.
      required: [error, refusal]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                HarborMaster's own fixed phrase for this refusal. Never a daemon
                or registry string.
        refusal: { $ref: "#/components/schemas/ExecutionRefusal" }
        requestId: { type: string }

    VerificationResult:
      type: string
      description: |
        The outcome of one proof.

        `unknown` means the proof was never reached or could not be performed,
        and it is NEVER treated as a pass. The parked original is removed only
        when every proof reads `passed`.
      enum: [unknown, passed, failed]

    ExecutionTarget:
      type: object
      description: |
        The immutable image a recreation moves a container onto. Derived
        entirely from the acquisition; no field here is ever filled from caller
        input.
      required: [registry, repository, digest]
      properties:
        registry: { type: string, example: docker.io }
        repository: { type: string, example: library/nginx }
        digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
          description: |
            The manifest digest. The container is created from
            `registry/repository@digest`, never from a tag: a tag is a name that
            can be repointed between approval and application.
        reference:
          type: string
          description: The familiar form, for display only.
        imageId:
          type: string
          description: |
            The local image the acquisition verified. Recorded so the record
            ties to what inspection found; the container is created from the
            digest-pinned reference, not from this.
        platform: { $ref: "#/components/schemas/Platform" }

    PreservationDifference:
      type: object
      description: One configuration field that did not survive the recreation.
      required: [field, kind]
      properties:
        field:
          type: string
          example: security.capAdd
        kind: { type: string, enum: [changed, missing, added] }
        expected:
          type: string
          description: |
            The original's rendering, bounded and sanitised. Never a raw secret:
            a sensitive value is rendered as a keyed digest.
        actual:
          type: string
          description: The replacement's rendering, bounded and sanitised.

    PreservationReport:
      type: object
      description: |
        The field-by-field comparison between the original's configuration and
        the replacement's.

        Both sides are projected through ONE builder, which is what makes the
        comparison meaningful: a field that is rendered leniently is rendered
        leniently on both sides, and a field that is not emitted is not claimed
        to have been checked.

        No value here is a secret. A sensitive environment variable or log
        option contributes a keyed digest produced under the installation key
        the snapshots use.
      required: [status, checked, matched]
      properties:
        status: { $ref: "#/components/schemas/VerificationResult" }
        checked: { type: integer }
        matched: { type: integer }
        differences:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/PreservationDifference" }
        truncated:
          type: boolean
          description: |
            More differences existed than are listed. A wholesale mismatch
            produces one per field and only the first few are actionable.
        expectedFingerprint: { type: string }
        actualFingerprint: { type: string }
        unverifiable:
          type: boolean
          description: |
            The comparison could not be PERFORMED -- most often because the two
            projections were produced under different installation keys. Never
            a pass: a check that could not run establishes nothing.
        reason: { type: string }

    ExecutionVerification:
      type: object
      description: |
        What each proof concluded. Every field is a tri-state, and `unknown`
        means the proof was never reached -- deliberately distinct from having
        failed.
      required: [health, image, preservation, network]
      properties:
        health: { $ref: "#/components/schemas/VerificationResult" }
        healthState:
          type: string
          enum: ["", none, starting, healthy, unhealthy]
          description: The container health the wait observed.
        healthChecked:
          type: boolean
          description: |
            Whether the container declares a health check at all. False means
            `health` reflects the STABILITY window instead, which is weaker
            evidence: it establishes that the container did not crash on
            startup and nothing more.
        stabilitySeconds:
          type: integer
          description: |
            How long the replacement was required to stay running, when it has
            no health check.
        image: { $ref: "#/components/schemas/VerificationResult" }
        preservation: { $ref: "#/components/schemas/VerificationResult" }
        preservationReport: { $ref: "#/components/schemas/PreservationReport" }
        network: { $ref: "#/components/schemas/VerificationResult" }

    RecoveryStep:
      type: object
      description: |
        One instruction in a manual recovery plan.

        `command` is rendered for an operator to READ. HarborMaster never
        executes it, never shells out, and has no capability that could.
      required: [order, description, destructive]
      properties:
        order: { type: integer, minimum: 1 }
        description:
          type: string
          description: HarborMaster's own sentence. Never a daemon string.
        command:
          type: string
          example: docker rename web.hm-old-exec_3f8a1c9e7b2d4a6f0c1e web
        destructive:
          type: boolean
          description: |
            This step removes something. Called out so an operator reading
            quickly does not run one by reflex.

    RecoveryPlan:
      type: object
      description: |
        What was left on the host, and what to do about it.

        Present when a recreation failed in a way that left containers behind.
        **Nothing executes a recovery plan.** There is no endpoint that runs
        one, no button that applies one, and no capability behind either: it is
        text, assembled from a fixed vocabulary and from names HarborMaster
        generated or read from the daemon.
      required: [urgency, situation, serviceInterrupted]
      properties:
        urgency:
          type: string
          enum: [informational, attention, urgent]
          description: |
            `urgent` means the container is NOT SERVING. `attention` means
            something was left behind but the service is up. `informational`
            means nothing needs settling.
        situation:
          type: string
          description: A plain statement of what is true of the host right now.
        serviceInterrupted:
          type: boolean
          description: |
            Whether the container is currently not serving. The single most
            important fact on this record.
        steps:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/RecoveryStep" }

    ExecutionRequest:
      type: object
      description: |
        An operator's ask.

        ONE meaningful field. It does not carry a container, an image, a digest,
        a tag, a command, a mount, a capability, a privilege flag, a timeout, or
        a force -- and unknown fields are REJECTED rather than ignored, so
        nothing can be smuggled in.

        There is deliberately no `allowReuse`: an acquisition is single use.
      required: [acquisitionId]
      additionalProperties: false
      properties:
        acquisitionId:
          type: string
          pattern: "^acq_[0-9a-f]{20}$"
          description: |
            The SUCCEEDED acquisition to apply. It transitively identifies the
            verified digest, the plan that approved it, and the container --
            which is what makes it structurally impossible to request a
            recreation onto an image that was never downloaded and verified.
        requestKey:
          type: string
          maxLength: 100
          pattern: "^[\\x21-\\x7e]*$"
          description: |
            Optional idempotency key. A retried request -- or a double-clicked
            button -- returns the existing record rather than starting a second
            recreation.

    Execution:
      type: object
      description: |
        One immutable record of one container recreation.

        Identity, target, and approval are written once; the lifecycle fields
        advance forwards and stop. A second recreation is a second row: history
        is never overwritten.
      required:
        - executionId
        - acquisitionId
        - planId
        - containerId
        - containerName
        - oldImage
        - target
        - state
        - verification
        - originalRemoved
        - requestedAt
        - expiresAt
        - planDigest
      properties:
        executionId:
          type: string
          pattern: "^exec_[0-9a-f]{20}$"
          description: |
            The immutable public identifier, generated server-side from the
            system entropy source. Random rather than sequential because it
            appears in URLs AND in container names on this host.
        acquisitionId:
          type: string
          description: The download this recreation applied. Single use.
        planId: { type: string }
        snapshotId:
          type: integer
          format: int64
          description: The baseline snapshot this container had beforehand.
        containerId:
          type: string
          description: The ORIGINAL container.
        containerName:
          type: string
          description: The name the replacement takes over.
        oldImage: { type: string }
        oldImageId: { type: string }
        oldImageDigest: { type: string }
        target: { $ref: "#/components/schemas/ExecutionTarget" }
        state: { $ref: "#/components/schemas/ExecutionState" }
        checkpoint: { $ref: "#/components/schemas/ExecutionCheckpoint" }
        failure: { $ref: "#/components/schemas/ExecutionFailure" }
        refusal: { $ref: "#/components/schemas/ExecutionRefusal" }
        message:
          type: string
          description: |
            HarborMaster's own sentence about the outcome. Never a daemon or
            registry string.
        replacementId:
          type: string
          description: The container that was created.
        parkedName:
          type: string
          description: |
            The name the original was renamed to, `<name>.hm-old-<executionId>`.
            Present from the moment the rename lands, so an operator can find
            the container even if the recreation fails immediately afterwards.
        quarantineName:
          type: string
          description: |
            The name a FAILED replacement was renamed to,
            `<name>.hm-failed-<executionId>`. It is stopped and renamed rather
            than removed, because it is the evidence for why the new image did
            not work.
        originalRemoved:
          type: boolean
          description: |
            Whether the parked original was removed. False on a `succeeded`
            record means the replacement is serving correctly but the original
            could not be removed -- housekeeping, described by the recovery
            plan, not a failed recreation.
        verification: { $ref: "#/components/schemas/ExecutionVerification" }
        recovery: { $ref: "#/components/schemas/RecoveryPlan" }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        mutatedAt:
          type: string
          format: date-time
          description: |
            When the host was FIRST changed. Absent means it never was, which is
            the single most useful fact on a failed record.
        completedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: |
            When a still-queued request is abandoned. An expired request never
            started and changed nothing.
        requestKey: { type: string }
        requestedBy:
          allOf:
            - $ref: "#/components/schemas/Requester"
          description: |
            The account that asked for this. Carried on the record so the
            OUTCOME can be attributed by the worker that finishes the job,
            minutes later, with no request and no session of its own.

            Absent on records written before HarborMaster recorded requesters.
        planDigest:
          type: string
          description: |
            The plan's input fingerprint AS APPROVED at acquisition time.
            Preflight compares it against the plan's current fingerprint, which
            is the exact time-of-check/time-of-use test across the gap between
            downloading an image and applying it.

    ExecutionEvent:
      type: object
      description: |
        One bounded entry in a recreation's audit trail.

        Records STATE TRANSITIONS and CHECKPOINTS, every one written by
        HarborMaster about its own action from a fixed vocabulary. Nothing
        external influences how many rows one recreation can produce.
      required: [state, at]
      properties:
        state: { $ref: "#/components/schemas/ExecutionState" }
        checkpoint: { $ref: "#/components/schemas/ExecutionCheckpoint" }
        detail: { type: string }
        at: { type: string, format: date-time }

    ExecutionSummary:
      type: object
      description: The dashboard aggregate.
      properties:
        total: { type: integer }
        active: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        needsAttention:
          type: integer
          description: |
            Failures that left containers on this host for an operator to
            settle. The number that matters most on this page.
        byState:
          type: object
          additionalProperties: { type: integer }
        byFailure:
          type: object
          additionalProperties: { type: integer }
        lastCompletedAt: { type: string, format: date-time }
        enabled:
          type: boolean
          description: |
            Whether recreation is switched on at all, so an empty list is not
            read as "nothing has ever been recreated".

    # ------------------------------------------------------ manual rollback --

    RollbackState:
      type: string
      description: |
        Where one rollback has got to.

        `queued` and `validating` change nothing on this host and are freely
        cancellable. **`stoppingReplacement` is the mutation point**: from there
        the replacement has been stopped and the rollback must reach a recorded
        conclusion.

        There is no `interrupted` state. A rollback a restart abandoned settles
        as `failed` with `failure: interrupted`, which is how a recreation
        settles the same condition -- two vocabularies for one situation would
        let the two recovery pages disagree about what "interrupted" means.
      enum:
        - queued
        - validating
        - stoppingReplacement
        - restoringName
        - startingOriginal
        - verifyingOriginal
        - succeeded
        - failed
        - cancelled
        - expired

    RollbackCheckpoint:
      type: string
      description: |
        What is TRUE OF THE HOST.

        **The field to read first on any failed or interrupted record.** `state`
        says what HarborMaster was DOING; this says what it had actually
        finished doing and durably recorded. A checkpoint is written after each
        Docker mutation completes and before the next is attempted, and an
        uncertain mutation is never repeated.

        An empty value with `mutatedAt` unset means nothing was changed. An
        empty value with `mutatedAt` SET means a stop was issued and never
        confirmed, which is the one case where HarborMaster does not know where
        the containers are.

        `originalStarted` is deliberately not an interruption of service: the
        container is running under its own name. What is missing is the proof
        that it is running correctly.
      enum:
        - ""
        - replacementStopped
        - replacementParked
        - originalRestored
        - originalStarted
        - originalVerified

    RollbackFailure:
      type: string
      description: |
        Why a rollback did not succeed.

        A CLASSIFICATION, never a daemon string. `preflight` happens before the
        mutation point and leaves the host untouched; for everything else the
        CHECKPOINT, not this field, is what says whether anything was changed.
      enum:
        - preflight
        - stop
        - rename
        - start
        - healthTimeout
        - unhealthy
        - notStable
        - imageMismatch
        - preservation
        - network
        - dockerUnavailable
        - timeout
        - interrupted
        - persistence
        - internal

    RollbackRefusal:
      type: string
      description: |
        Which preflight check refused.

        A closed vocabulary, so a client can branch on it rather than parse
        prose. A refusal means the safety model worked: nothing on this host was
        changed.
      enum:
        - disabled
        - executionMissing
        - executionActive
        - nothingToRollBack
        - originalRemoved
        - checkpointUncertain
        - alreadyRolledBack
        - conflict
        - limit
        - originalMissing
        - originalIdentity
        - replacementMissing
        - replacementIdentity
        - nameUnavailable
        - inventoryStale
        - dockerUnavailable
        - unverifiable

    RollbackRefusalResponse:
      type: object
      description: |
        A refusal, carrying the specific check that said no.

        The extra field is what lets a client render the right remedy rather
        than a generic conflict: "the original is gone" and "somebody else is
        already rolling this back" call for completely different responses.
      required: [error, refusal]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                HarborMaster's own fixed phrase for this refusal. Never a daemon
                or registry string.
        refusal: { $ref: "#/components/schemas/RollbackRefusal" }
        requestId: { type: string }

    RollbackVerification:
      type: object
      description: |
        What each proof concluded about the RESTORED ORIGINAL.

        All four must read `passed` for a rollback to be recorded as succeeded.
        **`unknown` is never a pass**: a proof that could not be performed
        established nothing.

        The preservation comparison is against the projection taken BEFORE the
        rollback moved anything, so what it proves is that the rollback did not
        change the container it restored. The image comparison is against what
        the RECREATION recorded the original as running, which is what makes
        "this is the container that was replaced" a checked fact rather than an
        assumption carried forward.
      properties:
        health: { $ref: "#/components/schemas/VerificationResult" }
        healthState:
          type: string
          enum: ["", none, starting, healthy, unhealthy]
        healthChecked:
          type: boolean
          description: |
            False means `health` reflects the STABILITY window rather than a
            declared health check, which is weaker evidence and is recorded as
            such.
        stabilitySeconds: { type: integer }
        image: { $ref: "#/components/schemas/VerificationResult" }
        preservation: { $ref: "#/components/schemas/VerificationResult" }
        preservationReport: { $ref: "#/components/schemas/PreservationReport" }
        network: { $ref: "#/components/schemas/VerificationResult" }

    RollbackRequest:
      type: object
      description: |
        Everything a caller may supply.

        **Two fields, and neither names a container.** There is nowhere here to
        put a container id, a name, an image, a snapshot, or any Docker
        parameter, which is a stronger guarantee than a check that rejects one.
        Unknown fields are rejected rather than ignored.
      required: [executionId]
      properties:
        executionId:
          type: string
          pattern: "^exec_[0-9a-f]{20}$"
          description: |
            The recreation to undo. Everything about what will happen is derived
            from HarborMaster's own record of it.
        requestKey:
          type: string
          maxLength: 100
          description: |
            An optional idempotency key, so a retried request -- or a
            double-clicked button -- returns the rollback it already made rather
            than starting a second one.

    Rollback:
      type: object
      description: |
        One immutable record of one manual rollback.

        Read `checkpoint` before `state` on anything that did not succeed.
      required: [rollbackId, executionId, containerName, originalId, replacementId, state]
      properties:
        rollbackId:
          type: string
          pattern: "^rbk_[0-9a-f]{20}$"
        executionId:
          type: string
          pattern: "^exec_[0-9a-f]{20}$"
        containerName:
          type: string
          description: The production name both containers contend for.
        originalId:
          type: string
          description: The preserved original, by full container id.
        parkedName:
          type: string
          description: |
            `<name>.hm-old-<executionId>` -- where the recreation left the
            original, and where to find it if a rollback failed before renaming
            it back.
        replacementId:
          type: string
          description: The container the recreation created, by full container id.
        replacementParkedName:
          type: string
          description: |
            `<name>.hm-rolledback-<rollbackId>` -- where the rollback moved the
            replacement to. Empty until that rename has happened AND been
            recorded.
        originalImage: { type: string }
        originalImageId: { type: string }
        replacementImage:
          type: string
          description: What the recreation moved the container onto, so an
            operator sees what is being backed out of.
        state: { $ref: "#/components/schemas/RollbackState" }
        checkpoint: { $ref: "#/components/schemas/RollbackCheckpoint" }
        failure: { $ref: "#/components/schemas/RollbackFailure" }
        refusal: { $ref: "#/components/schemas/RollbackRefusal" }
        message:
          type: string
          description: |
            HarborMaster's own sentence about the outcome. **Never a daemon or
            registry string.**
        verification: { $ref: "#/components/schemas/RollbackVerification" }
        recovery:
          allOf:
            - $ref: "#/components/schemas/RecoveryPlan"
          description: |
            The manual steps, present when a failure left containers on this
            host. It is text. **HarborMaster never executes it.**
        requestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        mutatedAt:
          type: string
          format: date-time
          description: |
            When the host was FIRST changed. Absent means it never was, which is
            the single most useful fact on a failed record.
        completedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: |
            When a still-queued request is abandoned. An expired request never
            started and changed nothing.
        requestKey: { type: string }
        requestedBy:
          allOf:
            - $ref: "#/components/schemas/Requester"
          description: |
            The account that asked for this. Carried on the record so the
            OUTCOME can be attributed by the worker that finishes the job,
            minutes later, with no request and no session of its own.

    RollbackEvent:
      type: object
      description: |
        One bounded entry in a rollback's audit trail.

        Records STATE TRANSITIONS and CHECKPOINTS, every one written by
        HarborMaster about its own action from a fixed vocabulary. Nothing
        external influences how many rows one rollback can produce.
      required: [state, at]
      properties:
        state: { $ref: "#/components/schemas/RollbackState" }
        checkpoint: { $ref: "#/components/schemas/RollbackCheckpoint" }
        detail: { type: string }
        at: { type: string, format: date-time }

    RollbackSummary:
      type: object
      description: The estate aggregate.
      properties:
        total: { type: integer }
        active: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        needsAttention:
          type: integer
          description: |
            Failures that left containers on this host for an operator to
            settle. The number that matters most on this page.

    RollbackEligibility:
      type: object
      description: |
        Whether one recreation LOOKS like one that can be undone, and if not,
        why.

        **Advice, not permission, and computed from records alone.** It reflects
        HarborMaster's own record of the recreation and of any rollbacks already
        made from it. It issues no Docker call, so it says nothing about whether
        the containers are still on the host — see the `rollback` field on the
        execution detail for why.

        The identities are filled in even on a refusal, when they are known, so
        a refusal page can say WHICH containers it is talking about.
      required: [eligible]
      properties:
        eligible: { type: boolean }
        refusal: { $ref: "#/components/schemas/RollbackRefusal" }
        reason:
          type: string
          description: The refusal in operator-facing words.
        containerName: { type: string }
        originalId: { type: string }
        parkedName: { type: string }
        replacementId: { type: string }
        replacementImage: { type: string }
        originalImage: { type: string }

    RiskBand:
      type: string
      description: |
        How risky a proposed change is, from a deterministic integer score.

        Bands exist because a number alone invites false precision: "47" implies
        a measurement, while "medium" is honest about being a judgement built
        from named factors. The boundaries are 10, 25, 50 and 80.
      enum: [veryLow, low, medium, high, critical]

    Recommendation:
      type: string
      description: |
        What HarborMaster suggests an operator do.

        `unknown` is deliberately NOT the same as `proceed`. A gap in evidence is
        not a clean bill of health, and collapsing the two would be the single
        most misleading thing this feature could do.
      enum: [proceed, proceedWithCaution, manualReview, notRecommended, unknown]

    FactorSeverity:
      type: string
      description: |
        How much one contributing factor matters.

        Separate from its point contribution, because the two answer different
        questions: points decide the band, severity decides the recommendation.
        A factor can add few points and still block -- a critical policy
        violation is not made acceptable by everything else being fine.

        `unknown` records MISSING EVIDENCE and forces the recommendation to
        `unknown`. `blocker` argues against the change whatever the score.
      enum: [info, caution, warning, blocker, unknown]

    PlanRule:
      type: string
      description: |
        The rule that produced a factor. A closed vocabulary, fixed at compile
        time -- there is no rule registry, no configuration, and no way to add
        one at runtime or from a request.
      enum:
        - updateClassification
        - mutableTag
        - unknownDigest
        - registryQuality
        - imageAge
        - platform
        - snapshotAvailable
        - restoreReadiness
        - activeDrift
        - policyViolations
        - blastRadius

    RiskFactor:
      type: object
      description: One named contribution to a plan's risk.
      required: [rule, points, severity, detail]
      properties:
        rule: { $ref: "#/components/schemas/PlanRule" }
        points:
          type: integer
          description: |
            This factor's contribution to the score. May be zero: a factor can
            be worth STATING without being worth scoring, and the reasoning
            timeline is more useful when it includes those.
        severity: { $ref: "#/components/schemas/FactorSeverity" }
        detail:
          type: string
          description: |
            The human-readable reason, from a fixed set of phrases built by the
            rule. Never an error string, never registry-supplied text, never
            caller input.

    RiskAssessment:
      type: object
      description: The verdict for one proposed change.
      required: [riskScore, riskBand, recommendation, summary, factors]
      properties:
        riskScore: { type: integer, minimum: 0, maximum: 100 }
        riskBand: { $ref: "#/components/schemas/RiskBand" }
        recommendation: { $ref: "#/components/schemas/Recommendation" }
        summary:
          type: string
          description: |
            A one-sentence explanation, built from the recommendation and the
            single heaviest factor, so the sentence names the actual reason
            rather than restating the score.
        factors:
          type: array
          description: |
            The contributions in RULE ORDER, which is fixed at compile time.
            Stable ordering is part of determinism: the same inputs produce a
            byte-identical explanation.
          items: { $ref: "#/components/schemas/RiskFactor" }

    ChangePlan:
      type: object
      description: |
        One immutable assessment of one proposed container change.

        Nothing executes a plan, and the model has no state to execute: no
        status, no queue position, no target. It is the analysis; acting on it
        is an operator's job with their own tooling.
      required:
        - planId
        - containerId
        - containerName
        - currentImage
        - proposedImage
        - updateType
        - snapshotAvailable
        - restoreReadiness
        - driftOpen
        - policyOpen
        - registryStatus
        - risk
        - planVersion
        - plannerVersion
        - inputDigest
        - generatedAt
        - superseded
      properties:
        planId:
          type: string
          description: The immutable public identifier, generated server-side.
          pattern: "^plan_[0-9a-f]{20}$"
        containerId: { type: string }
        containerName: { type: string }
        currentImage:
          type: string
          description: The familiar reference the container runs, e.g. `nginx:1.25`.
        proposedImage:
          type: string
          description: |
            What the container would move to. The same reference as
            `currentImage` when only the digest moved: reporting that as a
            reference change would suggest editing something that does not need
            editing.
        currentDigest: { type: string }
        proposedDigest: { type: string }
        updateType: { $ref: "#/components/schemas/UpdateType" }
        snapshotId:
          type: integer
          format: int64
          description: The baseline this container would have to refer back to.
        snapshotAvailable: { type: boolean }
        restoreReadiness: { $ref: "#/components/schemas/ReadinessStatus" }
        driftOpen:
          type: integer
          description: |
            Unresolved differences from the baseline. The drift RECORDS are not
            copied here: a plan references the summary it acted on, and the
            records have one home.
        driftMaxSeverity: { type: string }
        policyOpen: { type: integer }
        policyMaxSeverity: { type: string }
        registryStatus: { $ref: "#/components/schemas/CheckStatus" }
        registryDetail:
          type: string
          description: |
            HarborMaster's own description of a non-OK status, from a fixed set
            of phrases. Never a registry-supplied string.
        proposedPublishedAt:
          type: string
          format: date-time
          description: |
            When the proposed image was built, when a publisher recorded it.
            Frequently absent, which is unremarkable and is not scored against
            the image.
        risk: { $ref: "#/components/schemas/RiskAssessment" }
        planVersion:
          type: integer
          description: The schema version of this plan's shape.
        plannerVersion:
          type: string
          description: |
            The rule set that produced it. Stored so a plan generated by an older
            planner is identifiable rather than silently compared with a newer
            one.
        inputDigest:
          type: string
          description: |
            A fingerprint of everything the assessment read. Two passes over an
            unchanged world produce the same digest and the second writes
            nothing, which is what keeps this table from growing on every
            refresh.
        generatedAt: { type: string, format: date-time }
        superseded:
          type: boolean
          description: |
            A newer plan exists for this container. Derived at read time rather
            than stored, because storing it would mean writing to an immutable
            row.

    ChangePlanSummary:
      type: object
      description: The dashboard aggregate, over CURRENT plans only.
      properties:
        plans: { type: integer }
        containers: { type: integer }
        byRiskBand:
          type: object
          additionalProperties: { type: integer }
        byRecommendation:
          type: object
          additionalProperties: { type: integer }
        byUpdateType:
          type: object
          additionalProperties: { type: integer }
        actionable:
          type: integer
          description: |
            Plans recommending proceed or proceed-with-caution -- the changes an
            operator could make today.
        needsReview:
          type: integer
          description: Plans that ask for a person.
        blocked:
          type: integer
          description: Plans recommending against the change.
        undetermined:
          type: integer
          description: |
            Plans HarborMaster could not judge. Reported beside the rest so a gap
            in evidence stays visible rather than being absorbed into
            `actionable`.
        lastGeneratedAt: { type: string, format: date-time }
        plannerVersion:
          type: string
          description: |
            The rule set the newest plans were built with, so a UI can say the
            rules changed rather than leaving an operator to wonder why every
            score moved.

    PlannerStatus:
      type: object
      description: The generation scheduler's state.
      properties:
        enabled: { type: boolean }
        plannerVersion: { type: string }
        running: { type: boolean }
        pending:
          type: boolean
          description: A pass is owed.
        lastRunAt: { type: string, format: date-time }
        lastGenerated: { type: integer }
        lastUnchanged:
          type: integer
          description: |
            Containers whose assessment had not moved, so nothing was written.
            On a settled estate this is nearly everything, and it is how much
            work duplicate suppression saved.
        lastSkipped:
          type: integer
          description: Containers with no change to assess.

    ImageIntelSummary:
      type: object
      description: The dashboard aggregate.
      properties:
        images: { type: integer }
        containers: { type: integer }
        updatesAvailable: { type: integer }
        containersAffected:
          type: integer
          description: |
            Containers running an image with an update -- the number an operator
            actually plans around.
        byUpdateType:
          type: object
          additionalProperties: { type: integer }
        byCheckStatus:
          type: object
          additionalProperties: { type: integer }
        byRegistry:
          type: object
          description: Bounded to the twenty registries serving the most references.
          additionalProperties: { type: integer }
        checked:
          type: integer
          description: |
            References looked up at least once. The gap between this and `images`
            is the coverage a dashboard must not hide: an estate where nothing
            has been checked is not an estate with no updates.
        pending: { type: integer }
        unsupported:
          type: integer
          description: |
            References that will never be looked up, so a permanent gap in
            coverage can be explained rather than shown as a failure.
        lastCheckedAt: { type: string, format: date-time }
        registries:
          type: array
          items: { $ref: "#/components/schemas/RegistryHealth" }

    ImageIntelEngineStatus:
      type: object
      description: The collection scheduler's state.
      properties:
        enabled: { type: boolean }
        dueNow:
          type: integer
          description: References past their next-check time.
        running: { type: boolean }
        sweepPending: { type: boolean }
        lastSweepAt: { type: string, format: date-time }
        lastChecked: { type: integer }
        lastSkipped: { type: integer }
        lastFailed: { type: integer }

    # ------------------------------------------------------------ identity --

    Role:
      type: string
      enum: [viewer, operator, administrator]
      description: |
        The account's role. A value outside this set holds no permissions at
        all -- an unrecognised role is never treated as the least privileged
        one, because a corrupt row must not become a silent grant.

    Permission:
      type: string
      description: |
        One capability. A closed vocabulary; `GET /roles` lists which role holds
        which.
      enum:
        - inventory:read
        - event:read
        - snapshot:read
        - drift:read
        - policy:read
        - plan:read
        - acquisition:read
        - execution:read
        - inventory:refresh
        - snapshot:create
        - drift:annotate
        - policy:evaluate
        - policy:annotate
        - image:refresh
        - plan:generate
        - acquisition:create
        - acquisition:cancel
        - execution:create
        - execution:cancel
        - policy:manage
        - user:manage
        - audit:read

    UserStatus:
      type: string
      enum: [active, disabled]

    PublicUser:
      type: object
      description: |
        An account as this API renders it.

        **No credential material appears here in any form** -- no password, no
        hash, no salt, no Argon2id parameter, and no session token. The server's
        projection carries none of them.
      required: [userId, username, role, status, permissions, mustChangePassword, createdAt]
      properties:
        userId: { type: string }
        username:
          type: string
          description: |
            Lowercase ASCII letters, digits, dot, dash, and underscore only.
            Non-ASCII is refused rather than escaped: two accounts that render
            identically would make the audit log actively misleading.
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        permissions:
          type: array
          description: Everything the role holds, so a client need not reimplement the matrix.
          items: { $ref: "#/components/schemas/Permission" }
        mustChangePassword:
          type: boolean
          description: |
            The credential was chosen by somebody other than the account holder.
            Until it is replaced, every route except reading the session,
            changing the password, and signing out answers 403.
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }

    SessionResponse:
      type: object
      description: |
        What a client needs to operate.

        **The session token is not here and never will be.** It is in an
        HttpOnly cookie, which is what stops a script on the page reading it.
      required: [user, csrfToken]
      properties:
        user: { $ref: "#/components/schemas/PublicUser" }
        csrfToken:
          type: string
          description: |
            Send as `X-HarborMaster-CSRF` on every state-changing request. It is
            derived from the session token rather than stored, so it rotates
            with the session, and it is useless without the cookie.
        expiresAt:
          type: string
          format: date-time
          description: When the session ends regardless of use.

    BootstrapStatus:
      type: object
      required: [completed, tokenRequired]
      properties:
        completed:
          type: boolean
          description: |
            An administrator exists. Once true, always true: an installation
            whose administrators were all disabled does not fall back into a
            flow that lets anyone claim it.
        tokenRequired:
          type: boolean
          description: Always true for the HTTP flow.

    BootstrapRequest:
      type: object
      required: [token, username, password]
      properties:
        token:
          type: string
          description: The one-time value printed at startup.
        username: { type: string }
        password: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password:
          type: string
          minLength: 12
          maxLength: 1024
          description: |
            Bounded before hashing. An unbounded password would be an
            unauthenticated memory amplifier against the one expensive operation
            this endpoint offers. An over-long value gets the same 401 as a wrong
            one.

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
          description: |
            At least 12 characters, not on the refusal list, not containing the
            username, and not a single repeated character or a simple run. There
            is deliberately no character-class requirement: composition rules
            push people toward predictable manglings.

    SessionSummary:
      type: object
      description: |
        A live session on the caller's own account. `sessionId` is the PUBLIC
        identifier; it is not the token and grants nothing.
      required: [sessionId, createdAt, lastSeenAt, idleExpiresAt, absoluteExpiresAt]
      properties:
        sessionId: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        idleExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
        userAgent:
          type: string
          description: A bounded, sanitised note. Never interpreted as markup.
        clientAddr:
          type: string
          description: |
            The transport peer, unless a trusted-proxy range was configured and
            the peer is inside it. A forwarding header is attacker-controlled
            text and is otherwise ignored.
        current: { type: boolean }

    SessionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }

    RoleDescription:
      type: object
      required: [role, description, permissions]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    RoleCatalogue:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoleDescription" }

    CreateUserRequest:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        password:
          type: string
          minLength: 12
          maxLength: 1024
          description: |
            Optional. Omit it and HarborMaster generates one and returns it once
            -- the safer default, because an administrator who picks a password
            for somebody else knows that password.

    CreatedUser:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/PublicUser" }
        temporaryPassword:
          type: string
          description: |
            Present only when HarborMaster generated one. **Returned in this
            response and nowhere else, ever.** It is not stored in plaintext and
            cannot be retrieved again.

    UpdateUserRequest:
      type: object
      description: |
        A partial update. Both fields are optional; omitting one leaves it
        alone. There is no username field: a username reaches every audit
        record, and renaming an account would rewrite what those records mean.
      properties:
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }

    UserListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicUser" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    # ------------------------------------------------------- security audit --

    Requester:
      type: object
      description: |
        The account that asked for a piece of asynchronous work.

        Two fields, and the omissions are deliberate. No role, because a role is
        what the authorization decision used at the moment of the request and a
        reader of a later record would take it as current. No session, because a
        session identifier is meaningful only while the session exists. No
        address, because that belongs to the request, which is audited with it.

        Absent on work requested before HarborMaster recorded requesters.
      properties:
        userId: { type: string }
        username: { type: string }

    AuditOutcome:
      type: string
      enum: [succeeded, failed, denied]
      description: |
        `denied` is an authorization refusal, which is a different security
        event from an action that was permitted and then failed.

    AuditEvent:
      type: object
      description: |
        One record: who did what, to what, from where, and whether it worked.

        Every field is either a closed vocabulary or a bounded, sanitised string
        the server itself wrote. **There is no request body, header, cookie,
        environment value, or credential anywhere in this schema**, and no
        column exists that could hold one.
      required: [eventId, action, outcome, occurredAt]
      properties:
        eventId: { type: string }
        action:
          type: string
          description: |
            The action, from a closed vocabulary.

            The two host-changing operations record a REQUEST and an OUTCOME
            separately, because they are separate facts: a request can be
            refused by the second preflight, cancelled before anything moves,
            expire in the queue, or fail partway.

            - `acquisition.requested` / `execution.requested` -- somebody asked.
            - `acquisition.completed` / `execution.completed` -- **the host
              changed.** These are the two actions counted as
              `privilegedActions`, and the two logged at WARN.
            - `acquisition.failed` / `execution.failed` -- it did not complete.
              The reason says whether the host was left changed, which is what
              decides whether somebody has to go and look.

            A completion carries the account that REQUESTED the work, read from
            the record: the outcome is written by a worker minutes later, with
            no request and no session of its own.
        outcome: { $ref: "#/components/schemas/AuditOutcome" }
        actorUserId: { type: string }
        actorUsername: { type: string }
        actorRole: { $ref: "#/components/schemas/Role" }
        actorSessionId:
          type: string
          description: The session the action was taken from. Not the token.
        targetType: { type: string }
        targetId:
          type: string
          description: |
            What was acted on. For an authorization denial this is the
            PERMISSION that was refused, never the path -- a permission is a
            closed vocabulary; a path is request-derived text.
        targetName: { type: string }
        requestId:
          type: string
          description: Correlates with the access log's `X-Request-ID`.
        clientAddr: { type: string }
        reason:
          type: string
          description: |
            A short, server-authored explanation. Never a supplied value, and
            never a credential.
        occurredAt: { type: string, format: date-time }

    AuditListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    AuditSummary:
      type: object
      description: |
        Counters over a recent window, plus the whole-log total.

        `failedLogins` and `deniedActions` are the two numbers an administrator
        opens this page for: one is somebody trying to get in, the other is
        somebody already in trying to reach further than their role allows.
      required: [total, failedLogins, deniedActions, privilegedActions, windowHours]
      properties:
        total:
          type: integer
          description: Every record retained, not only those in the window.
        failedLogins: { type: integer }
        deniedActions: { type: integer }
        privilegedActions:
          type: integer
          description: |
            Host changes in the window: images actually acquired and containers
            actually replaced.

            Counts COMPLETIONS, not requests. A request that was refused,
            cancelled, or expired changed nothing, and counting it here would
            make this number an over-count -- which is how a security counter
            becomes one an administrator learns to ignore.
        windowHours:
          type: integer
          description: How far back the windowed counters look.
        byAction:
          type: object
          additionalProperties: { type: integer }
        byOutcome:
          type: object
          additionalProperties: { type: integer }
        lastEventAt: { type: string, format: date-time }

